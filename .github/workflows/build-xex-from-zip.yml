
name: X360 Web Total - Build and Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: x360-web-total-release
  cancel-in-progress: false

env:
  LIBXENON_IMAGE: free60/libxenon@sha256:3534d7952210ee5553790a1c1f12001145655e28f9e12a01ce151efe4b4f743d
  XELL_LAUNCH2_URL: https://github.com/mitchellwaite/XellLaunch2/releases/download/v2.2.0/XellLaunch2.xex
  XELL_LAUNCH2_SHA256: 49dd8666b83a7c7b37597affc46513fe2cb9ab5cb2fe1fb71da1b13175276bb0

jobs:
  build:
    name: Compile and package Xbox 360
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify project structure
        shell: bash
        run: |
          set -euo pipefail
          test -f VERSION
          test -d browser
          test -f browser/Makefile
          test -f scripts/package_usb.py
          test -f scripts/test_package_usb.py
          test -d usb/X360WebTotal
          echo "Project structure verified."
          echo "Version: $(cat VERSION)"

      - name: Run package tests
        run: python3 scripts/test_package_usb.py

      - name: Install host build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake gcc

      - name: Build and test host modules
        run: |
          cmake -S browser -B build-host \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc
          cmake --build build-host --parallel 2
          ctest --test-dir build-host --output-on-failure --no-tests=error

      - name: Pull LibXenon toolchain
        run: docker pull "$LIBXENON_IMAGE"

      - name: Compile Xbox 360 ELF
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$GITHUB_WORKSPACE/browser:/workspace/browser" \
            -w /workspace/browser \
            --entrypoint /bin/bash \
            "$LIBXENON_IMAGE" \
            -lc '
              set -euo pipefail
              export DEVKITXENON=/usr/local/xenon
              export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"
              make clean all DEVKITXENON="$DEVKITXENON"
            '

          test -s browser/xenon.elf

      - name: Download XellLaunch2
        shell: bash
        run: |
          set -euo pipefail

          curl --fail --location --retry 3 \
            "$XELL_LAUNCH2_URL" \
            -o XellLaunch2.xex

          echo "$XELL_LAUNCH2_SHA256  XellLaunch2.xex" \
            | sha256sum --check

      - name: Create USB package
        run: |
          python3 scripts/package_usb.py \
            --elf browser/xenon.elf \
            --xell XellLaunch2.xex \
            --project "$GITHUB_WORKSPACE" \
            --output X360-Web-Total-USB.zip

          test -s X360-Web-Total-USB.zip

      - name: Generate checksums
        run: |
          sha256sum \
            X360-Web-Total-USB.zip \
            browser/xenon.elf \
            XellLaunch2.xex \
            > SHA256SUMS-RELEASE.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: X360-Web-Total-Xbox360
          path: |
            X360-Web-Total-USB.zip
            browser/xenon.elf
            XellLaunch2.xex
            SHA256SUMS-RELEASE.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: X360 Web Total ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            X360-Web-Total-USB.zip
            browser/xenon.elf
            XellLaunch2.xex
            SHA256SUMS-RELEASE.txt

      - name: Build summary
        if: always()
        run: |
          echo "## X360 Web Total" >> "$GITHUB_STEP_SUMMARY"
          echo "Build result: ${{ job.status }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Tag: ${{ github.ref_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "A physical Xbox 360 test is still required." >> "$GITHUB_STEP_SUMMARY"
