name: XWT OS - Build Traditional Distro

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  XWT_VERSION: 2.0.0
  BUILDROOT_COMMIT: 15b0457158bbe24264ab241cbe87c52b4d659f4e
  FREE60_COMMIT: 3c3e76fb1ffa3bcce3a50a6af6b847a2da25139f
  KERNEL_VERSION: '7.2'

concurrency:
  group: xwt-traditional-distro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-core:
    name: Build Xenon kernel and Buildroot runtime
    uses: ./.github/workflows/build-core.yml
    with:
      buildroot_commit: 15b0457158bbe24264ab241cbe87c52b4d659f4e
      free60_commit: 3c3e76fb1ffa3bcce3a50a6af6b847a2da25139f
      kernel_version: '7.2'
    secrets: inherit

  build-bootloader:
    name: Build XWT Boot Manager
    uses: ./.github/workflows/build-bootloader.yml
    with:
      free60_commit: 3c3e76fb1ffa3bcce3a50a6af6b847a2da25139f
    secrets: inherit

  build-distro:
    name: Assemble Debian Ports ppc64 distro
    needs: [build-core, build-bootloader]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout XWT source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Debian rootfs build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            debootstrap qemu-user-static binfmt-support cpio zstd rsync zip \
            dosfstools e2fsprogs parted util-linux file python3 dpkg-dev \
            ca-certificates curl wget gzip tar xz-utils
          sudo update-binfmts --enable qemu-ppc64
          qemu-ppc64-static --version
          debootstrap --version

      - name: Download Xenon kernel and Buildroot support artifacts
        uses: actions/download-artifact@v8
        with:
          name: xwt-linux-core-${{ github.sha }}
          path: ${{ runner.temp }}/xwt-core-artifact

      - name: Download XWT bootloader artifacts
        uses: actions/download-artifact@v8
        with:
          name: xwt-bootloader-${{ github.sha }}
          path: ${{ runner.temp }}/xwt-boot-artifact

      - name: Extract and validate the complete XWT source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          SOURCE_ARCHIVE="$RUNNER_TEMP/XWT-Linux-source.zip"
          PROJECT_DEST="$RUNNER_TEMP/xwt-project"

          if [[ -s "$GITHUB_WORKSPACE/XWT-Linux-source.zip" ]]; then
            cp "$GITHUB_WORKSPACE/XWT-Linux-source.zip" "$SOURCE_ARCHIVE"
          else
            python3 - "$GITHUB_WORKSPACE" "$SOURCE_ARCHIVE" <<'PYWRAPPER'
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          root, output = Path(sys.argv[1]), Path(sys.argv[2])
          direct = root / "XWT-Linux-source.zip"
          named_sources = sorted(p for p in root.glob("XWT-Linux-source*.zip") if p.is_file())
          if direct.is_file():
              shutil.copyfile(direct, output)
          elif len(named_sources) == 1:
              shutil.copyfile(named_sources[0], output)
          else:
              candidates = sorted(root.glob("XWT-Linux-GitHub-Upload*.zip"))
              candidates += sorted(root.glob("XWT-Linux-*-setup*.zip"))
              candidates = list(dict.fromkeys(p for p in candidates if p.is_file()))
              if len(candidates) != 1:
                  raise SystemExit("Expected one XWT-Linux-source*.zip or one outer upload ZIP; found source ZIPs: " +
                                   ", ".join(p.name for p in named_sources))
              wrapper = candidates[0]
              with zipfile.ZipFile(wrapper) as archive:
                  members = [m for m in archive.infolist()
                             if PurePosixPath(m.filename).name == "XWT-Linux-source.zip"
                             and not m.is_dir()]
                  if len(members) != 1:
                      raise SystemExit("Outer ZIP must contain exactly one XWT-Linux-source.zip")
                  member = members[0]
                  path = PurePosixPath(member.filename)
                  mode = member.external_attr >> 16
                  if (path.is_absolute() or ".." in path.parts or "\\" in member.filename
                      or stat.S_ISLNK(mode) or member.file_size > 128 * 1024 * 1024):
                      raise SystemExit("Unsafe or oversized embedded source archive")
                  with archive.open(member) as src, output.open("wb") as dst:
                      while chunk := src.read(1024 * 1024):
                          dst.write(chunk)
          if not output.is_file() or output.stat().st_size == 0:
              raise SystemExit("Could not extract XWT-Linux-source.zip")
          PYWRAPPER
          fi

          python3 - "$SOURCE_ARCHIVE" "$PROJECT_DEST" <<'PY'
          import hashlib
          import re
          import shutil
          import stat
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive_path, destination = Path(sys.argv[1]), Path(sys.argv[2])
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)
          with zipfile.ZipFile(archive_path) as archive:
              infos = archive.infolist()
              names = [item.filename for item in infos]
              if len(names) != len(set(names)):
                  raise SystemExit("Source ZIP contains duplicate paths")
              total = 0
              for item in infos:
                  name = item.filename
                  path = PurePosixPath(name)
                  mode = item.external_attr >> 16
                  if (path.is_absolute() or ".." in path.parts or "\\" in name
                      or (path.parts and path.parts[0].endswith(":"))
                      or stat.S_ISLNK(mode)):
                      raise SystemExit("Unsafe path in source ZIP: " + name)
                  total += item.file_size
                  if item.file_size > 128 * 1024 * 1024 or total > 512 * 1024 * 1024:
                      raise SystemExit("Source ZIP exceeds extraction limits")
                  if item.is_dir():
                      continue
                  target = destination.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with archive.open(item) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
                  target.chmod(0o755 if mode & 0o111 else 0o644)

          for required in ("VERSION", "REVISION.txt", "SOURCE-MANIFEST.sha256",
                           "distro/build-rootfs.sh", "distro/installer/install-usb.sh",
                           "linux/xenon-7.2.defconfig"):
              if not (destination / required).is_file():
                  raise SystemExit("Missing required source file: " + required)
          if (destination / "VERSION").read_text().strip() != "2.0.0":
              raise SystemExit("Unexpected source VERSION")
          expected_revision = "xwt-linux-2.0.0-desktop-gamepad-network-video"
          if (destination / "REVISION.txt").read_text().strip() != expected_revision:
              raise SystemExit("Unexpected source revision")

          manifest = destination / "SOURCE-MANIFEST.sha256"
          expected = {}
          for line in manifest.read_text(encoding="ascii").splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
              if not match:
                  raise SystemExit("Invalid SOURCE-MANIFEST.sha256 line")
              digest, name = match.groups()
              if name in expected:
                  raise SystemExit("Duplicate manifest path: " + name)
              expected[name] = digest
          actual = {p.relative_to(destination).as_posix()
                    for p in destination.rglob("*") if p.is_file()
                    and p.name != "SOURCE-MANIFEST.sha256"
                    and "__pycache__" not in p.parts and p.suffix != ".pyc"}
          expected = {name: digest for name, digest in expected.items()
                      if "__pycache__" not in name.split("/") and not name.endswith(".pyc")}
          if actual != set(expected):
              raise SystemExit("Source manifest file set mismatch")
          for name, digest in expected.items():
              actual_digest = hashlib.sha256((destination / name).read_bytes()).hexdigest()
              if actual_digest != digest:
                  raise SystemExit("Source manifest hash mismatch: " + name)
          print(f"Validated {len(expected)} source files at {destination}")
          PY
          echo "PROJECT_DIR=$PROJECT_DEST" >> "$GITHUB_ENV"

      - name: Normalize build artifact directories
        id: inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          CORE="$RUNNER_TEMP/xwt-core-artifact/buildroot-output/images"
          BOOT="$RUNNER_TEMP/xwt-boot-normalized"
          mkdir -p "$BOOT"
          for f in zImage.xenon rootfs-full.cpio.gz; do
            test -s "$CORE/$f" || { echo "Missing core artifact: $CORE/$f" >&2; exit 1; }
          done
          test -s "$RUNNER_TEMP/xwt-boot-artifact/xenon.elf"
          test -s "$RUNNER_TEMP/xwt-boot-artifact/xell/xwt-1f.bin"
          test -s "$RUNNER_TEMP/xwt-boot-artifact/xell/xwt-2f.bin"
          cp "$RUNNER_TEMP/xwt-boot-artifact/xenon.elf" "$BOOT/xenon.elf"
          cp "$RUNNER_TEMP/xwt-boot-artifact/xell/xwt-1f.bin" "$BOOT/xwt-1f.bin"
          cp "$RUNNER_TEMP/xwt-boot-artifact/xell/xwt-2f.bin" "$BOOT/xwt-2f.bin"
          echo "core_dir=$CORE" >> "$GITHUB_OUTPUT"
          echo "boot_dir=$BOOT" >> "$GITHUB_OUTPUT"

      - name: Build traditional Debian Ports root filesystem
        shell: bash
        env:
          XWT_CORE_DIR: ${{ runner.temp }}/xwt-core-artifact/buildroot-output/images
          XWT_BOOT_DIR: ${{ runner.temp }}/xwt-boot-normalized
          XWT_VERSION: 2.0.0
          DEBIAN_PORTS_MIRROR: https://ftp.ports.debian.org/debian-ports
          DEBIAN_PORTS_SUITE: unstable
        run: |
          set -Eeuo pipefail
          sudo env \
            XWT_CORE_DIR="$XWT_CORE_DIR" \
            XWT_BOOT_DIR="$XWT_BOOT_DIR" \
            XWT_VERSION="$XWT_VERSION" \
            DEBIAN_PORTS_MIRROR="$DEBIAN_PORTS_MIRROR" \
            DEBIAN_PORTS_SUITE="$DEBIAN_PORTS_SUITE" \
            bash "$PROJECT_DIR/distro/build-rootfs.sh"

      - name: Create release ZIP
        shell: bash
        run: |
          set -Eeuo pipefail
          DISTRO_OUT="$PROJECT_DIR/out/distro"
          test -s "$DISTRO_OUT/rootfs.tar.zst"
          RELEASE_DIR="$RUNNER_TEMP/xwt-release"
          mkdir -p "$RELEASE_DIR"
          cp -a "$DISTRO_OUT/." "$RELEASE_DIR/"
          (cd "$RELEASE_DIR" && zip -0 -r \
            "$RUNNER_TEMP/XWT-OS-Traditional-Xbox360-2.0.0.zip" .)
          cp "$RUNNER_TEMP/XWT-OS-Traditional-Xbox360-2.0.0.zip" "$RELEASE_DIR/"
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"
          ls -lh "$RELEASE_DIR"

      - name: Upload XWT OS traditional release
        uses: actions/upload-artifact@v7
        with:
          name: xwt-os-traditional-${{ github.sha }}
          path: ${{ runner.temp }}/xwt-release/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## XWT OS — Debian Ports ppc64'
            echo '- Base: Debian Ports unstable, ppc64 big-endian'
            echo '- Init: systemd'
            echo '- Package manager: apt/dpkg'
            echo '- Root filesystem: persistent ext4 (USB)'
            echo '- Boot: XWT Boot + zImage.xenon, direct root mount'
            echo '- Hardware: Xbox 360 Xenon-specific kernel and XWT SDL services'
            echo '- Physical Xbox 360 boot test: not performed by GitHub Actions'
          } >> "$GITHUB_STEP_SUMMARY"
