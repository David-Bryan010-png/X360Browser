  deploy-pages:
    name: Publicar interface MEVA Pages
    if: ${{ inputs.mode == 'install' }}
    needs: install
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar MEVA CODE
        id: deployment
        uses: actions/deploy-pages@v4

  ai:
    name: Executar agente MEVA V13 — projeto Linux ZIP
    if: ${{ inputs.mode == 'chat' || inputs.mode == 'agent' || inputs.mode == 'linux_zip' || inputs.mode == 'self_test' || inputs.mode == 'resume' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 140
    permissions:
      contents: write
    steps:
      - name: Baixar branch de trabalho
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v5
