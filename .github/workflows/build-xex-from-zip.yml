name: XWT OS 2.0.0 - Build Traditional Xbox 360 Distro

on:
  workflow_dispatch:
    inputs:
      buildroot_commit:
        description: "Buildroot commit (pinned by default)"
        required: false
        type: string
        default: "15b0457158bbe24264ab241cbe87c52b4d659f4e"
      free60_commit:
        description: "Free60 Xenon kernel commit (pinned by default)"
        required: false
        type: string
        default: "3c3e76fb1ffa3bcce3a50a6af6b847a2da25139f"
      kernel_version:
        description: "Free60 Xenon kernel version"
        required: false
        type: string
        default: "7.2"

permissions:
  contents: read

concurrency:
  group: xwt-traditional-distro-${{ github.ref }}
  cancel-in-progress: false

env:
  XWT_VERSION: "2.0.0"
  XWT_REVISION: "xwt-linux-2.0.0-desktop-gamepad-network-video"
  BUILDROOT_COMMIT: ${{ inputs.buildroot_commit || '15b0457158bbe24264ab241cbe87c52b4d659f4e' }}
  FREE60_COMMIT: ${{ inputs.free60_commit || '3c3e76fb1ffa3bcce3a50a6af6b847a2da25139f' }}
  KERNEL_VERSION: ${{ inputs.kernel_version || '7.2' }}
  BR2_DL_DIR: /home/runner/.cache/xwt-buildroot-dl
  CCACHE_DIR: /home/runner/.cache/xwt-buildroot-ccache
  CCACHE_MAXSIZE: 1G
  LIBXENON_VERSION: '2024-12-15'

jobs:
  build-core:
    name: Build Kernel + Rootfs + Toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Free runner disk space
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR
        echo "Disk space before cleanup:"
        df -h
        sudo rm -rf -- \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/share/powershell \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/.ghcup \
          /usr/share/miniconda \
          /usr/local/lib/node_modules
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
        AVAILABLE="$(df -Pk /home/runner | awk 'NR==2 {print $4}')"
        if [ "$AVAILABLE" -lt 6291456 ]; then
          echo "ERROR: Menos de 6 GiB livres para compilar o core." >&2
          df -h
          exit 1
        fi
        echo "Disk space after cleanup:"
        df -h

    - name: Install host build dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential gcc g++ make bc bison flex gawk \
          ccache cpio file git curl wget patch rsync unzip zip \
          python3 python3-dev cmake pkg-config perl gettext ca-certificates busybox \
          libncurses-dev libssl-dev libelf-dev zlib1g-dev zstd xz-utils squashfs-tools
        git --version
        make --version
        python3 --version
        ccache --version

    - name: Restore Buildroot downloads and compiler cache
      id: build-cache
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/.cache/xwt-buildroot-dl
          ~/.cache/xwt-buildroot-ccache
        key: ${{ runner.os }}-xwt-core-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-cache-v3
        restore-keys: |
          ${{ runner.os }}-xwt-core-${{ env.BUILDROOT_COMMIT }}-
          ${{ runner.os }}-xwt-

    - name: Prepare caches
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR
        mkdir -p "$BR2_DL_DIR" "$CCACHE_DIR"
        ccache --set-config=max_size="$CCACHE_MAXSIZE"
        ccache --set-config=compression=true
        ccache --show-stats

    - name: Extract and validate source archive
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR
        SOURCE_ARCHIVE="$RUNNER_TEMP/XWT-Linux-source.zip"
        PROJECT_DEST="$RUNNER_TEMP/xwt-project"

        if [ -s "$GITHUB_WORKSPACE/XWT-Linux-source.zip" ]; then
          cp "$GITHUB_WORKSPACE/XWT-Linux-source.zip" "$SOURCE_ARCHIVE"
          echo "Direct XWT source archive found."
        elif [ "$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'XWT-Linux-source-*.zip' | wc -l)" -eq 1 ]; then
          SOURCE_CANDIDATE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'XWT-Linux-source-*.zip' -print -quit)"
          cp "$SOURCE_CANDIDATE" "$SOURCE_ARCHIVE"
          echo "Using versioned XWT source archive: $(basename "$SOURCE_CANDIDATE")"
        else
          python3 - "$GITHUB_WORKSPACE" "$SOURCE_ARCHIVE" <<'PYWRAPPER'
        import stat
        import sys
        import zipfile
        from pathlib import Path, PurePosixPath

        root = Path(sys.argv[1])
        output = Path(sys.argv[2])

        candidates = sorted(root.glob("XWT-Linux-GitHub-Upload*.zip"))
        candidates += sorted(root.glob("XWT-Linux-*-setup*.zip"))
        candidates = list(dict.fromkeys(
            path for path in candidates if path.is_file()
        ))

        if len(candidates) != 1:
            raise SystemExit(
                "Expected exactly one XWT upload package. "
                "Found: " + ", ".join(path.name for path in candidates)
            )

        wrapper = candidates[0]

        with zipfile.ZipFile(wrapper) as archive:
            members = [
                member for member in archive.infolist()
                if PurePosixPath(member.filename).name == "XWT-Linux-source.zip"
                and not member.is_dir()
            ]

            if len(members) != 1:
                raise SystemExit(
                    "The outer ZIP must contain exactly one XWT-Linux-source.zip"
                )

            member = members[0]
            path = PurePosixPath(member.filename)
            mode = member.external_attr >> 16

            if (
                path.is_absolute()
                or ".." in path.parts
                or "\\" in member.filename
                or stat.S_ISLNK(mode)
            ):
                raise SystemExit("Unsafe path in outer ZIP")

            if member.file_size > 128 * 1024 * 1024:
                raise SystemExit("Embedded source archive exceeds 128 MiB")

            with archive.open(member) as source, output.open("wb") as destination:
                while True:
                    chunk = source.read(1024 * 1024)
                    if not chunk:
                        break
                    destination.write(chunk)

        if not output.is_file() or output.stat().st_size == 0:
            raise SystemExit("Could not extract XWT-Linux-source.zip")

        print(
            f"Extracted {output.stat().st_size} bytes from {wrapper.name}"
        )
        PYWRAPPER
        fi

        python3 - "$SOURCE_ARCHIVE" "$PROJECT_DEST" <<'PY'
        import hashlib
        import re
        import shutil
        import stat
        import sys
        import zipfile
        from pathlib import Path, PurePosixPath

        archive_path = Path(sys.argv[1])
        destination = Path(sys.argv[2])

        required = (
            "VERSION",
            "REVISION.txt",
            "linux/buildroot.config",
            "linux/busybox.fragment",
            "linux/xenon-7.2.defconfig",
            "linux/xwt-kernel.fragment",
            "linux/boot/kboot.conf",
            "linux/post-build.sh",
            "linux/overlay/etc/inittab",
            "linux/src/xwt-desktop.c",
            "linux/src/xwt-gamepad-keys.c",
            "linux/overlay/etc/init.d/S05zram",
            "linux/overlay/etc/init.d/S10modules",
            "linux/overlay/etc/init.d/S15gamepad",
            "linux/overlay/etc/init.d/S18video",
            "linux/overlay/etc/init.d/S30storage",
            "linux/overlay/etc/init.d/S35audio",
            "linux/overlay/usr/sbin/xwt-audio",
            "linux/overlay/usr/sbin/xwt-video",
            "scripts/test_xwt_audio_video.py",
            "scripts/test_preflight.py",
            "tools/xwt-preflight.py",
            "linux/overlay/etc/init.d/S40network",
            "linux/overlay/etc/init.d/S46time",
            "linux/overlay/etc/xwt/wpa_supplicant.conf.example",
            "linux/overlay/usr/sbin/xwt-system-menu",
            "linux/overlay/usr/sbin/xwt-system-menu-text",
            "linux/overlay/usr/sbin/xwt-network",
            "linux/overlay/usr/sbin/xwt-storage",
            "tools/xwt-kboot.py",
            "docs/BOOT-TROUBLESHOOTING-PT-BR.md",
            "docs/PACKS-PT-BR.md",
            "scripts/test_xwt_storage.py",
            "scripts/test_kboot_menu.py",
            "scripts/test_split_rootfs.py",
            "scripts/test_xwt_game.py",
            "scripts/test_xwt_apps.py",
            "scripts/test_xwt_persist.py",
            "scripts/test_xwt_boot.py",
            "scripts/make_manifest.py",
            "scripts/test_source_manifest.py",
            "linux/overlay/usr/sbin/xwt-game",
            "linux/overlay/usr/sbin/xwt-apps",
            "linux/overlay/usr/sbin/xwt-persist",
            "linux/src/xwt-osk.c",
            "boot/patch_xwt_boot.py",
            "linux/overlay/usr/sbin/xwt-doctor",
            "linux/overlay/etc/init.d/S90report",
            "scripts/split_rootfs.py",
            "linux/packs.rules",
            "linux/overlay/usr/sbin/xwt-packs",
            "linux/overlay/usr/sbin/xwt-wifi",
            "linux/overlay/usr/sbin/xwt-video-check",
            "linux/overlay/usr/sbin/xwt-update",
            "scripts/package_linux_usb.py",
            "scripts/test_package_linux_usb.py",
            "scripts/package_xwpkg.py",
            "scripts/test_xwpkg.py",
            "scripts/test_nand_boundary.py",
            "scripts/test_linux_network.py",
            "scripts/test_minimal_core.py",
            "scripts/test_updater_runtime.py",
            "scripts/test_xwt_gamepad.py",
            "scripts/test_xwt_desktop.py",
            "scripts/test_xwt_wifi.py",
            "scripts/xenos_patchlib.py",
            "scripts/patch_xenos_driver.py",
            "scripts/test_xenos_patch.py",
            "scripts/test_xenos_tiling.py",
            "SOURCE-MANIFEST.sha256",
            "updates/system/opt/xwt/modules/system/bin/xwt-status",
            "README-INSTALL-PT-BR.txt",
        )

        shutil.rmtree(destination, ignore_errors=True)
        destination.mkdir(parents=True)

        with zipfile.ZipFile(archive_path) as archive:
            infos = archive.infolist()
            names = [info.filename for info in infos]

            if len(names) != len(set(names)):
                raise SystemExit("ZIP contains duplicate paths")

            total_size = 0

            for info in infos:
                name = info.filename
                path = PurePosixPath(name)
                mode = info.external_attr >> 16

                if (
                    path.is_absolute()
                    or ".." in path.parts
                    or "\\" in name
                    or (path.parts and path.parts[0].endswith(":"))
                    or stat.S_ISLNK(mode)
                ):
                    raise SystemExit("Unsafe path in source ZIP: " + name)

                total_size += info.file_size

                if (
                    info.file_size > 128 * 1024 * 1024
                    or total_size > 512 * 1024 * 1024
                ):
                    raise SystemExit("Source ZIP exceeds extraction limits")

                if info.is_dir():
                    continue

                target = destination.joinpath(*path.parts)
                target.parent.mkdir(parents=True, exist_ok=True)

                with archive.open(info) as source, target.open("wb") as output:
                    shutil.copyfileobj(source, output)

                target.chmod(0o755 if mode & 0o111 else 0o644)

        missing = [
            name for name in required
            if not (destination / name).is_file()
        ]

        if missing:
            raise SystemExit(
                "Incomplete XWT source archive: " + ", ".join(missing)
            )

        if (destination / "VERSION").read_text().strip() != "2.0.0":
            raise SystemExit("Incorrect XWT source version")

        expected_revision = "xwt-linux-2.0.0-desktop-gamepad-network-video"

        if (destination / "REVISION.txt").read_text().strip() != expected_revision:
            raise SystemExit("Incorrect XWT source revision")

        manifest = destination / "SOURCE-MANIFEST.sha256"
        expected = {}

        for line in manifest.read_text(encoding="ascii").splitlines():
            match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)

            if not match:
                raise SystemExit("Invalid SOURCE-MANIFEST.sha256 line")

            digest, name = match.groups()

            if name in expected:
                raise SystemExit("Duplicate manifest path: " + name)

            expected[name] = digest

        if not expected:
            raise SystemExit("Source manifest is empty")

        actual_files = {
            file.relative_to(destination).as_posix()
            for file in destination.rglob("*")
            if file.is_file()
            and file.name != "SOURCE-MANIFEST.sha256"
            and "__pycache__" not in file.parts
            and not file.name.endswith(".pyc")
        }
        expected = {
            name: digest
            for name, digest in expected.items()
            if "__pycache__" not in name.split("/")
            and not name.endswith(".pyc")
        }

        if actual_files != set(expected):
            missing_from_manifest = actual_files - set(expected)
            missing_from_archive = set(expected) - actual_files
            raise SystemExit(
                "Source manifest mismatch. "
                f"Unlisted files: {sorted(missing_from_manifest)}; "
                f"missing files: {sorted(missing_from_archive)}"
            )

        for name, digest in expected.items():
            actual = hashlib.sha256(
                (destination / name).read_bytes()
            ).hexdigest()

            if actual != digest:
                raise SystemExit("SHA-256 mismatch: " + name)

        print(
            f"Validated XWT 2.0.0 source: {len(expected)} SHA-256 entries."
        )
        PY

        mkdir -p "$PROJECT_DEST/.github/workflows"

        # Copy workflows from repo
        for wf in "$GITHUB_WORKSPACE"/.github/workflows/*.yml \
                  "$GITHUB_WORKSPACE"/.github/workflows/*.yaml; do
          [ -f "$wf" ] || continue
          cp "$wf" "$PROJECT_DEST/.github/workflows/$(basename "$wf")"
        done

        echo "PROJECT_DIR=$PROJECT_DEST" >> "$GITHUB_ENV"

    - name: Run host package and safety tests
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR
        cd "$PROJECT_DIR/scripts"

        if ! python3 -m unittest -v \
          test_package_linux_usb \
          test_xwpkg \
          test_nand_boundary \
          test_linux_network \
          test_minimal_core \
          test_updater_runtime \
          test_xwt_gamepad \
          test_xwt_desktop \
          test_xwt_wifi \
          test_xwt_storage \
          test_kboot_menu \
          test_split_rootfs \
          test_xwt_game \
          test_xwt_apps \
          test_xwt_persist \
          test_xwt_boot \
          test_source_manifest \
          test_xwt_audio_video \
          test_preflight \
          test_xenos_patch \
          test_xenos_tiling > "$RUNNER_TEMP/unittest.log" 2>&1; then
          cat "$RUNNER_TEMP/unittest.log" | tail -n 120
          FAILED="$(grep -E '^(ERROR|FAIL):' "$RUNNER_TEMP/unittest.log" | tr '\n' ';' | cut -c1-900 || true)"
          DETAIL="$(grep -E '(Error|Exception|assert)' "$RUNNER_TEMP/unittest.log" | head -n 8 | tr '\n' ';' | cut -c1-900 || true)"
          echo "::error title=Testes falharam::${FAILED} ${DETAIL}"
          exit 1
        fi
        tail -n 5 "$RUNNER_TEMP/unittest.log"

    - name: Fetch pinned Free60 Xenon kernel port
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        FREE60_DIR="$RUNNER_TEMP/free60-xenon"

        git init "$FREE60_DIR"
        git -C "$FREE60_DIR" remote add origin \
          https://github.com/Free60Project/linux-kernel-xbox360.git

        git -C "$FREE60_DIR" fetch --depth=1 origin "$FREE60_COMMIT"
        git -C "$FREE60_DIR" checkout --detach FETCH_HEAD

        ACTUAL_COMMIT="$(git -C "$FREE60_DIR" rev-parse HEAD)"

        test "$ACTUAL_COMMIT" = "$FREE60_COMMIT"
        test -s "$FREE60_DIR/xenon-7.2.defconfig"
        test -s "$FREE60_DIR/patch-7.2-xenon0.30.diff"

        python3 - "$FREE60_DIR/patch-7.2-xenon0.30.diff" <<'PY'
        import re
        import sys
        from pathlib import Path

        patch = Path(sys.argv[1]).read_text(
            encoding="utf-8",
            errors="replace"
        )

        required = {
            "CONFIG_PPC_XENON":
                r"(?m)^\+\s*config\s+PPC_XENON\s*$",

            "PPC64 dependency":
                r"(?m)^\+\s*depends\s+on\s+PPC64\s*$",

            "PPC_XENON default":
                r"(?m)^\+\s*default\s+y\s*$",

            "Xenon image rule":
                r"(?m)^\+image-\$\(CONFIG_PPC_XENON\)\s*\+=\s*zImage\.xenon\s*$",

            "zImage.xenon target":
                r"(?m)^\+\$\(obj\)/zImage\.xenon:\s*\$\(obj\)/vmlinux\.strip\s*$",

            "ELF32 PowerPC conversion":
                r"(?m)^\+\s*@?\$\(OBJCOPY\)\s+-O\s+elf32-powerpc\s+\$<\s+\$@\s*$",
        }

        missing = [
            name
            for name, pattern in required.items()
            if re.search(pattern, patch) is None
        ]

        if missing:
            raise SystemExit(
                "Free60 patch incompatible or incomplete: "
                + ", ".join(missing)
            )

        print(
            "Free60 patch validated: Xenon platform and ELF32 wrapper found."
        )
        PY

        cp \
          "$FREE60_DIR/xenon-7.2.defconfig" \
          "$PROJECT_DIR/linux/xenon-7.2.defconfig"

        printf '%s\n' "$FREE60_COMMIT" \
          > "$PROJECT_DIR/linux/FREE60-KERNEL-COMMIT.txt"

        python3 - \
          "$PROJECT_DIR/linux/xenon-7.2.defconfig" \
          "$PROJECT_DIR/linux/xwt-kernel.fragment" <<'PY'
        import re
        import sys
        from pathlib import Path

        path = Path(sys.argv[1])
        fragment = Path(sys.argv[2])

        # Fragment lines: CONFIG_X=v  or  "# CONFIG_X is not set"
        options = {}
        pattern = re.compile(r"^(?:# )?(CONFIG_[A-Z0-9_]+)(?:=(.*)| is not set)$")
        for raw in fragment.read_text().splitlines():
            line = raw.strip()
            match = pattern.match(line)
            if not match:
                continue
            options[match.group(1)] = match.group(2)  # None => "is not set"

        kept = []
        for line in path.read_text().splitlines():
            match = pattern.match(line)
            if match and match.group(1) in options:
                continue
            kept.append(line)

        for key, value in options.items():
            kept.append(f"# {key} is not set" if value in (None, "n") else f"{key}={value}")

        path.write_text("\n".join(kept) + "\n")
        print(f"Applied {len(options)} XWT kernel options from {fragment.name}.")
        PY

        for required in \
          '^CONFIG_PPC64=y$' \
          '^CONFIG_BLK_DEV_INITRD=y$' \
          '^CONFIG_RD_GZIP=y$' \
          '^CONFIG_DRM_XENOS=y$' \
          '^CONFIG_SIS190=y$' \
          '^CONFIG_USB_STORAGE=y$' \
          '^CONFIG_JOYSTICK_XPAD=m$' \
          '^CONFIG_INPUT_KEYBOARD=y$' \
          '^CONFIG_INPUT_JOYDEV=m$' \
          '^CONFIG_INPUT_UINPUT=m$' \
          '^CONFIG_LEGACY_TIOCSTI=y$' \
          '^CONFIG_TMPFS=y$' \
          '^CONFIG_DEVTMPFS=y$' \
          '^CONFIG_VFAT_FS=y$' \
          '^CONFIG_BLK_DEV_LOOP=y$' \
          '^CONFIG_SQUASHFS=y$' \
          '^CONFIG_SQUASHFS_ZSTD=y$' \
          '^CONFIG_OVERLAY_FS=y$' \
          '^CONFIG_SND_USB_AUDIO=m$'; do

          grep -q "$required" \
            "$PROJECT_DIR/linux/xenon-7.2.defconfig" || {
              echo "Free60 defconfig option missing: $required" >&2
              exit 1
            }
        done

        git -C "$FREE60_DIR" rev-parse HEAD \
          > "$RUNNER_TEMP/free60-commit.txt"

    - name: Fetch pinned Buildroot
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        BUILDROOT_DIR="$RUNNER_TEMP/buildroot"

        git init "$BUILDROOT_DIR"
        git -C "$BUILDROOT_DIR" remote add origin \
          https://github.com/buildroot/buildroot.git

        git -C "$BUILDROOT_DIR" fetch --depth=1 origin "$BUILDROOT_COMMIT"
        git -C "$BUILDROOT_DIR" checkout --detach FETCH_HEAD

        ACTUAL_COMMIT="$(git -C "$BUILDROOT_DIR" rev-parse HEAD)"

        test "$ACTUAL_COMMIT" = "$BUILDROOT_COMMIT"

        echo "BUILDROOT_DIR=$BUILDROOT_DIR" >> "$GITHUB_ENV"

        git -C "$BUILDROOT_DIR" rev-parse HEAD \
          > "$RUNNER_TEMP/buildroot-commit.txt"

    - name: Configure Buildroot for the 2.0.0 desktop system
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        OUTPUT="$RUNNER_TEMP/buildroot-output"
        mkdir -p "$OUTPUT"

        cp "$PROJECT_DIR/linux/buildroot.config" "$OUTPUT/.config"

        sed -i \
          -e "s|@PROJECT_ROOT@|$PROJECT_DIR|g" \
          -e "s|@FREE60_ROOT@|$RUNNER_TEMP/free60-xenon|g" \
          -e "s|@BUILDROOT_OUTPUT@|$OUTPUT|g" \
          "$OUTPUT/.config"

        python3 - "$OUTPUT/.config" "$HOME" "$RUNNER_TEMP/free60-xenon" <<'PY'
        import sys
        from pathlib import Path

        path = Path(sys.argv[1])
        home = sys.argv[2]
        free60_dir = sys.argv[3]

        lines = path.read_text().splitlines()

        values = {
            "BR2_KERNEL_HEADERS_7_2": "y",
            "BR2_TOOLCHAIN_BUILDROOT": "y",
            "BR2_TOOLCHAIN_BUILDROOT_GLIBC": "y",
            "BR2_PACKAGE_BUSYBOX_SHOW_OTHERS": "y",
            "BR2_CCACHE": "y",
            "BR2_CCACHE_DIR":
                f'"{home}/.cache/xwt-buildroot-ccache"',
            "BR2_LINUX_KERNEL_INSTALL_TARGET":"y",
            "BR2_LINUX_KERNEL_PATCH":
                f'"{free60_dir}/patch-7.2-xenon0.30.diff"',
        }

        for symbol, value in values.items():
            lines = [
                line for line in lines
                if not line.startswith(symbol + "=")
                and line != f"# {symbol} is not set"
            ]

            if value == "n":
                lines.append(f"# {symbol} is not set")
            else:
                lines.append(f"{symbol}={value}")

        path.write_text("\n".join(lines) + "\n")
        PY

        make -C "$BUILDROOT_DIR" O="$OUTPUT" olddefconfig \
          2>&1 | tee "$RUNNER_TEMP/buildroot-configure.log"

        CONFIG="$OUTPUT/.config"

        require() {
          grep -Fqx "$1" "$CONFIG" || {
            echo "Buildroot config missing: $1" >&2
            exit 1
          }
        }

        require 'BR2_powerpc64=y'
        require 'BR2_powerpc_970=y'
        require 'BR2_INIT_BUSYBOX=y'
        require 'BR2_KERNEL_HEADERS_7_2=y'
        require 'BR2_TOOLCHAIN_BUILDROOT=y'
        require 'BR2_TOOLCHAIN_BUILDROOT_GLIBC=y'
        require 'BR2_TOOLCHAIN_USES_GLIBC=y'
        require 'BR2_PACKAGE_BUSYBOX=y'
        require 'BR2_PACKAGE_KMOD=y'
        require 'BR2_PACKAGE_PRBOOM=y'
        require 'BR2_PACKAGE_DOOM_WAD=y'
        require 'BR2_PACKAGE_LBREAKOUT2=y'
        require 'BR2_PACKAGE_LTRIS=y'
        require 'BR2_PACKAGE_OPENTYRIAN=y'
        require 'BR2_PACKAGE_MPG123=y'
        require 'BR2_PACKAGE_FBV=y'
        require 'BR2_PACKAGE_FBGRAB=y'
        require 'BR2_PACKAGE_UNZIP=y'
        require 'BR2_PACKAGE_SDL_MIXER=y'
        require 'BR2_PACKAGE_SDL_TTF=y'
        require 'BR2_PACKAGE_ALSA_UTILS_AMIXER=y'
        require 'BR2_PACKAGE_ALSA_UTILS_SPEAKER_TEST=y'
        require 'BR2_PACKAGE_KMOD_TOOLS=y'
        require 'BR2_PACKAGE_IPROUTE2=y'
        require 'BR2_PACKAGE_LIBCURL=y'
        require 'BR2_PACKAGE_LIBCURL_CURL=y'
        require 'BR2_PACKAGE_OPENSSL=y'
        require 'BR2_PACKAGE_CA_CERTIFICATES=y'
        require 'BR2_LINUX_KERNEL=y'
        require 'BR2_LINUX_KERNEL_INSTALL_TARGET=y'
        require 'BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="7.2"'
        require 'BR2_LINUX_KERNEL_IMAGE_TARGET_NAME="zImage.xenon"'
        require 'BR2_TARGET_ROOTFS_CPIO=y'
        require 'BR2_TARGET_ROOTFS_CPIO_GZIP=y'

        for required in \
          'BR2_PACKAGE_SDL=y' \
          'BR2_PACKAGE_SDL_FBCON=y' \
          'BR2_PACKAGE_SDL_TTF=y' \
          'BR2_PACKAGE_DEJAVU=y' \
          'BR2_PACKAGE_DEJAVU_SANS=y' \
          'BR2_PACKAGE_DIALOG=y' \
          'BR2_PACKAGE_IW=y' \
          'BR2_PACKAGE_WPA_SUPPLICANT=y' \
          'BR2_PACKAGE_WPA_SUPPLICANT_NL80211=y' \
          'BR2_PACKAGE_WPA_SUPPLICANT_CLI=y' \
          'BR2_PACKAGE_ALSA_UTILS=y' \
          'BR2_PACKAGE_ALSA_UTILS_ALSAMIXER=y' \
          'BR2_PACKAGE_ALSA_UTILS_APLAY=y' \
          'BR2_PACKAGE_LINUX_FIRMWARE=y' \
          'BR2_PACKAGE_EVTEST=y'; do

          grep -Fqx "$required" "$CONFIG" || {
            echo "Buildroot config missing: $required" >&2
            exit 1
          }
        done

        if grep -Eq \
          '^BR2_PACKAGE_(NETSURF|PYTHON3)=' \
          "$CONFIG"; then

          echo "Unexpected large package enabled in base image." >&2
          grep -E \
            '^BR2_PACKAGE_(NETSURF|PYTHON3)=' \
            "$CONFIG" >&2
          exit 1
        fi

        echo "Buildroot configuration validated."

    - name: Prevent the Xenon kernel image from entering the PPC64 rootfs
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        MAKEFILE="$BUILDROOT_DIR/linux/linux.mk"

        python3 - "$MAKEFILE" <<'PY'
        import sys
        from pathlib import Path

        path = Path(sys.argv[1])
        content = path.read_text()

        old = "\t$(LINUX_INSTALL_KERNEL_IMAGE_TO_TARGET)\n"

        if content.count(old) != 1:
            raise SystemExit(
                "Unexpected Buildroot kernel-install rule; "
                "refusing to modify it."
            )

        replacement = (
            "\t# XWT: keep Xenon boot image in images/, "
            "outside the PPC64 rootfs.\n"
        )

        path.write_text(content.replace(old, replacement, 1))
        print("Xenon kernel image excluded from PPC64 rootfs installation.")
        PY

    - name: Preflight Xenon Linux Kconfig before full compilation
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        OUTPUT="$RUNNER_TEMP/buildroot-output"

        make -C "$BUILDROOT_DIR" O="$OUTPUT" linux-configure \
          2>&1 | tee "$RUNNER_TEMP/linux-configure.log"

        KERNEL_CONFIG="$(
          find "$OUTPUT/build" \
            -maxdepth 4 \
            -type f \
            -path '*/linux-*/.config' \
            -print -quit
        )"

        test -s "$KERNEL_CONFIG" || {
          echo "Linux Kconfig did not produce .config" >&2
          exit 1
        }

        for required in \
          '^CONFIG_PPC_XENON=y$' \
          '^CONFIG_PPC64=y$' \
          '^CONFIG_BLK_DEV_INITRD=y$' \
          '^CONFIG_RD_GZIP=y$' \
          '^CONFIG_DRM_XENOS=y$' \
          '^CONFIG_DRM_FBDEV_EMULATION=y$' \
          '^CONFIG_FRAMEBUFFER_CONSOLE=y$' \
          '^CONFIG_SIS190=y$' \
          '^CONFIG_USB_STORAGE=y$' \
          '^CONFIG_JOYSTICK_XPAD=m$' \
          '^CONFIG_INPUT_KEYBOARD=y$' \
          '^CONFIG_INPUT_JOYDEV=m$' \
          '^CONFIG_INPUT_UINPUT=m$' \
          '^CONFIG_LEGACY_TIOCSTI=y$' \
          '^CONFIG_SQUASHFS=y$' \
          '^CONFIG_OVERLAY_FS=y$' \
          '^CONFIG_BLK_DEV_LOOP=y$' \
          '^CONFIG_SND_USB_AUDIO=m$'; do

          grep -q "$required" "$KERNEL_CONFIG" || {
            echo "Generated Linux Kconfig missing: $required" >&2
            sed -n '/PPC_XENON/p;/PPC64/p' "$KERNEL_CONFIG" >&2 || true
            exit 1
          }
        done

        echo "Xenon Kconfig preflight passed."

    - name: Ensure Buildroot post-build script is executable
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        POST_BUILD="$PROJECT_DIR/linux/post-build.sh"

        test -s "$POST_BUILD" || {
          echo "linux/post-build.sh does not exist." >&2
          exit 1
        }

        chmod 0755 "$POST_BUILD"
        test -x "$POST_BUILD"

    - name: Patch Xenos DRM tiled framebuffer safely
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        python3 \
          "$PROJECT_DIR/scripts/patch_xenos_driver.py" \
          "$RUNNER_TEMP/buildroot-output"

        DRIVER="$(
          find "$RUNNER_TEMP/buildroot-output/build" \
            -maxdepth 6 \
            -type f \
            -path '*/drivers/gpu/drm/tiny/xenos.c' \
            -print -quit
        )"

        test -n "$DRIVER"
        test -s "$DRIVER"

        grep -q \
          'XWT-2.0.0: guarded 32x32 tiled scanout' \
          "$DRIVER"

        # The patcher emits valid C by construction (regression-tested). Fail the
        # build early here instead of deep inside the kernel compilation.
        if grep -nE '\\"|%ux%u$' "$DRIVER"; then
          echo "Xenos driver contains malformed C string literals." >&2
          exit 1
        fi
        grep -q 'Xenos requires 32-bit DMA addressing' "$DRIVER"
        echo "Xenos driver patch verified."

    - name: Build kernel and 2.0.0 desktop root filesystem
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        JOBS="$(nproc)"
        if [ "$JOBS" -gt 4 ]; then
          JOBS=4
        fi

        echo "Building XWT 2.0.0 with $JOBS workers."

        ccache --zero-stats || true

        make -C "$BUILDROOT_DIR" \
          O="$RUNNER_TEMP/buildroot-output" \
          -j"$JOBS" \
          2>&1 | tee "$RUNNER_TEMP/buildroot-build.log"

        OUTPUT="$RUNNER_TEMP/buildroot-output"
        TARGET="$OUTPUT/target"

        test -s "$OUTPUT/images/zImage.xenon" || { echo "ERROR: zImage.xenon missing"; exit 1; }
        test -s "$OUTPUT/images/rootfs.cpio.gz" || { echo "ERROR: rootfs.cpio.gz missing"; exit 1; }
        gzip -t "$OUTPUT/images/rootfs.cpio.gz"

        for bin in xwt-system-menu xwt-system-menu-text xwt-update xwt-storage xwt-network xwt-wifi xwt-video-check xwt-desktop xwt-gamepad-keys xwt-osk xwt-game xwt-apps xwt-persist xwt-doctor xwt-audio xwt-video xwt-packs; do
          test -x "$TARGET/usr/sbin/$bin" || {
            echo "ERROR: $bin missing from rootfs" >&2
            exit 1
          }
        done

        test -s "$TARGET/usr/share/fonts/dejavu/DejaVuSans.ttf"
        test -x "$TARGET/usr/bin/curl"
        test -d "$TARGET/lib/firmware"
        test ! -e "$TARGET/boot/zImage.xenon"
        test -d "$TARGET/lib/modules"

        KERNEL_CONFIG="$(
          find "$OUTPUT/build" \
            -maxdepth 4 \
            -type f \
            -path '*/linux-*/.config' \
            -print -quit
        )"

        test -s "$KERNEL_CONFIG"

        for required in \
          '^CONFIG_PPC_XENON=y$' \
          '^CONFIG_PPC64=y$' \
          '^CONFIG_BLK_DEV_INITRD=y$' \
          '^CONFIG_RD_GZIP=y$' \
          '^CONFIG_DRM_XENOS=y$' \
          '^CONFIG_DRM_FBDEV_EMULATION=y$' \
          '^CONFIG_FRAMEBUFFER_CONSOLE=y$' \
          '^CONFIG_SIS190=y$' \
          '^CONFIG_USB_STORAGE=y$' \
          '^CONFIG_JOYSTICK_XPAD=m$' \
          '^CONFIG_INPUT_KEYBOARD=y$' \
          '^CONFIG_INPUT_JOYDEV=m$' \
          '^CONFIG_INPUT_UINPUT=m$' \
          '^CONFIG_LEGACY_TIOCSTI=y$' \
          '^CONFIG_SQUASHFS=y$' \
          '^CONFIG_OVERLAY_FS=y$' \
          '^CONFIG_BLK_DEV_LOOP=y$' \
          '^CONFIG_SND_USB_AUDIO=m$'; do

          grep -q "$required" "$KERNEL_CONFIG" || {
            echo "Kernel config missing: $required" >&2
            exit 1
          }
        done

        for module in xpad joydev uinput snd-usb-audio; do
          find "$TARGET/lib/modules" \
            -type f \
            \( \
              -name "$module.ko" \
              -o -name "$module.ko.xz" \
              -o -name "$module.ko.zst" \
            \) \
            -print -quit | grep -q . || {
              echo "Missing kernel module: $module" >&2
              exit 1
            }
        done

        python3 - "$OUTPUT/images/rootfs.cpio.gz" <<'PY'
        import gzip
        import sys
        from pathlib import PurePosixPath

        def align(value):
            return (value + 3) & ~3

        names = set()
        executable = set()

        with gzip.open(sys.argv[1], "rb") as stream:
            while True:
                header = stream.read(110)

                if not header:
                    break

                if (
                    len(header) != 110
                    or header[:6] not in (b"070701", b"070702")
                ):
                    raise SystemExit("Invalid CPIO newc header")

                values = [
                    int(header[index:index + 8], 16)
                    for index in range(6, 110, 8)
                ]

                mode = values[1]
                size = values[6]
                name_size = values[11]

                raw_name = stream.read(name_size)

                if (
                    len(raw_name) != name_size
                    or not raw_name.endswith(b"\0")
                ):
                    raise SystemExit("Invalid CPIO filename")

                name = raw_name[:-1].decode("utf-8", "strict")

                while name.startswith("./"):
                    name = name[2:]

                if name == "TRAILER!!!":
                    break

                path = PurePosixPath(name)

                if (
                    path.is_absolute()
                    or ".." in path.parts
                    or "\\" in name
                ):
                    raise SystemExit("Unsafe CPIO path: " + name)

                stream.seek(
                    align(110 + name_size) - (110 + name_size),
                    1
                )

                names.add(name)

                if mode & 0o111:
                    executable.add(name)

                stream.seek(size, 1)
                stream.seek(align(size) - size, 1)

        required = {
            "etc/inittab",
            "sbin/mdev",
            "etc/init.d/S05zram",
            "etc/init.d/S10modules",
            "etc/init.d/S15gamepad",
            "etc/init.d/S18video",
            "etc/init.d/S30storage",
            "etc/init.d/S40network",
            "etc/init.d/S46time",
            "usr/sbin/xwt-system-menu",
            "usr/sbin/xwt-system-menu-text",
            "usr/sbin/xwt-update",
            "usr/sbin/xwt-network",
            "usr/sbin/xwt-storage",
            "usr/sbin/xwt-wifi",
            "usr/sbin/xwt-video-check",
            "usr/sbin/xwt-desktop",
            "usr/sbin/xwt-gamepad-keys",
            "usr/sbin/xwt-osk",
            "usr/sbin/xwt-persist",
            "usr/share/fonts/dejavu/DejaVuSans.ttf",
            "usr/bin/curl",
        }

        missing = required - names

        if missing:
            raise SystemExit(
                "Missing core files in initramfs: "
                + ", ".join(sorted(missing))
            )

        required_exec = {
            "etc/init.d/S05zram",
            "etc/init.d/S10modules",
            "etc/init.d/S15gamepad",
            "etc/init.d/S18video",
            "etc/init.d/S30storage",
            "etc/init.d/S40network",
            "etc/init.d/S46time",
            "usr/sbin/xwt-system-menu",
            "usr/sbin/xwt-system-menu-text",
            "usr/sbin/xwt-update",
            "usr/sbin/xwt-network",
            "usr/sbin/xwt-storage",
            "usr/sbin/xwt-wifi",
            "usr/sbin/xwt-video-check",
            "usr/sbin/xwt-desktop",
            "usr/sbin/xwt-gamepad-keys",
            "usr/sbin/xwt-osk",
            "usr/sbin/xwt-persist",
        }

        missing_exec = required_exec - executable

        if missing_exec:
            raise SystemExit(
                "Missing executable permissions: "
                + ", ".join(sorted(missing_exec))
            )

        print(f"Core initramfs checked: {len(names)} entries.")
        PY

        ccache --show-stats || true

    - name: Split rootfs into XeLL stage-1 initramfs and 30 MiB squashfs packs
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        OUTPUT="$RUNNER_TEMP/buildroot-output"
        command -v mksquashfs
        test -x "$OUTPUT/target/usr/games/prboom" || { echo "ERROR: PrBoom (Doom) missing from rootfs" >&2; exit 1; }
        cp "$OUTPUT/images/rootfs.cpio.gz" "$OUTPUT/images/rootfs-full.cpio.gz"
        rm -rf "$OUTPUT/images/xwt-split"
        python3 "$PROJECT_DIR/scripts/split_rootfs.py" \
          --target "$OUTPUT/target" \
          --rules "$PROJECT_DIR/linux/packs.rules" \
          --outdir "$OUTPUT/images/xwt-split" \
          --max-pack-mib 28

        # Stage 1 is what XeLL loads: it must still boot to the point of mounting the packs.
        python3 - "$OUTPUT/images/xwt-split/rootfs.cpio.gz" <<'PY'
        import gzip
        import sys

        data = gzip.decompress(open(sys.argv[1], "rb").read())
        required = [
            b"bin/busybox", b"etc/inittab", b"etc/init.d/rcS",
            b"etc/init.d/S30storage", b"usr/sbin/xwt-storage", b"usr/sbin/xwt-packs", b"usr/sbin/xwt-doctor",
            b"usr/sbin/xwt-system-menu", b"usr/sbin/xwt-system-menu-text", b"dev/console",
        ]
        missing = [r.decode() for r in required if r not in data]
        if missing:
            raise SystemExit("Stage-1 initramfs is missing: " + ", ".join(missing))
        print("Stage-1 initramfs contains the boot-critical files.")
        PY

        # The package step and size report use the small stage-1 image.
        cp "$OUTPUT/images/xwt-split/rootfs.cpio.gz" "$OUTPUT/images/rootfs.cpio.gz"
        gzip -t "$OUTPUT/images/rootfs.cpio.gz"
        {
          echo '### Pacotes (stage 2)'
          ls -l "$OUTPUT/images/xwt-split/" | sed 's/^/    /'
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Report image sizes against XeLL limits
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        OUTPUT="$RUNNER_TEMP/buildroot-output"
        LIMIT=$((32 * 1024 * 1024))
        KERNEL_BYTES="$(stat -c %s "$OUTPUT/images/zImage.xenon")"
        INITRD_BYTES="$(stat -c %s "$OUTPUT/images/rootfs.cpio.gz")"

        {
          echo '### Tamanhos x limites do XeLL'
          echo "- zImage.xenon: $((KERNEL_BYTES / 1024)) KiB"
          echo "- rootfs.cpio.gz: $((INITRD_BYTES / 1024)) KiB (limite do XeLL: $((LIMIT / 1024)) KiB)"
          echo ''
          echo 'Maiores diretorios do rootfs (KiB):'
          echo '```'
          du -x -k -d 3 "$OUTPUT/target" 2>/dev/null | sort -rn | head -n 15
          echo '```'
        } | tee -a "$GITHUB_STEP_SUMMARY"

        # XeLL refuses an initrd above 32 MiB and then loops back to its file scan.
        if [ "$INITRD_BYTES" -gt $((30 * 1024 * 1024)) ]; then
          echo "ERROR: rootfs.cpio.gz is too close to / above the XeLL 32 MiB initrd limit." >&2
          exit 1
        fi

    - name: Validate the XeLL-compatible Xenon boot wrapper
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        KERNEL="$RUNNER_TEMP/buildroot-output/images/zImage.xenon"

        test -s "$KERNEL" || {
          echo "Buildroot did not create images/zImage.xenon." >&2
          exit 1
        }

        file "$KERNEL"

        PYTHONPATH="$PROJECT_DIR/scripts" \
          python3 - "$KERNEL" <<'PY'
        import sys
        from pathlib import Path
        import package_linux_usb

        path = Path(sys.argv[1])

        package_linux_usb.validate_kernel(path)

        print(
            f"XeLL ELF32/PPC wrapper validated: "
            f"{path} ({path.stat().st_size} bytes)"
        )
        PY

    - name: Save cross-toolchain cache for future native modules
      if: success()
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Falha no passo::linha $LINENO: $BASH_COMMAND"' ERR

        CACHE_ROOT="$HOME/.cache/xwt-cross-toolchain"

        rm -rf "$CACHE_ROOT"
        mkdir -p "$CACHE_ROOT"

        test -d "$RUNNER_TEMP/buildroot-output/host"
        test -d "$RUNNER_TEMP/buildroot-output/staging"

        cp -a \
          "$RUNNER_TEMP/buildroot-output/host" \
          "$CACHE_ROOT/host"

        mkdir -p "$CACHE_ROOT/staging"

        cp -a \
          "$RUNNER_TEMP/buildroot-output/staging/." \
          "$CACHE_ROOT/staging/"

        du -sh "$CACHE_ROOT"

    - name: Persist cross-toolchain cache
      if: success()
      uses: actions/cache/save@v6
      with:
        path: ~/.cache/xwt-cross-toolchain
        key: ${{ runner.os }}-xwt-cross-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-desktop-core-v3

    - name: Save Buildroot caches
      if: ${{ always() && steps.build-cache.outcome == 'success' && steps.build-cache.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v6
      with:
        path: |
          ~/.cache/xwt-buildroot-dl
          ~/.cache/xwt-buildroot-ccache
        key: ${{ runner.os }}-xwt-core-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-cache-v3

    - name: Set output paths
      id: set-outputs
      shell: bash
      run: |
        echo "buildroot_output=$RUNNER_TEMP/buildroot-output" >> "$GITHUB_OUTPUT"
        echo "kernel_image=$RUNNER_TEMP/buildroot-output/images/zImage.xenon" >> "$GITHUB_OUTPUT"
        echo "initrd_image=$RUNNER_TEMP/buildroot-output/images/rootfs.cpio.gz" >> "$GITHUB_OUTPUT"
        echo "toolchain_cache_key=${{ runner.os }}-xwt-cross-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-desktop-core-v3" >> "$GITHUB_OUTPUT"

    - name: Copy kboot.conf to artifacts
      shell: bash
      run: |
        cp "$PROJECT_DIR/linux/boot/kboot.conf" "$RUNNER_TEMP/buildroot-output/images/kboot.conf"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: xwt-linux-core-${{ github.sha }}
        path: |
          ${{ runner.temp }}/buildroot-output/images/zImage.xenon
          ${{ runner.temp }}/buildroot-output/images/rootfs.cpio.gz
          ${{ runner.temp }}/buildroot-output/images/rootfs-full.cpio.gz
          ${{ runner.temp }}/buildroot-output/images/kboot.conf
          ${{ runner.temp }}/buildroot-output/images/xwt-split/
          ${{ runner.temp }}/buildroot-output/.config
          ${{ runner.temp }}/buildroot-configure.log
          ${{ runner.temp }}/linux-configure.log
          ${{ runner.temp }}/buildroot-build.log
          ${{ runner.temp }}/free60-commit.txt
          ${{ runner.temp }}/buildroot-commit.txt
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: Build summary
      if: always()
      shell: bash
      run: |-
        {
          echo '## XWT Linux 2.0.0 — Desktop + Controller + Connectivity'
          echo 'Build compiles the Xenon kernel, SDL2 desktop, controller bridge and full 2.0.0 root filesystem.'
          echo 'Includes Wi-Fi utilities and guarded Xenos tiled scanout correction; hardware support still requires console testing.'
          echo 'Boot: XWT Boot Manager (ELF32) -> PPC64 kernel + initramfs.'
          echo 'NAND writes: none. Physical Xbox 360 test: pending; automated CI is not a console test.'
        } >> "$GITHUB_STEP_SUMMARY"
  build-bootloader:
    name: Build XWT Boot Manager ELF32
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Free runner disk space
      shell: bash
      run: |
        set -Eeuo pipefail
        echo "Disk space before cleanup:"
        df -h
        sudo rm -rf -- \
          /usr/share/dotnet \
          /usr/local/lib/android \
          /opt/ghc \
          /usr/local/share/powershell \
          /usr/share/swift \
          /opt/hostedtoolcache/CodeQL \
          /usr/local/.ghcup \
          /usr/share/miniconda \
          /usr/local/lib/node_modules
        sudo apt-get clean
        sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
        echo "Disk space after cleanup:"
        df -h

    - name: Install host dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential gcc g++ make cmake pkg-config \
          python3 python3-dev libssl-dev git curl wget \
          device-tree-compiler
        git --version
        make --version

    - name: Extract and validate XWT source
      shell: bash
      run: |
        set -Eeuo pipefail
        SOURCE_ARCHIVE="$RUNNER_TEMP/XWT-Linux-source.zip"
        PROJECT_DEST="$RUNNER_TEMP/xwt-project"

        if [ -s "$GITHUB_WORKSPACE/XWT-Linux-source.zip" ]; then
          cp "$GITHUB_WORKSPACE/XWT-Linux-source.zip" "$SOURCE_ARCHIVE"
        elif [ "$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'XWT-Linux-source-*.zip' | wc -l)" -eq 1 ]; then
          SOURCE_CANDIDATE="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'XWT-Linux-source-*.zip' -print -quit)"
          cp "$SOURCE_CANDIDATE" "$SOURCE_ARCHIVE"
        else
          python3 - "$GITHUB_WORKSPACE" "$SOURCE_ARCHIVE" <<'PY'
        import stat
        import sys
        import zipfile
        from pathlib import Path, PurePosixPath

        root = Path(sys.argv[1])
        output = Path(sys.argv[2])
        candidates = sorted(root.glob("XWT-Linux-GitHub-Upload*.zip"))
        candidates += sorted(root.glob("XWT-Linux-*-setup*.zip"))
        candidates = list(dict.fromkeys(p for p in candidates if p.is_file()))
        if len(candidates) != 1:
            raise SystemExit("Expected exactly one XWT upload package")
        wrapper = candidates[0]
        with zipfile.ZipFile(wrapper) as archive:
            members = [m for m in archive.infolist()
                       if PurePosixPath(m.filename).name == "XWT-Linux-source.zip"
                       and not m.is_dir()]
            if len(members) != 1:
                raise SystemExit("Outer ZIP must contain exactly one XWT-Linux-source.zip")
            member = members[0]
            path = PurePosixPath(member.filename)
            mode = member.external_attr >> 16
            if (path.is_absolute() or ".." in path.parts
                or "\\" in member.filename or stat.S_ISLNK(mode)):
                raise SystemExit("Unsafe path in outer ZIP")
            if member.file_size > 128 * 1024 * 1024:
                raise SystemExit("Embedded source archive exceeds 128 MiB")
            with archive.open(member) as source, output.open("wb") as dest:
                while chunk := source.read(1024 * 1024):
                    dest.write(chunk)
        if not output.is_file() or output.stat().st_size == 0:
            raise SystemExit("Could not extract XWT-Linux-source.zip")
        print(f"Extracted {output.stat().st_size} bytes from {wrapper.name}")
        PY
        fi

        mkdir -p "$PROJECT_DEST"
        python3 - "$SOURCE_ARCHIVE" "$PROJECT_DEST" <<'PY'
        import re
        import shutil
        import stat
        import sys
        import zipfile
        from pathlib import Path, PurePosixPath

        archive_path = Path(sys.argv[1])
        destination = Path(sys.argv[2])

        required = (
            "VERSION",
            "REVISION.txt",
            "boot/xwtboot/Makefile",
            "boot/xwtboot/src/main.c",
            "boot/xwtboot/include/xwt_boot.h",
            "boot/xwtboot/devtree.S",
            "scripts/xenos_patchlib.py",
        )

        shutil.rmtree(destination, ignore_errors=True)
        destination.mkdir(parents=True)

        with zipfile.ZipFile(archive_path) as archive:
            infos = archive.infolist()
            names = [info.filename for info in infos]
            if len(names) != len(set(names)):
                raise SystemExit("ZIP contains duplicate paths")
            total_size = 0
            for info in infos:
                name = info.filename
                path = PurePosixPath(name)
                mode = info.external_attr >> 16
                if (path.is_absolute() or ".." in path.parts
                    or "\\" in name or stat.S_ISLNK(mode)):
                    raise SystemExit("Unsafe path: " + name)
                total_size += info.file_size
                if (info.file_size > 128 * 1024 * 1024
                    or total_size > 512 * 1024 * 1024):
                    raise SystemExit("Source ZIP exceeds extraction limits")
                if info.is_dir():
                    continue
                target = destination.joinpath(*path.parts)
                target.parent.mkdir(parents=True, exist_ok=True)
                with archive.open(info) as source, target.open("wb") as output:
                    shutil.copyfileobj(source, output)
                target.chmod(0o755 if mode & 0o111 else 0o644)

        missing = [name for name in required if not (destination / name).is_file()]
        if missing:
            raise SystemExit("Incomplete source archive: " + ", ".join(missing))

        if (destination / "VERSION").read_text().strip() != "2.0.0":
            raise SystemExit("Incorrect XWT source version")

        expected_revision = "xwt-linux-2.0.0-desktop-gamepad-network-video"
        if (destination / "REVISION.txt").read_text().strip() != expected_revision:
            raise SystemExit("Incorrect XWT source revision")

        print(f"Validated XWT 2.0.0 source: bootloader files present.")
        PY

        echo "PROJECT_DIR=$PROJECT_DEST" >> "$GITHUB_ENV"

    - name: Setup libxenon cross-compiler (Docker)
      shell: bash
      run: |
        set -Eeuo pipefail
        # Use the official free60/libxenon Docker image for reproducible builds
        docker pull free60/libxenon:latest
        # Test the toolchain
        docker run --rm free60/libxenon:latest \
          sh -c 'export PATH="/usr/local/xenon/bin:$PATH" && powerpc64-xenon-gcc --version'

    - name: Build XWT Boot Manager
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Build failed::linha $LINENO: $BASH_COMMAND"' ERR

        BOOT_DIR="$PROJECT_DIR/boot/xwtboot"

        # Build inside the libxenon Docker container
        docker run --rm \
          -v "$BOOT_DIR:/src" \
          -w /src \
          free60/libxenon:latest \
          sh -c '
            set -Eeuo pipefail
            export DEVKITXENON=/usr/local/xenon
            export PATH="$DEVKITXENON/bin:$PATH"

            # Verify source files exist
            ls -la src/main.c include/xwt_boot.h devtree.S Makefile

            # Build
            make clean
            make -j4

            # Verify outputs
            test -f xenon.elf
            test -f stage2.elf32.gz
            test -f xenon.bin

            # Check ELF format
            file xenon.elf
            powerpc64-xenon-readelf -h xenon.elf

            # Size checks
            ELF_SIZE=$(stat -c%s xenon.elf)
            STAGE2_SIZE=$(stat -c%s stage2.elf32.gz)

            echo "xenon.elf: $ELF_SIZE bytes"
            echo "stage2.elf32.gz: $STAGE2_SIZE bytes"

            if [ "$ELF_SIZE" -gt 98304000 ]; then
              echo "ERROR: xenon.elf exceeds 96 MiB ELF mapping limit!"
              exit 1
            fi

            if [ "$STAGE2_SIZE" -gt 245744 ]; then
              echo "ERROR: stage2.elf32.gz exceeds 240 KiB limit!"
              exit 1
            fi
          '

        # Copy artifacts to runner for upload
        cp "$BOOT_DIR/xenon.elf" "$RUNNER_TEMP/xenon.elf"
        cp "$BOOT_DIR/stage2.elf32.gz" "$RUNNER_TEMP/stage2.elf32.gz"
        cp "$BOOT_DIR/xenon.bin" "$RUNNER_TEMP/xenon.bin"

    - name: Validate bootloader ELF structure
      shell: bash
      run: |
        set -Eeuo pipefail
        trap 'echo "::error title=Validation failed::linha $LINENO: $BASH_COMMAND"' ERR

        # Use Docker to validate ELF
        docker run --rm \
          -v "$RUNNER_TEMP:/artifacts" \
          -w /artifacts \
          free60/libxenon:latest \
          sh -c '
            set -Eeuo pipefail
            export DEVKITXENON=/usr/local/xenon
            export PATH="$DEVKITXENON/bin:$PATH"

            echo "=== xenon.elf ==="
            powerpc64-xenon-readelf -h xenon.elf
            echo
            echo "=== Program Headers ==="
            powerpc64-xenon-readelf -l xenon.elf
            echo
            echo "=== Section Headers ==="
            powerpc64-xenon-readelf -S xenon.elf
            echo
            echo "=== Symbols ==="
            powerpc64-xenon-nm xenon.elf | head -50
          '

        # Validate it's 32-bit ELF for PowerPC
        docker run --rm \
          -v "$RUNNER_TEMP:/artifacts" \
          -w /artifacts \
          free60/libxenon:latest \
          sh -c '
            python3 -c "
            import struct
            with open(\"xenon.elf\", \"rb\") as f:
                ident = f.read(16)
                if ident[:4] != b\"\\x7fELF\":
                    raise SystemExit(\"Not an ELF file\")
                if ident[4] != 1:
                    raise SystemExit(\"Not 32-bit ELF\")
                if ident[5] != 2:
                    raise SystemExit(\"Not big-endian\")
                f.seek(16)
                ehdr = f.read(36)
                machine = struct.unpack(\">H\", ehdr[0:2])[0]
                if machine != 0x14:
                    raise SystemExit(f\"Not PowerPC: machine=0x{machine:x}\")
                type_ = struct.unpack(\">H\", ehdr[2:4])[0]
                if type_ != 2:
                    raise SystemExit(f\"Not ET_EXEC: type=0x{type_:x}\")
                print(\"ELF validation PASSED: 32-bit big-endian PowerPC executable\")
            "
          '

    - name: Download XellLaunch2 (1f/2f images)
      shell: bash
      run: |
        set -Eeuo pipefail
        mkdir -p "$RUNNER_TEMP/xell"
        cd "$RUNNER_TEMP/xell"

        XELL_REPO="https://github.com/Free60Project/xell-reloaded"
        XELL_COMMIT="master"
        XELL_URL="${XELL_REPO}/releases/download/nightly-$(date +%Y%m%d)"

        # Try to download prebuilt XellLaunch2 images
        for img in xell-1f.bin xell-2f.bin xell-1f.elf xell-2f.elf; do
          if curl -fL -o "$img" "$XELL_URL/$img" 2>/dev/null; then
            echo "Downloaded $img"
          else
            echo "Warning: Could not download $img from releases"
          fi
        done

        # Fallback: build from source if no prebuilts
        if [ ! -f xell-1f.bin ] || [ ! -f xell-2f.bin ]; then
          echo "Building XellLaunch2 from source..."
          git clone --depth 1 --branch master https://github.com/Free60Project/xell-reloaded.git xell-src
          cd xell-src
          docker run --rm \
            -v "$(pwd):/src" \
            -w /src \
            free60/libxenon:latest \
            sh -c "export DEVKITXENON=/usr/local/xenon && export PATH=\$DEVKITXENON/bin:\$PATH && make -j4"
          cp output/xell-1f.bin ../xell-1f.bin
          cp output/xell-2f.bin ../xell-2f.bin
          cp output/xell-1f.elf ../xell-1f.elf 2>/dev/null || true
          cp output/xell-2f.elf ../xell-2f.elf 2>/dev/null || true
        fi

        test -f xell-1f.bin && test -f xell-2f.bin || {
          echo "ERROR: XellLaunch2 images not available" >&2
          exit 1
        }

    - name: Create XellLaunch2 + XWT Boot combined images
      shell: bash
      run: |
        set -Eeuo pipefail
        cd "$RUNNER_TEMP/xell"

        # Combine XellLaunch2 with XWT Boot Manager as stage2
        for type in 1f 2f; do
          XELL_IMG="xell-${type}.bin"
          OUTPUT_IMG="xwt-${type}.bin"

          if [ -f "$XELL_IMG" ] && [ -f "$RUNNER_TEMP/stage2.elf32.gz" ]; then
            # XellLaunch2 expects stage2 at offset; use xell-launch2 tool or cat
            # Simple concatenation for XellLaunch2 format
            cat "$XELL_IMG" "$RUNNER_TEMP/stage2.elf32.gz" > "$OUTPUT_IMG"
            echo "Created $OUTPUT_IMG ($(stat -c%s "$OUTPUT_IMG") bytes)"
          fi
        done

        ls -la xwt-*.bin

    - name: Set output paths
      id: set-outputs
      shell: bash
      run: |
        echo "xenon_elf=$RUNNER_TEMP/xenon.elf" >> "$GITHUB_OUTPUT"
        echo "stage2_gz=$RUNNER_TEMP/stage2.elf32.gz" >> "$GITHUB_OUTPUT"

    - name: Upload bootloader artifacts
      uses: actions/upload-artifact@v7
      with:
        name: xwt-bootloader-${{ github.sha }}
        path: |
          ${{ runner.temp }}/xenon.elf
          ${{ runner.temp }}/stage2.elf32.gz
          ${{ runner.temp }}/xenon.bin
          ${{ runner.temp }}/xell/xwt-1f.bin
          ${{ runner.temp }}/xell/xwt-2f.bin
          ${{ runner.temp }}/xell/xell-1f.bin
          ${{ runner.temp }}/xell/xell-2f.bin
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: Build summary
      if: always()
      shell: bash
      run: |-
        {
          echo "## XWT Boot Manager 2.0.0"
          echo "ELF32 PowerPC bootloader built with libxenon toolchain."
          echo "Graphical menu, profile system, diagnostics, recovery modes."
          echo "XeLL hands off to XWT Boot Manager; XWT controls the menu."
          echo "Combined XellLaunch2 + XWT images: xwt-1f.bin, xwt-2f.bin"
        } >> "$GITHUB_STEP_SUMMARY"
  build-distro:
    name: Assemble Debian Ports ppc64 traditional distro
    needs:
    - build-core
    - build-bootloader
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
    - name: Checkout XWT source
      uses: actions/checkout@v7
      with:
        persist-credentials: false

    - name: Install Debian rootfs build dependencies
      shell: bash
      run: |
        set -Eeuo pipefail
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          debootstrap qemu-user-static binfmt-support cpio zstd rsync zip \
          dosfstools e2fsprogs parted util-linux file python3 dpkg-dev \
          ca-certificates curl wget gzip tar xz-utils
        sudo update-binfmts --enable qemu-ppc64
        qemu-ppc64-static --version
        debootstrap --version

    - name: Download Xenon kernel and Buildroot support artifacts
      uses: actions/download-artifact@v8
      with:
        name: xwt-linux-core-${{ github.sha }}
        path: ${{ runner.temp }}/xwt-core-artifact

    - name: Download XWT bootloader artifacts
      uses: actions/download-artifact@v8
      with:
        name: xwt-bootloader-${{ github.sha }}
        path: ${{ runner.temp }}/xwt-boot-artifact

    - name: Extract and validate the complete XWT source tree
      shell: bash
      run: |
        set -Eeuo pipefail
        SOURCE_ARCHIVE="$RUNNER_TEMP/XWT-Linux-source.zip"
        PROJECT_DEST="$RUNNER_TEMP/xwt-project"

        if [[ -s "$GITHUB_WORKSPACE/XWT-Linux-source.zip" ]]; then
          cp "$GITHUB_WORKSPACE/XWT-Linux-source.zip" "$SOURCE_ARCHIVE"
        else
          python3 - "$GITHUB_WORKSPACE" "$SOURCE_ARCHIVE" <<'PYWRAPPER'
        import shutil
        import stat
        import sys
        import zipfile
        from pathlib import Path, PurePosixPath

        root, output = Path(sys.argv[1]), Path(sys.argv[2])
        direct = root / "XWT-Linux-source.zip"
        named_sources = sorted(p for p in root.glob("XWT-Linux-source*.zip") if p.is_file())
        if direct.is_file():
            shutil.copyfile(direct, output)
        elif len(named_sources) == 1:
            shutil.copyfile(named_sources[0], output)
        else:
            candidates = sorted(root.glob("XWT-Linux-GitHub-Upload*.zip"))
            candidates += sorted(root.glob("XWT-Linux-*-setup*.zip"))
            candidates = list(dict.fromkeys(p for p in candidates if p.is_file()))
            if len(candidates) != 1:
                raise SystemExit("Expected one XWT-Linux-source*.zip or one outer upload ZIP; found source ZIPs: " +
                                 ", ".join(p.name for p in named_sources))
            wrapper = candidates[0]
            with zipfile.ZipFile(wrapper) as archive:
                members = [m for m in archive.infolist()
                           if PurePosixPath(m.filename).name == "XWT-Linux-source.zip"
                           and not m.is_dir()]
                if len(members) != 1:
                    raise SystemExit("Outer ZIP must contain exactly one XWT-Linux-source.zip")
                member = members[0]
                path = PurePosixPath(member.filename)
                mode = member.external_attr >> 16
                if (path.is_absolute() or ".." in path.parts or "\\" in member.filename
                    or stat.S_ISLNK(mode) or member.file_size > 128 * 1024 * 1024):
                    raise SystemExit("Unsafe or oversized embedded source archive")
                with archive.open(member) as src, output.open("wb") as dst:
                    while chunk := src.read(1024 * 1024):
                        dst.write(chunk)
        if not output.is_file() or output.stat().st_size == 0:
            raise SystemExit("Could not extract XWT-Linux-source.zip")
        PYWRAPPER
        fi

        python3 - "$SOURCE_ARCHIVE" "$PROJECT_DEST" <<'PY'
        import hashlib
        import re
        import shutil
        import stat
        import sys
        import zipfile
        from pathlib import Path, PurePosixPath

        archive_path, destination = Path(sys.argv[1]), Path(sys.argv[2])
        shutil.rmtree(destination, ignore_errors=True)
        destination.mkdir(parents=True)
        with zipfile.ZipFile(archive_path) as archive:
            infos = archive.infolist()
            names = [item.filename for item in infos]
            if len(names) != len(set(names)):
                raise SystemExit("Source ZIP contains duplicate paths")
            total = 0
            for item in infos:
                name = item.filename
                path = PurePosixPath(name)
                mode = item.external_attr >> 16
                if (path.is_absolute() or ".." in path.parts or "\\" in name
                    or (path.parts and path.parts[0].endswith(":"))
                    or stat.S_ISLNK(mode)):
                    raise SystemExit("Unsafe path in source ZIP: " + name)
                total += item.file_size
                if item.file_size > 128 * 1024 * 1024 or total > 512 * 1024 * 1024:
                    raise SystemExit("Source ZIP exceeds extraction limits")
                if item.is_dir():
                    continue
                target = destination.joinpath(*path.parts)
                target.parent.mkdir(parents=True, exist_ok=True)
                with archive.open(item) as src, target.open("wb") as dst:
                    shutil.copyfileobj(src, dst)
                target.chmod(0o755 if mode & 0o111 else 0o644)

        for required in ("VERSION", "REVISION.txt", "SOURCE-MANIFEST.sha256",
                         "distro/build-rootfs.sh", "distro/installer/install-usb.sh",
                         "linux/xenon-7.2.defconfig"):
            if not (destination / required).is_file():
                raise SystemExit("Missing required source file: " + required)
        if (destination / "VERSION").read_text().strip() != "2.0.0":
            raise SystemExit("Unexpected source VERSION")
        expected_revision = "xwt-linux-2.0.0-desktop-gamepad-network-video"
        if (destination / "REVISION.txt").read_text().strip() != expected_revision:
            raise SystemExit("Unexpected source revision")

        manifest = destination / "SOURCE-MANIFEST.sha256"
        expected = {}
        for line in manifest.read_text(encoding="ascii").splitlines():
            match = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
            if not match:
                raise SystemExit("Invalid SOURCE-MANIFEST.sha256 line")
            digest, name = match.groups()
            if name in expected:
                raise SystemExit("Duplicate manifest path: " + name)
            expected[name] = digest
        actual = {p.relative_to(destination).as_posix()
                  for p in destination.rglob("*") if p.is_file()
                  and p.name != "SOURCE-MANIFEST.sha256"
                  and "__pycache__" not in p.parts and p.suffix != ".pyc"}
        expected = {name: digest for name, digest in expected.items()
                    if "__pycache__" not in name.split("/") and not name.endswith(".pyc")}
        if actual != set(expected):
            raise SystemExit("Source manifest file set mismatch")
        for name, digest in expected.items():
            actual_digest = hashlib.sha256((destination / name).read_bytes()).hexdigest()
            if actual_digest != digest:
                raise SystemExit("Source manifest hash mismatch: " + name)
        print(f"Validated {len(expected)} source files at {destination}")
        PY
        echo "PROJECT_DIR=$PROJECT_DEST" >> "$GITHUB_ENV"

    - name: Normalize build artifact directories
      shell: bash
      run: |
        set -Eeuo pipefail
        CORE="$RUNNER_TEMP/xwt-core-artifact/buildroot-output/images"
        BOOT="$RUNNER_TEMP/xwt-boot-artifact"
        mkdir -p "$RUNNER_TEMP/xwt-boot-normalized"
        for f in zImage.xenon rootfs-full.cpio.gz; do
          test -s "$CORE/$f" || { echo "Missing core artifact: $CORE/$f" >&2; exit 1; }
        done
        test -s "$BOOT/xenon.elf"
        test -s "$BOOT/xell/xwt-1f.bin"
        test -s "$BOOT/xell/xwt-2f.bin"
        cp "$BOOT/xenon.elf" "$RUNNER_TEMP/xwt-boot-normalized/xenon.elf"
        cp "$BOOT/xell/xwt-1f.bin" "$RUNNER_TEMP/xwt-boot-normalized/xwt-1f.bin"
        cp "$BOOT/xell/xwt-2f.bin" "$RUNNER_TEMP/xwt-boot-normalized/xwt-2f.bin"

    - name: Build traditional Debian Ports root filesystem
      shell: bash
      env:
        XWT_CORE_DIR: ${{ runner.temp }}/xwt-core-artifact/buildroot-output/images
        XWT_BOOT_DIR: ${{ runner.temp }}/xwt-boot-normalized
        XWT_VERSION: "2.0.0"
        DEBIAN_PORTS_MIRROR: https://ftp.ports.debian.org/debian-ports
        DEBIAN_PORTS_SUITE: unstable
      run: |
        set -Eeuo pipefail
        sudo env \
          XWT_CORE_DIR="$XWT_CORE_DIR" \
          XWT_BOOT_DIR="$XWT_BOOT_DIR" \
          XWT_VERSION="$XWT_VERSION" \
          DEBIAN_PORTS_MIRROR="$DEBIAN_PORTS_MIRROR" \
          DEBIAN_PORTS_SUITE="$DEBIAN_PORTS_SUITE" \
          bash "$PROJECT_DIR/distro/build-rootfs.sh"

    - name: Create release ZIP
      shell: bash
      run: |
        set -Eeuo pipefail
        DISTRO_OUT="$PROJECT_DIR/out/distro"
        test -s "$DISTRO_OUT/rootfs.tar.zst"
        RELEASE_DIR="$RUNNER_TEMP/xwt-release"
        mkdir -p "$RELEASE_DIR"
        cp -a "$DISTRO_OUT/." "$RELEASE_DIR/"
        (cd "$RELEASE_DIR" && zip -0 -r \
          "$RUNNER_TEMP/XWT-OS-Traditional-Xbox360-2.0.0.zip" .)
        cp "$RUNNER_TEMP/XWT-OS-Traditional-Xbox360-2.0.0.zip" "$RELEASE_DIR/"
        ls -lh "$RELEASE_DIR"

    - name: Upload XWT OS traditional release
      uses: actions/upload-artifact@v7
      with:
        name: xwt-os-traditional-${{ github.sha }}
        path: ${{ runner.temp }}/xwt-release/*
        if-no-files-found: error
        retention-days: 30
        compression-level: 0

    - name: Build summary
      if: always()
      shell: bash
      run: |
        {
          echo '## XWT OS — Debian Ports ppc64'
          echo '- Base: Debian Ports unstable, ppc64 big-endian'
          echo '- Init: systemd'
          echo '- Package manager: apt/dpkg'
          echo '- Root filesystem: persistent ext4 (USB)'
          echo '- Boot: XWT Boot + zImage.xenon, direct root mount'
          echo '- Hardware: Xbox 360 Xenon-specific kernel and XWT SDL services'
          echo '- Physical Xbox 360 boot test: not performed by GitHub Actions'
        } >> "$GITHUB_STEP_SUMMARY"
