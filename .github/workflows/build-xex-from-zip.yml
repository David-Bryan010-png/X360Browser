
name: X360 Web Total - Xenon Linux Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xwt-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILDROOT_COMMIT: 15b0457158bbe24264ab241cbe87c52b4d659f4e
  FREE60_COMMIT: 3c3e76fb1ffa3bcce3a50a6af6b847a2da25139f
  XWT_VERSION: "0.13.0"
  XWT_REVISION: linux-xenon-desktop-shell
  CCACHE_DIR: /home/runner/.cache/xwt-buildroot-ccache
  CCACHE_MAXSIZE: 512M

jobs:
  build-linux:
    name: Build Xbox 360 Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      # =========================================================
      # 1. FREE DISK SPACE BEFORE ANY HEAVY OPERATION
      # =========================================================

      - name: Free runner disk space
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "=== INITIAL DISK ==="
          df -h
          df -i

          echo "Removing unnecessary preinstalled SDKs..."

          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/lib/node_modules

          if command -v docker >/dev/null 2>&1; then
            docker system prune -af --volumes || true
          fi

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*

          echo "=== AVAILABLE DISK ==="
          df -h

          AVAILABLE=$(df -Pk /home/runner | awk 'NR==2 {print $4}')

          if [ "$AVAILABLE" -lt 5242880 ]; then
            echo "ERROR: Less than 5 GB available after cleanup."
            exit 1
          fi

      # =========================================================
      # 2. CHECKOUT
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          clean: true
          fetch-depth: 1

      # =========================================================
      # 3. INSTALL DEPENDENCIES
      # =========================================================

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make bc bison flex gawk \
            ccache cpio file git curl wget patch rsync unzip zip \
            python3 python3-pip python3-setuptools python3-dev \
            cmake pkg-config perl gettext ca-certificates \
            libncurses-dev libssl-dev libelf-dev libffi-dev \
            zlib1g-dev zstd xz-utils

          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*

          echo "=== DISK AFTER DEPENDENCIES ==="
          df -h

          ccache --version

      # =========================================================
      # 4. INCREMENTAL CACHE
      # =========================================================

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/xwt-buildroot-ccache
          key: ${{ runner.os }}-xwt-ccache-${{ env.XWT_VERSION }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-xwt-ccache-${{ env.XWT_VERSION }}-${{ github.ref_name }}-
            ${{ runner.os }}-xwt-ccache-${{ env.XWT_VERSION }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$CCACHE_DIR"

          ccache --set-config=max_size=512M
          ccache --set-config=compression=true
          ccache --zero-stats || true

          echo "Compiler cache configured."
          ccache --show-stats

      # =========================================================
      # 5. SOURCE VALIDATION
      # =========================================================

      - name: Locate and validate project source
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 <<'PY'
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          extraction = Path(os.environ["RUNNER_TEMP"]) / "xwt-project"

          required = [
              "VERSION",
              "REVISION.txt",
              "linux/buildroot.config",
              "linux/boot/kboot.conf",
              "linux/post-build.sh",
              "linux/src/xwt-gamepad-keys.c",
              "linux/src/xwt-desktop.c",
              "linux/overlay/etc/dialogrc",
              "linux/overlay/etc/init.d/S15gamepad",
              "linux/overlay/etc/init.d/S30storage",
              "linux/overlay/etc/init.d/S40network",
              "linux/overlay/etc/init.d/S45wifi",
              "linux/overlay/etc/init.d/S46time",
              "linux/overlay/usr/sbin/xwt-wifi",
              "linux/overlay/usr/sbin/xwt-network",
              "linux/overlay/usr/sbin/xwt-system-menu",
              "linux/overlay/usr/sbin/xwt-system-menu-text",
              "linux/overlay/usr/sbin/xwt-audio",
              "linux/overlay/usr/sbin/xwt-wifi-config.py",
              "linux/overlay/usr/sbin/xwt-time-sync.py",
              "scripts/package_linux_usb.py",
              "scripts/test_package_linux_usb.py",
              "scripts/test_linux_network.py",
              "scripts/test_desktop.py",
              "scripts/test_nand_boundary.py",
              "README-INSTALL-PT-BR.txt",
          ]

          def valid(root):
              try:
                  return (
                      root.is_dir()
                      and all((root / item).is_file() for item in required)
                      and (root / "VERSION").read_text().strip() == "0.13.0"
                      and (root / "REVISION.txt").read_text().strip()
                      == "linux-xenon-desktop-shell"
                  )
              except (OSError, UnicodeError):
                  return False

          candidates = [workspace]

          candidates.extend(
              p for p in workspace.iterdir()
              if p.is_dir() and p.name not in {".git", ".github"}
          )

          found = [p for p in candidates if valid(p)]

          if len(found) == 1:
              project = found[0]

          elif len(found) > 1:
              raise SystemExit("Multiple valid project source directories found.")

          else:
              archives = []

              for archive in workspace.glob("*.zip"):
                  try:
                      with zipfile.ZipFile(archive) as zf:
                          infos = zf.infolist()
                          names = {i.filename for i in infos}

                          if len(names) != len(infos):
                              raise SystemExit("Duplicate ZIP paths detected.")

                          for name in names:
                              item = PurePosixPath(name)

                              if item.name != "VERSION":
                                  continue

                              if (
                                  item.is_absolute()
                                  or ".." in item.parts
                                  or "\\" in name
                                  or "\x00" in name
                              ):
                                  continue

                              prefix = (
                                  "" if str(item.parent) == "."
                                  else str(item.parent) + "/"
                              )

                              if not all(prefix + x in names for x in required):
                                  continue

                              if (
                                  zf.read(prefix + "VERSION").decode().strip()
                                  == "0.13.0"
                                  and zf.read(prefix + "REVISION.txt").decode().strip()
                                  == "linux-xenon-desktop-shell"
                              ):
                                  archives.append((archive, prefix, infos))

                  except (
                      OSError,
                      zipfile.BadZipFile,
                      KeyError,
                      UnicodeError
                  ):
                      continue

              if len(archives) != 1:
                  raise SystemExit(
                      "Expected exactly one valid X360 Web Total 0.13.0 source."
                  )

              archive, prefix, infos = archives[0]

              shutil.rmtree(extraction, ignore_errors=True)
              extraction.mkdir(parents=True)

              total = 0

              with zipfile.ZipFile(archive) as zf:
                  for info in infos:
                      name = info.filename
                      item = PurePosixPath(name)
                      mode = info.external_attr >> 16

                      if (
                          item.is_absolute()
                          or ".." in item.parts
                          or "\\" in name
                          or "\x00" in name
                          or stat.S_ISLNK(mode)
                      ):
                          raise SystemExit(f"Unsafe ZIP entry: {name}")

                      total += info.file_size

                      if (
                          info.file_size > 128 * 1024 * 1024
                          or total > 768 * 1024 * 1024
                      ):
                          raise SystemExit("Source ZIP exceeds safety limit.")

                      if info.is_dir():
                          continue

                      destination = extraction.joinpath(*item.parts)
                      destination.parent.mkdir(
                          parents=True,
                          exist_ok=True
                      )

                      with zf.open(info) as source:
                          with destination.open("wb") as target:
                              shutil.copyfileobj(source, target)

                      destination.chmod(
                          0o755 if mode & 0o111 else 0o644
                      )

              project = extraction / prefix if prefix else extraction

              if not valid(project):
                  raise SystemExit("Extracted source is invalid.")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PROJECT_DIR={project}\n")
              f.write(
                  "XWT_ASSET_PREFIX="
                  f"X360-Web-Total-0.13.0-Xenon-Linux-"
                  f"{os.environ['GITHUB_SHA'][:12]}\n"
              )

          print("Validated project:", project)
          PY

      # =========================================================
      # 6. SOURCE INTEGRITY
      # =========================================================

      - name: Verify source integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          if [ -f SOURCE-MANIFEST.sha256 ]; then
            sha256sum --check SOURCE-MANIFEST.sha256
          fi

      # =========================================================
      # 7. TESTS
      # =========================================================

      - name: Run shell and Python tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          for script in \
            linux/post-build.sh \
            linux/overlay/etc/init.d/S15gamepad \
            linux/overlay/etc/init.d/S30storage \
            linux/overlay/etc/init.d/S40network \
            linux/overlay/etc/init.d/S45wifi \
            linux/overlay/etc/init.d/S46time \
            linux/overlay/usr/sbin/xwt-network \
            linux/overlay/usr/sbin/xwt-wifi \
            linux/overlay/usr/sbin/xwt-system-menu \
            linux/overlay/usr/sbin/xwt-system-menu-text \
            linux/overlay/usr/sbin/xwt-audio
          do
            sh -n "$script"
          done

          python3 -m py_compile \
            scripts/package_linux_usb.py \
            scripts/test_package_linux_usb.py \
            scripts/test_linux_network.py \
            scripts/test_desktop.py \
            linux/overlay/usr/sbin/xwt-wifi-config.py \
            linux/overlay/usr/sbin/xwt-time-sync.py

          cd scripts

          python3 -m unittest -v \
            test_package_linux_usb \
            test_linux_network \
            test_desktop

          cd ..

          python3 scripts/test_nand_boundary.py

      # =========================================================
      # 8. HOST REGRESSION TESTS
      # =========================================================

      - name: Build host regression tests
        shell: bash
        run: |
          set -Eeuo pipefail

          cmake -S "$PROJECT_DIR/browser" \
            -B "$RUNNER_TEMP/xwt-host-regression" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"

          cmake --build "$RUNNER_TEMP/xwt-host-regression" --parallel 2

          ctest \
            --test-dir "$RUNNER_TEMP/xwt-host-regression" \
            --output-on-failure \
            --no-tests=error

          rm -rf "$RUNNER_TEMP/xwt-host-regression"

      # =========================================================
      # 9. FETCH FREE60
      # =========================================================

      - name: Fetch Free60 Xenon support
        shell: bash
        run: |
          set -Eeuo pipefail

          DIR="$RUNNER_TEMP/free60-xenon"

          git init "$DIR"

          git -C "$DIR" remote add origin \
            https://github.com/Free60Project/linux-kernel-xbox360.git

          git -C "$DIR" fetch --depth=1 origin "$FREE60_COMMIT"
          git -C "$DIR" checkout --detach FETCH_HEAD

          test "$(git -C "$DIR" rev-parse HEAD)" = "$FREE60_COMMIT"

          test -s "$DIR/xenon-7.2.defconfig"
          test -s "$DIR/patch-7.2-xenon0.30.diff"

          cp "$DIR/xenon-7.2.defconfig" \
            "$PROJECT_DIR/linux/xenon-7.2.defconfig"

          python3 - "$PROJECT_DIR/linux/xenon-7.2.defconfig" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])

          options = {
              "CONFIG_DRM_FBDEV_EMULATION": "y",
              "CONFIG_FRAMEBUFFER_CONSOLE": "y",
              "CONFIG_VT": "y",
              "CONFIG_VT_CONSOLE": "y",
              "CONFIG_UNIX98_PTYS": "y",
              "CONFIG_TMPFS": "y",
              "CONFIG_FB": "y",
              "CONFIG_FAT_FS": "y",
              "CONFIG_VFAT_FS": "y",
              "CONFIG_USB_STORAGE": "y",
              "CONFIG_USB_EHCI_HCD": "y",
              "CONFIG_USB_OHCI_HCD": "y",
              "CONFIG_SCSI": "y",
              "CONFIG_BLK_DEV_SD": "y",
              "CONFIG_INPUT_EVDEV": "y",
              "CONFIG_DEVTMPFS": "y",
              "CONFIG_DEVTMPFS_MOUNT": "y",
              "CONFIG_PROC_FS": "y",
              "CONFIG_SYSFS": "y",
              "CONFIG_INPUT_UINPUT": "m",
              "CONFIG_INPUT_JOYDEV": "m",
              "CONFIG_JOYSTICK_XPAD": "m",
              "CONFIG_USB_HID": "y",
              "CONFIG_HID_GENERIC": "y",
              "CONFIG_SND_USB_AUDIO": "m",
          }

          pattern = re.compile(
              r"^(?:# )?(CONFIG_[A-Z0-9_]+)(?:=.*| is not set)$"
          )

          lines = []

          for line in path.read_text().splitlines():
              match = pattern.match(line)

              if not match or match.group(1) not in options:
                  lines.append(line)

          lines.extend(f"{k}={v}" for k, v in options.items())

          path.write_text("\n".join(lines) + "\n")
          PY

          for option in \
            '^CONFIG_PPC64=y$' \
            '^CONFIG_DRM_XENOS=y$' \
            '^CONFIG_SIS190=y$' \
            '^CONFIG_CFG80211=m$' \
            '^CONFIG_MAC80211=m$' \
            '^CONFIG_JOYSTICK_XPAD=m$' \
            '^CONFIG_INPUT_JOYDEV=m$' \
            '^CONFIG_INPUT_UINPUT=m$'
          do
            grep -q "$option" "$PROJECT_DIR/linux/xenon-7.2.defconfig"
          done

          git -C "$DIR" rev-parse HEAD \
            > "$RUNNER_TEMP/free60-commit.txt"

      # =========================================================
      # 10. FETCH BUILDROOT
      # =========================================================

      - name: Fetch Buildroot
        shell: bash
        run: |
          set -Eeuo pipefail

          DIR="$RUNNER_TEMP/buildroot"

          git init "$DIR"

          git -C "$DIR" remote add origin \
            https://github.com/buildroot/buildroot.git

          git -C "$DIR" fetch --depth=1 origin "$BUILDROOT_COMMIT"
          git -C "$DIR" checkout --detach FETCH_HEAD

          test "$(git -C "$DIR" rev-parse HEAD)" = "$BUILDROOT_COMMIT"

          git -C "$DIR" rev-parse HEAD \
            > "$RUNNER_TEMP/buildroot-commit.txt"

          df -h

      # =========================================================
      # 11. CONFIGURE BUILDROOT
      # =========================================================

      - name: Configure Buildroot
        shell: bash
        run: |
          set -Eeuo pipefail

          export BR2_DL_DIR="$HOME/.cache/xwt-buildroot-dl"

          mkdir -p "$BR2_DL_DIR"
          mkdir -p "$CCACHE_DIR"

          OUTPUT="$RUNNER_TEMP/buildroot-output"
          mkdir -p "$OUTPUT"

          cp "$PROJECT_DIR/linux/buildroot.config" "$OUTPUT/.config"

          sed -i \
            -e "s|@PROJECT_ROOT@|$PROJECT_DIR|g" \
            -e "s|@FREE60_ROOT@|$RUNNER_TEMP/free60-xenon|g" \
            -e "s|@BUILDROOT_OUTPUT@|$OUTPUT|g" \
            "$OUTPUT/.config"

          python3 - "$OUTPUT/.config" "$HOME" <<'PY'
          import sys
          from pathlib import Path

          config = Path(sys.argv[1])
          home = sys.argv[2]

          values = {
              "BR2_KERNEL_HEADERS_7_2": "y",
              "BR2_TOOLCHAIN_BUILDROOT": "y",
              "BR2_TOOLCHAIN_BUILDROOT_GLIBC": "y",
              "BR2_PACKAGE_BUSYBOX_SHOW_OTHERS": "y",
              "BR2_CCACHE": "y",
              "BR2_CCACHE_DIR":
                  f'"{home}/.cache/xwt-buildroot-ccache"',
          }

          lines = config.read_text().splitlines()

          for symbol, value in values.items():
              lines = [
                  line for line in lines
                  if not line.startswith(symbol + "=")
                  and line != f"# {symbol} is not set"
              ]

              lines.append(f"{symbol}={value}")

          config.write_text("\n".join(lines) + "\n")
          PY

          make -C "$RUNNER_TEMP/buildroot" \
            O="$OUTPUT" olddefconfig \
            2>&1 | tail -n 150

          CONFIG="$OUTPUT/.config"

          require_config() {
            grep -Fqx "$1" "$CONFIG" || {
              echo "Missing Buildroot option: $1" >&2
              exit 1
            }
          }

          require_config 'BR2_powerpc64=y'
          require_config 'BR2_powerpc_970=y'
          require_config 'BR2_KERNEL_HEADERS_7_2=y'
          require_config 'BR2_TOOLCHAIN_BUILDROOT=y'
          require_config 'BR2_TOOLCHAIN_BUILDROOT_GLIBC=y'
          require_config 'BR2_TOOLCHAIN_USES_GLIBC=y'
          require_config 'BR2_TOOLCHAIN_HAS_THREADS=y'
          require_config 'BR2_USE_WCHAR=y'

          require_config 'BR2_PACKAGE_NETSURF=y'
          require_config 'BR2_PACKAGE_NETSURF_SDL=y'
          require_config 'BR2_PACKAGE_SDL=y'
          require_config 'BR2_PACKAGE_SDL_FBCON=y'
          require_config 'BR2_PACKAGE_SDL_TTF=y'

          require_config 'BR2_PACKAGE_WPA_SUPPLICANT=y'
          require_config 'BR2_PACKAGE_WPA_SUPPLICANT_NL80211=y'
          require_config 'BR2_PACKAGE_WIRELESS_REGDB=y'
          require_config 'BR2_PACKAGE_IW=y'
          require_config 'BR2_PACKAGE_IPROUTE2=y'

          require_config 'BR2_PACKAGE_LIBCURL=y'
          require_config 'BR2_PACKAGE_LIBCURL_CURL=y'
          require_config 'BR2_PACKAGE_LIBCURL_OPENSSL=y'
          require_config 'BR2_PACKAGE_OPENSSL=y'
          require_config 'BR2_PACKAGE_CA_CERTIFICATES=y'

          require_config 'BR2_PACKAGE_PYTHON3=y'
          require_config 'BR2_PACKAGE_DIALOG=y'
          require_config 'BR2_PACKAGE_KMOD=y'
          require_config 'BR2_PACKAGE_KMOD_TOOLS=y'
          require_config 'BR2_PACKAGE_DEJAVU=y'
          require_config 'BR2_PACKAGE_DEJAVU_SANS=y'
          require_config 'BR2_PACKAGE_ALSA_LIB=y'
          require_config 'BR2_PACKAGE_ALSA_UTILS=y'

          require_config 'BR2_LINUX_KERNEL=y'
          require_config 'BR2_LINUX_KERNEL_CUSTOM_VERSION=y'
          require_config 'BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="7.2"'
          require_config 'BR2_LINUX_KERNEL_IMAGE_TARGET_NAME="zImage.xenon"'
          require_config 'BR2_TARGET_ROOTFS_CPIO=y'
          require_config 'BR2_TARGET_ROOTFS_CPIO_GZIP=y'

          grep -Fq "$PROJECT_DIR/linux/post-build.sh" "$CONFIG"

          echo "=== DISK BEFORE BUILD ==="
          df -h

          AVAILABLE=$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')

          if [ "$AVAILABLE" -lt 8388608 ]; then
            echo "ERROR: Less than 8 GB available before compilation."
            exit 1
          fi

      # =========================================================
      # 12. COMPILE
      # =========================================================

      - name: Compile Linux kernel and root filesystem
        shell: bash
        run: |
          set -Eeuo pipefail

          export BR2_DL_DIR="$HOME/.cache/xwt-buildroot-dl"

          ccache --max-size=512M || true

          JOBS=2

          echo "Buildroot workers: $JOBS"
          echo "Compiler cache: 512 MB"

          echo "=== DISK BEFORE COMPILATION ==="
          df -h

          if ! make -C "$RUNNER_TEMP/buildroot" \
            O="$RUNNER_TEMP/buildroot-output" \
            -j"$JOBS" \
            2>&1 | tail -n 250
          then
            echo "BUILDROOT COMPILATION FAILED"
            df -h
            exit 1
          fi

          OUTPUT="$RUNNER_TEMP/buildroot-output"
          TARGET="$OUTPUT/target"

          KERNEL="$OUTPUT/images/zImage.xenon"
          INITRD="$OUTPUT/images/rootfs.cpio.gz"

          test -s "$KERNEL"
          test -s "$INITRD"

          gzip -t "$INITRD"
          file "$KERNEL" "$INITRD"

          test -x "$TARGET/usr/sbin/xwt-desktop"
          test -x "$TARGET/usr/sbin/xwt-gamepad-keys"

          test -s "$TARGET/usr/share/fonts/dejavu/DejaVuSans.ttf"

          KERNEL_CONFIG="$(find "$OUTPUT/build" -maxdepth 4 \
            -type f -path '*/linux-*/.config' -print -quit)"

          test -s "$KERNEL_CONFIG"

          for option in \
            '^CONFIG_PPC_XENON=y$' \
            '^CONFIG_PPC64=y$' \
            '^CONFIG_DRM_XENOS=y$' \
            '^CONFIG_DRM_FBDEV_EMULATION=y$' \
            '^CONFIG_FRAMEBUFFER_CONSOLE=y$' \
            '^CONFIG_SIS190=y$' \
            '^CONFIG_USB_STORAGE=y$' \
            '^CONFIG_CFG80211=m$' \
            '^CONFIG_MAC80211=m$' \
            '^CONFIG_JOYSTICK_XPAD=m$' \
            '^CONFIG_INPUT_JOYDEV=m$' \
            '^CONFIG_INPUT_UINPUT=m$'
          do
            grep -q "$option" "$KERNEL_CONFIG"
          done

          for module in xpad joydev uinput; do
            find "$TARGET/lib/modules" -type f \
              \( -name "$module.ko" \
              -o -name "$module.ko.xz" \
              -o -name "$module.ko.zst" \) \
              -print -quit | grep -q .
          done

          ccache --show-stats

          echo "=== DISK AFTER COMPILATION ==="
          df -h

      # =========================================================
      # 13. CREATE USB PACKAGE
      # =========================================================

      - name: Create verified USB package
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 "$PROJECT_DIR/scripts/package_linux_usb.py" \
            --kernel "$RUNNER_TEMP/buildroot-output/images/zImage.xenon" \
            --initrd "$RUNNER_TEMP/buildroot-output/images/rootfs.cpio.gz" \
            --project "$PROJECT_DIR" \
            --output "$RUNNER_TEMP/$XWT_ASSET_PREFIX-USB.zip"

          sha256sum "$RUNNER_TEMP/$XWT_ASSET_PREFIX-USB.zip" \
            > "$RUNNER_TEMP/USB-SHA256.txt"

          test -s "$RUNNER_TEMP/$XWT_ASSET_PREFIX-USB.zip"

      # =========================================================
      # 14. SOURCE ARCHIVE
      # =========================================================

      - name: Create source archive
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - "$PROJECT_DIR" \
            "$RUNNER_TEMP/$XWT_ASSET_PREFIX-source.zip" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          output = Path(sys.argv[2])

          ignored_dirs = {
              ".git",
              "__pycache__",
              ".pytest_cache",
              "build",
              "output",
              "CMakeFiles"
          }

          ignored_suffixes = {
              ".o",
              ".a",
              ".so",
              ".elf",
              ".pyc",
              ".zip"
          }

          with zipfile.ZipFile(
              output,
              "w",
              zipfile.ZIP_DEFLATED,
              compresslevel=6
          ) as archive:

              for path in sorted(root.rglob("*")):
                  if not path.is_file() or path.is_symlink():
                      continue

                  relative = path.relative_to(root)

                  if any(part in ignored_dirs for part in relative.parts):
                      continue

                  if path.suffix.lower() in ignored_suffixes:
                      continue

                  if relative.as_posix() == "SOURCE-MANIFEST.sha256":
                      continue

                  info = zipfile.ZipInfo(
                      relative.as_posix(),
                      (2026, 1, 1, 0, 0, 0)
                  )

                  mode = 0o755 if path.stat().st_mode & 0o111 else 0o644
                  info.external_attr = (stat.S_IFREG | mode) << 16

                  with path.open("rb") as source:
                      archive.writestr(info, source.read())

          with zipfile.ZipFile(output) as archive:
              if archive.testzip():
                  raise SystemExit("Invalid source ZIP CRC.")

          print("Source archive created:", output)
          PY

      # =========================================================
      # 15. RELEASE MANIFEST
      # =========================================================

      - name: Generate release manifest
        shell: bash
        run: |
          set -Eeuo pipefail

          USB="$XWT_ASSET_PREFIX-USB.zip"
          SOURCE="$XWT_ASSET_PREFIX-source.zip"

          USB_SHA="$(sha256sum "$RUNNER_TEMP/$USB" | cut -d ' ' -f1)"
          SOURCE_SHA="$(sha256sum "$RUNNER_TEMP/$SOURCE" | cut -d ' ' -f1)"

          python3 - "$RUNNER_TEMP/latest.json" \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" \
            "$USB" "$SOURCE" "$USB_SHA" "$SOURCE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, repo, commit, usb, source, usb_sha, source_sha = sys.argv[1:]

          tag = f"xwt-v0.13.0-linux-{commit[:12]}"
          base = f"https://github.com/{repo}/releases/download/{tag}"

          manifest = {
              "product": "X360 Web Total",
              "version": "0.13.0",
              "revision": "linux-xenon-desktop-shell",
              "commit": commit,
              "release_tag": tag,
              "assets": {
                  "usb_package": f"{base}/{usb}",
                  "source": f"{base}/{source}"
              },
              "sha256": {
                  "usb_package": usb_sha,
                  "source": source_sha
              },
              "kernel": "Linux 7.2 Xenon / Xenos DRM / SIS190",
              "browser": "NetSurf SDL framebuffer",
              "tls": "libcurl / OpenSSL / CA certificates",
              "nand_write": False,
              "physical_console_tested": False
          }

          Path(output).write_text(
              json.dumps(manifest, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

          cat > "$RUNNER_TEMP/BUILD-REPORT.txt" <<EOF
          X360 Web Total $XWT_VERSION
          Revision: $XWT_REVISION
          Commit: $GITHUB_SHA
          Buildroot: $BUILDROOT_COMMIT
          Free60: $FREE60_COMMIT
          Target: Xbox 360 Xenon / PowerPC64
          Kernel: Linux 7.2
          Browser: NetSurf SDL framebuffer
          TLS: libcurl + OpenSSL
          Boot: XeLL Reloaded / USB
          NAND writes: none
          Physical console testing: required
          EOF

          cd "$RUNNER_TEMP"

          sha256sum latest.json BUILD-REPORT.txt \
            "$USB" "$SOURCE" > SHA256SUMS.txt

      # =========================================================
      # 16. REMOVE HEAVY BUILD FILES
      # =========================================================

      - name: Remove temporary build data
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Removing Buildroot temporary files..."

          rm -rf \
            "$RUNNER_TEMP/buildroot-output" \
            "$RUNNER_TEMP/buildroot" \
            "$RUNNER_TEMP/free60-xenon" \
            "$RUNNER_TEMP/xwt-host-regression" \
            "$HOME/.cache/xwt-buildroot-dl"

          echo "Compiler cache will be preserved for saving."

          echo "=== DISK BEFORE ARTIFACT UPLOAD ==="
          df -h

          ls -lh "$RUNNER_TEMP"/*USB.zip
          ls -lh "$RUNNER_TEMP"/*source.zip

      # =========================================================
      # 17. UPLOAD FINAL ARTIFACTS
      # =========================================================

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x360-web-total-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/*-USB.zip
            ${{ runner.temp }}/*-source.zip
            ${{ runner.temp }}/latest.json
            ${{ runner.temp }}/BUILD-REPORT.txt
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/USB-SHA256.txt
            ${{ runner.temp }}/buildroot-commit.txt
            ${{ runner.temp }}/free60-commit.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      # =========================================================
      # 18. FAILURE DIAGNOSTICS
      # =========================================================

      - name: Collect diagnostics
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail

          DIAG="$RUNNER_TEMP/xwt-diagnostics"
          mkdir -p "$DIAG"

          for source in \
            "$RUNNER_TEMP/buildroot-output/.config" \
            "$RUNNER_TEMP/free60-commit.txt" \
            "$RUNNER_TEMP/buildroot-commit.txt"
          do
            if [ -f "$source" ]; then
              cp "$source" "$DIAG/"
            fi
          done

          df -h > "$DIAG/disk-space.txt"
          df -i > "$DIAG/inode-space.txt"

          ccache --show-stats > "$DIAG/ccache-stats.txt" || true

          printf 'Run: %s\nCommit: %s\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" \
            > "$DIAG/run-info.txt"

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xwt-linux-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/xwt-diagnostics/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      # =========================================================
      # 19. BUILD SUMMARY
      # =========================================================

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## X360 Web Total Linux"
            echo ""
            echo "Version: $XWT_VERSION"
            echo "Revision: $XWT_REVISION"
            echo "Commit: $GITHUB_SHA"
            echo "Buildroot: $BUILDROOT_COMMIT"
            echo "Free60: $FREE60_COMMIT"
            echo "Target: Xbox 360 Xenon"
            echo "Browser: NetSurf SDL framebuffer"
            echo "HTTPS: libcurl + OpenSSL"
            echo "Boot: XeLL Reloaded / USB"
            echo "NAND writes: none"
            echo ""
            echo "Physical console testing is still required."
            echo ""
            echo "### Final disk state"
            df -h
          } >> "$GITHUB_STEP_SUMMARY"

  # =============================================================
  # 20. PUBLISH RELEASE
  # =============================================================

  publish-release:
    name: Publish Linux prerelease
    needs: build-linux

    if: >-
      ${{
        github.event_name != 'pull_request' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master')
      }}

    runs-on: ubuntu-24.04

    permissions:
      contents: write

    env:
      XWT_VERSION: "0.13.0"

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: x360-web-total-linux-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail

          cd "$RUNNER_TEMP/release-assets"

          TAG="xwt-v${XWT_VERSION}-linux-${GITHUB_SHA:0:12}"
          TITLE="X360 Web Total ${XWT_VERSION} - Xenon Linux"

          NOTES="$RUNNER_TEMP/release-notes.md"

          cat > "$NOTES" <<EOF
          # X360 Web Total ${XWT_VERSION} - Xenon Linux

          - Linux 7.2 with Xenon support.
          - Native SDL framebuffer desktop.
          - NetSurf SDL browser.
          - libcurl and OpenSSL.
          - Ethernet SIS190.
          - USB Wi-Fi depends on adapter compatibility.
          - XeLL Reloaded USB boot.
          - No NAND write operations.

          NetSurf is not Chromium. Modern YouTube playback is not certified.
          Physical Xbox 360 testing is required.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              ./*-USB.zip \
              ./*-source.zip \
              latest.json \
              BUILD-REPORT.txt \
              SHA256SUMS.txt \
              --clobber

            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --prerelease
          else
            gh release create "$TAG" \
              ./*-USB.zip \
              ./*-source.zip \
              latest.json \
              BUILD-REPORT.txt \
              SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --prerelease
          fi

          echo "Release published: $TAG" >> "$GITHUB_STEP_SUMMARY"
