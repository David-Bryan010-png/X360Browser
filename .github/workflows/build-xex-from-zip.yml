name: Build X360Browser 0.4.0 - Xbox 360 XEX

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "X360Browser-0.4.0.zip"
      - ".github/workflows/build-xex-from-zip.yml"

permissions:
  contents: read

concurrency:
  group: x360browser-xex-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  build-xbox360:
    name: Build and package Xbox 360 XEX
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            autoconf automake libtool pkg-config \
            bison flex gawk gettext texinfo \
            libgmp-dev libmpfr-dev libmpc-dev libncurses-dev \
            curl ca-certificates git \
            xz-utils bzip2 patch python3 cmake ninja-build \
            unzip zip file

      - name: Verify and extract source ZIP
        run: |
          set -Eeuo pipefail

          SOURCE_ZIP="$GITHUB_WORKSPACE/X360Browser-0.4.0.zip"
          SOURCE_ROOT="$RUNNER_TEMP/x360browser-source"

          if [[ ! -s "$SOURCE_ZIP" ]]; then
            echo "ERROR: missing or empty file: $SOURCE_ZIP" >&2
            exit 1
          fi

          echo "Checking ZIP integrity..."
          unzip -tq "$SOURCE_ZIP"

          rm -rf "$SOURCE_ROOT"
          mkdir -p "$SOURCE_ROOT"
          unzip -q "$SOURCE_ZIP" -d "$SOURCE_ROOT"

          # Find the build script instead of assuming the ZIP's top-level folder name.
          BUILD_SCRIPT="$(find "$SOURCE_ROOT" -type f -path '*/tools/build_xbox_shell.sh' -print -quit)"
          if [[ -z "$BUILD_SCRIPT" ]]; then
            echo "ERROR: tools/build_xbox_shell.sh was not found in the ZIP." >&2
            echo "Files found in archive:" >&2
            find "$SOURCE_ROOT" -maxdepth 4 -type f | head -200 >&2 || true
            exit 1
          fi

          PROJECT_DIR="$(dirname "$(dirname "$BUILD_SCRIPT")")"
          REQUIRED_SOURCES=(
            "$PROJECT_DIR/platform/xbox360/xsdk/web_engine.c"
            "$PROJECT_DIR/platform/xbox360/xsdk/main.c"
          )

          for file in "${REQUIRED_SOURCES[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: required source file missing: $file" >&2
              exit 1
            fi
          done

          SOURCE_ZIP_SHA256="$(sha256sum "$SOURCE_ZIP" | awk '{print $1}')"
          printf 'PROJECT_DIR=%s\n' "$PROJECT_DIR" >> "$GITHUB_ENV"
          printf 'SOURCE_ZIP_SHA256=%s\n' "$SOURCE_ZIP_SHA256" >> "$GITHUB_ENV"
          echo "Source verified at: $PROJECT_DIR"
          echo "Source ZIP SHA-256: $SOURCE_ZIP_SHA256"

      - name: Prepare Mbed TLS framework submodule
        shell: bash
        env:
          MBEDTLS_XENON_DIR: ${{ runner.temp }}/mbedtls-xenon
        run: |
          set -Eeuo pipefail

          # mbedtls-xenon uses the framework git submodule. Without it,
          # scripts/config.py cannot import mbedtls_framework and CMake fails.
          git clone --depth 1 --branch xenon \
            --recurse-submodules --shallow-submodules \
            https://github.com/xenosworks/mbedtls-xenon.git \
            "$MBEDTLS_XENON_DIR"

          git -C "$MBEDTLS_XENON_DIR" submodule sync --recursive
          git -C "$MBEDTLS_XENON_DIR" submodule update --init --recursive --depth 1

          if [[ ! -s "$MBEDTLS_XENON_DIR/framework/CMakeLists.txt" ]]; then
            echo "ERROR: Mbed TLS framework submodule was not populated." >&2
            git -C "$MBEDTLS_XENON_DIR" submodule status --recursive >&2 || true
            exit 1
          fi

          # Verify the Python package reported missing by the failed build.
          if ! find "$MBEDTLS_XENON_DIR/framework" \
              -type d -name mbedtls_framework -print -quit | grep -q .; then
            echo "ERROR: mbedtls_framework Python package is still missing." >&2
            exit 1
          fi

          echo "Mbed TLS framework submodule is ready."

      - name: Build Xbox 360 browser
        env:
          JOBS: "4"
          PREFIX: ${{ runner.temp }}/xsdk-gcc
          WORK: ${{ runner.temp }}/xsdk-gcc-work
          XSDK_DIR: ${{ runner.temp }}/xsdk
          GLSLANG_DIR: ${{ runner.temp }}/glslang-xenon
          MBEDTLS_XENON_DIR: ${{ runner.temp }}/mbedtls-xenon
          CURL_XENON_DIR: ${{ runner.temp }}/curl-xenon
        run: |
          set -Eeuo pipefail
          LOG_FILE="$RUNNER_TEMP/xbox-build.log"
          echo "Building source directory: $PROJECT_DIR"
          bash "$PROJECT_DIR/tools/build_xbox_shell.sh" 2>&1 | tee "$LOG_FILE"

      - name: Validate outputs and create release package
        run: |
          set -Eeuo pipefail

          BUILD_DIR="$PROJECT_DIR/build-xbox360"
          DIST_DIR="$GITHUB_WORKSPACE/dist"
          XEX="$BUILD_DIR/X360Browser.xex"
          PACKAGE="$GITHUB_WORKSPACE/X360Browser-0.4.0-web-engine.zip"

          REQUIRED_OUTPUTS=(
            "$XEX"
            "$BUILD_DIR/cacert.pem"
            "$BUILD_DIR/README.txt"
            "$BUILD_DIR/LICENSE-curl.txt"
            "$BUILD_DIR/LICENSE-mbedTLS.txt"
            "$BUILD_DIR/LICENSE-xsdk.txt"
          )

          for file in "${REQUIRED_OUTPUTS[@]}"; do
            if [[ ! -s "$file" ]]; then
              echo "ERROR: required build output is missing or empty: $file" >&2
              exit 1
            fi
          done

          rm -rf "$DIST_DIR"
          mkdir -p "$DIST_DIR"
          cp -- "${REQUIRED_OUTPUTS[@]}" "$DIST_DIR/"

          cat > "$DIST_DIR/BUILD-INFO.txt" <<EOF
          X360Browser version: 0.4.0
          Git commit: $GITHUB_SHA
          Git ref: $GITHUB_REF
          Source ZIP SHA-256: $SOURCE_ZIP_SHA256
          Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF

          rm -f "$PACKAGE"
          (
            cd "$DIST_DIR"
            zip -9 -X -q -j "$PACKAGE" \
              X360Browser.xex \
              cacert.pem \
              README.txt \
              LICENSE-curl.txt \
              LICENSE-mbedTLS.txt \
              LICENSE-xsdk.txt \
              BUILD-INFO.txt
          )

          echo "--- XEX file ---"
          file "$XEX"
          ls -lh "$XEX"

          echo "--- SHA-256 checksums ---"
          sha256sum "$XEX" "$PACKAGE"

          echo "--- Final package contents ---"
          unzip -l "$PACKAGE"

      # With archive:false, the downloaded artifact is the package ZIP itself,
      # rather than another ZIP containing this ZIP.
      - name: Upload XEX package
        uses: actions/upload-artifact@v7.0.2
        with:
          path: X360Browser-0.4.0-web-engine.zip
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log for troubleshooting
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: X360Browser-0.4.0-build-log
          path: ${{ runner.temp }}/xbox-build.log
          if-no-files-found: warn
          retention-days: 7
