name: X360Browser 3.6.0 - Automatic Xbox 360 XEX Build

on:
  push:
    branches: [main, master, principal]
    paths:
      - "*.zip"
      - "**/*.zip"
      - ".github/workflows/build-xex-from-zip.yml"
  pull_request:
    branches: [main, master, principal]
  workflow_dispatch:
    inputs:
      source_archive:
        description: "Caminho do ZIP do codigo-fonte dentro do repositorio"
        required: false
        default: "X360Browser-3.6.0-web-compatibility-source.zip"
        type: string

permissions:
  contents: read

concurrency:
  group: x360browser-auto-xex-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test, build XEX, and package
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            unzip \
            zip \
            git \
            curl \
            make \
            autoconf \
            automake \
            libtool \
            bison \
            flex \
            texinfo \
            libgmp-dev \
            libmpfr-dev \
            libmpc-dev \
            zlib1g-dev \
            libcurl4-openssl-dev

          mkdir -p "$RUNNER_TEMP/x360browser-output" \
                   "$RUNNER_TEMP/x360browser-logs"

          {
            echo "=== X360Browser 3.6.0 automatic build ==="
            date -u
            uname -a
            cc --version | head -n 1
            python3 --version
            cmake --version | head -n 1
          } | tee "$RUNNER_TEMP/x360browser-logs/build.log"

      - name: Locate and safely extract source
        id: resolve-source
        shell: bash
        env:
          SOURCE_ARCHIVE_INPUT: ${{ github.event.inputs.source_archive || 'X360Browser-3.6.0-web-compatibility-source.zip' }}
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/x360browser-logs/build.log"
          log() { printf '%s\n' "$*" | tee -a "$LOG"; }

          locate_root() {
            local base="$1" marker candidate

            while IFS= read -r -d '' marker; do
              candidate="${marker%/tests/run_host_tests.py}"

              if [[ -s "$candidate/engine/xenonweb/xw_dom.c" && \
                    -d "$candidate/engine/xenonweb" && \
                    -f "$candidate/platform/xbox360/xsdk/main.c" ]]; then
                printf '%s\n' "$candidate"
                return 0
              fi
            done < <(
              find "$base" -type f \
                -path '*/tests/run_host_tests.py' \
                -not -path '*/.git/*' \
                -not -path '*/build/*' \
                -not -path '*/build-xbox360/*' \
                -print0 2>/dev/null
            )

            return 1
          }

          PROJECT_DIR="$(locate_root "$GITHUB_WORKSPACE" || true)"

          if [[ -z "$PROJECT_DIR" ]]; then
            ARCHIVE=""

            if [[ -f "$SOURCE_ARCHIVE_INPUT" ]]; then
              ARCHIVE="$SOURCE_ARCHIVE_INPUT"
            elif [[ -f "$GITHUB_WORKSPACE/$SOURCE_ARCHIVE_INPUT" ]]; then
              ARCHIVE="$GITHUB_WORKSPACE/$SOURCE_ARCHIVE_INPUT"
            else
              mapfile -t ZIPS < <(
                find "$GITHUB_WORKSPACE" -maxdepth 6 -type f \
                  -iname '*x360browser*.zip' \
                  -not -path '*/.git/*' -print | sort
              )

              if [[ ${#ZIPS[@]} -eq 1 ]]; then
                ARCHIVE="${ZIPS[0]}"
              elif [[ ${#ZIPS[@]} -gt 1 ]]; then
                log "::error::Mais de um ZIP foi encontrado. Informe source_archive."
                printf '%s\n' "${ZIPS[@]}" | tee -a "$LOG"
                exit 2
              fi
            fi

            if [[ -z "$ARCHIVE" || ! -f "$ARCHIVE" ]]; then
              log "::error::O ZIP do X360Browser 3.6.0 nao foi encontrado."
              find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
                -not -path '*/.git/*' -print | sort | tee -a "$LOG" || true
              exit 2
            fi

            log "ZIP selecionado: $ARCHIVE"
            unzip -t "$ARCHIVE" 2>&1 | tee -a "$LOG"

            python3 - "$ARCHIVE" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import PurePosixPath

          archive = sys.argv[1]

          with zipfile.ZipFile(archive) as zf:
              members = zf.infolist()

              if not members:
                  raise SystemExit("ERRO: o ZIP esta vazio.")

              for member in members:
                  name = member.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  mode = member.external_attr >> 16

                  if path.is_absolute() or ".." in path.parts or name.startswith("/"):
                      raise SystemExit(
                          f"ERRO: caminho inseguro no ZIP: {member.filename}"
                      )

                  if stat.S_ISLNK(mode):
                      raise SystemExit(
                          f"ERRO: link simbolico nao permitido: {member.filename}"
                      )

          print("Validacao de caminhos do ZIP concluida.")
          PY

            EXTRACT_DIR="$RUNNER_TEMP/x360browser-source"
            rm -rf "$EXTRACT_DIR"
            mkdir -p "$EXTRACT_DIR"
            unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

            PROJECT_DIR="$(locate_root "$EXTRACT_DIR" || true)"
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            log "::error::A estrutura do codigo-fonte esta incompleta."
            log "Arquivos esperados: tests/run_host_tests.py, engine/xenonweb/xw_dom.c e platform/xbox360/xsdk/main.c."

            find "$GITHUB_WORKSPACE" "$RUNNER_TEMP/x360browser-source" \
              -maxdepth 6 -type f -not -path '*/.git/*' \
              -print 2>/dev/null | sort | head -250 | tee -a "$LOG" || true

            exit 2
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          log "Raiz do projeto: $PROJECT_DIR"

          if [[ -f "$PROJECT_DIR/VERSION" ]]; then
            log "Versao: $(cat "$PROJECT_DIR/VERSION")"
          fi

      - name: Repair and validate native test source
        id: repair-tests
        if: ${{ always() && steps.resolve-source.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          python3 - "$PROJECT_DIR/tests/test_web_engine_native.c" <<'PY'
          from pathlib import Path
          import re
          import sys

          path = Path(sys.argv[1])

          if not path.is_file():
              raise SystemExit(
                  f"ERRO: arquivo de teste nao encontrado: {path}"
              )

          source = path.read_text(encoding="utf-8")
          original = source
          backslash_n = chr(92) + "n"

          prefix = 'fprintf(stderr, "Erro ao ler assinatura do arquivo de teste.'
          broken_literal = prefix + "\n" + '");'
          valid_literal = prefix + backslash_n + '");'

          malformed_count = source.count(broken_literal)

          if malformed_count:
              source = source.replace(broken_literal, valid_literal)

          fread_pattern = re.compile(
              r'\(\s*void\s*\)\s*fread\s*\(\s*sig\s*,\s*1U\s*,\s*'
              r'sizeof\s*\(\s*sig\s*\)\s*,\s*f\s*\)\s*;'
          )

          fread_replacement = (
              'if (fread(sig, 1U, sizeof(sig), f) != sizeof(sig) '
              '|| ferror(f) != 0) { '
              + 'fprintf(stderr, "Erro ao ler assinatura do arquivo de teste.'
              + backslash_n
              + '"); '
              + '(void)fclose(f); return 1; }'
          )

          source, fread_count = fread_pattern.subn(
              lambda _match: fread_replacement, source
          )

          if broken_literal in source:
              raise SystemExit(
                  "ERRO: ainda existe uma string C quebrada."
              )

          if re.search(r'\(\s*void\s*\)\s*fread\s*\(', source):
              raise SystemExit(
                  "ERRO: ainda existe fread com retorno ignorado."
              )

          if source != original:
              path.write_text(source, encoding="utf-8")

          print(
              f"Reparo concluido. Strings corrigidas: {malformed_count}; "
              f"leituras fread corrigidas: {fread_count}."
          )
          PY

          cc -std=c17 -fsyntax-only -Wall -Wextra \
            -I "$PROJECT_DIR/platform/xbox360/xsdk" \
            -I "$PROJECT_DIR/engine/xenonweb" \
            "$PROJECT_DIR/tests/test_web_engine_native.c"

      - name: Validate source integrity
        id: integrity
        if: ${{ always() && steps.resolve-source.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          LOG="$RUNNER_TEMP/x360browser-logs/integrity.log"

          if [[ -f tests/validate_project_integrity.py ]]; then
            python3 -u tests/validate_project_integrity.py 2>&1 | tee "$LOG"
          else
            echo "Aviso: validador de integridade ausente." | tee "$LOG"
          fi

      - name: Compile and run native host tests
        id: host-tests
        if: ${{ always() && steps.resolve-source.outcome == 'success' && steps.repair-tests.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          LOG="$RUNNER_TEMP/x360browser-logs/host-tests.log"
          WRAPPER_DIR="$RUNNER_TEMP/x360browser-cc-wrapper"
          mkdir -p "$WRAPPER_DIR"

          cat > "$WRAPPER_DIR/cc" <<'SH'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          exec /usr/bin/cc -Wno-error=shadow "$@"
          SH

          chmod +x "$WRAPPER_DIR/cc"

          PATH="$WRAPPER_DIR:$PATH" \
            python3 -u tests/run_host_tests.py 2>&1 | tee "$LOG"

      - name: Build portable CMake components
        id: host-build
        if: ${{ always() && steps.resolve-source.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          LOG="$RUNNER_TEMP/x360browser-logs/host-build.log"
          BUILD_DIR="$RUNNER_TEMP/x360browser-cmake"

          if [[ ! -f CMakeLists.txt ]]; then
            echo "CMakeLists.txt ausente; etapa CMake ignorada." | tee "$LOG"
            exit 0
          fi

          cmake -S "$PROJECT_DIR" -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release \
            -DX360BROWSER_BUILD_TESTS=ON \
            -DX360BROWSER_BUILD_DEMO=ON \
            -DBUILD_TESTING=ON 2>&1 | tee "$LOG"

          cmake --build "$BUILD_DIR" --parallel 2 2>&1 | tee -a "$LOG"

          ctest --test-dir "$BUILD_DIR" --output-on-failure \
            2>&1 | tee -a "$LOG"

      - name: Package corrected source
        if: ${{ always() && steps.resolve-source.outcome == 'success' }}
        shell: bash
        run: |
          set -Eeuo pipefail

          OUT="$RUNNER_TEMP/x360browser-output"
          mkdir -p "$OUT"
          cd "$PROJECT_DIR"

          zip -qr "$OUT/X360Browser-3.6.0-corrected-source.zip" . \
            -x '.git/*' '*/.git/*' 'build/*' 'build-xbox360/*' \
               'build-xex/*' '*.zip' 'tests/__pycache__/*'

          unzip -t "$OUT/X360Browser-3.6.0-corrected-source.zip" \
            | tee -a "$RUNNER_TEMP/x360browser-logs/build.log"

          sha256sum "$OUT/X360Browser-3.6.0-corrected-source.zip" \
            | tee -a "$RUNNER_TEMP/x360browser-logs/build.log"

      - name: Build Xbox 360 XEX
        id: xex-build
        if: ${{ always() && steps.resolve-source.outcome == 'success' }}
        shell: bash
        env:
          JOBS: "2"
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          MAKEFLAGS: "-j2"
        run: |
          set -Eeuo pipefail

          LOG="$RUNNER_TEMP/x360browser-logs/xex-build.log"
          OUT="$RUNNER_TEMP/x360browser-output"

          mkdir -p "$OUT"
          cd "$PROJECT_DIR"

          log() {
            printf '%s\n' "$*" | tee -a "$LOG"
          }

          log "=== X360Browser 3.6.0 - compilacao Xbox 360 ==="

          BUILD_SCRIPT=""

          for candidate in \
            "$PROJECT_DIR/tools/build_xbox_shell.sh" \
            "$PROJECT_DIR/tools/build_xbox360.sh" \
            "$PROJECT_DIR/tools/build_xex.sh" \
            "$PROJECT_DIR/platform/xbox360/build.sh" \
            "$PROJECT_DIR/build_xbox_shell.sh"; do

            if [[ -s "$candidate" ]]; then
              BUILD_SCRIPT="$candidate"
              break
            fi
          done

          if [[ -z "$BUILD_SCRIPT" ]]; then
            BUILD_SCRIPT="$(find "$PROJECT_DIR" -type f \
              \( -name 'build_xbox_shell.sh' \
                 -o -name 'build_xbox360.sh' \
                 -o -name 'build_xex.sh' \) \
              -not -path '*/.git/*' -print -quit 2>/dev/null || true)"
          fi

          if [[ -z "$BUILD_SCRIPT" || ! -s "$BUILD_SCRIPT" ]]; then
            log "::error::Nenhum script de compilacao XEX foi encontrado."
            exit 2
          fi

          log "Script selecionado: $BUILD_SCRIPT"

          rm -rf "$PROJECT_DIR/build-xbox360"

          find "$PROJECT_DIR" -type f -iname '*.xex' \
            -not -path '*/.git/*' -delete

          bash "$BUILD_SCRIPT" 2>&1 | tee -a "$LOG"

          XEX_PATH="$(find "$PROJECT_DIR" -type f -iname '*.xex' \
            -not -path '*/.git/*' -not -path '*/tests/*' \
            -print -quit 2>/dev/null || true)"

          if [[ -z "$XEX_PATH" || ! -s "$XEX_PATH" ]]; then
            log "::error::A compilacao terminou sem produzir um arquivo .xex."
            exit 1
          fi

          STAGE="$RUNNER_TEMP/x360browser-xex-package"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          cp "$XEX_PATH" "$STAGE/X360Browser.xex"

          for candidate in \
            "$PROJECT_DIR/build-xbox360/cacert.pem" \
            "$PROJECT_DIR/cacert.pem" \
            "$PROJECT_DIR/platform/xbox360/cacert.pem"; do

            if [[ -s "$candidate" ]]; then
              cp "$candidate" "$STAGE/cacert.pem"
              break
            fi
          done

          if [[ -s "$PROJECT_DIR/build-xbox360/README.txt" ]]; then
            cp "$PROJECT_DIR/build-xbox360/README.txt" "$STAGE/README.txt"
          fi

          (cd "$STAGE" && zip -9 -X -q "$OUT/X360Browser-3.6.0-XEX.zip" ./*)

          unzip -t "$OUT/X360Browser-3.6.0-XEX.zip" | tee -a "$LOG"

          sha256sum \
            "$STAGE/X360Browser.xex" \
            "$OUT/X360Browser-3.6.0-XEX.zip" | tee -a "$LOG"

          {
            echo "## X360Browser 3.6.0 - XEX"
            echo
            echo "O arquivo XEX foi criado e empacotado."
            echo
            echo "- Artifact: X360Browser-3.6.0-automatic-build"
            echo "- Arquivo: X360Browser-3.6.0-XEX.zip"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate diagnostic summary
        if: always()
        shell: bash
        env:
          RESOLVE_RESULT: ${{ steps.resolve-source.outcome }}
          REPAIR_RESULT: ${{ steps.repair-tests.outcome }}
          INTEGRITY_RESULT: ${{ steps.integrity.outcome }}
          HOST_TEST_RESULT: ${{ steps.host-tests.outcome }}
          HOST_BUILD_RESULT: ${{ steps.host-build.outcome }}
          XEX_RESULT: ${{ steps.xex-build.outcome }}
        run: |
          {
            echo "## X360Browser 3.6.0 - Resultados"
            echo
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Localizar codigo-fonte | $RESOLVE_RESULT |"
            echo "| Reparar e verificar teste C | $REPAIR_RESULT |"
            echo "| Integridade do projeto | $INTEGRITY_RESULT |"
            echo "| Testes nativos | $HOST_TEST_RESULT |"
            echo "| Compilacao CMake | $HOST_BUILD_RESULT |"
            echo "| Compilacao Xbox 360 XEX | $XEX_RESULT |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: X360Browser-3.6.0-automatic-build
          path: |
            ${{ runner.temp }}/x360browser-output/**
            ${{ runner.temp }}/x360browser-logs/**
          if-no-files-found: warn
          retention-days: 14
