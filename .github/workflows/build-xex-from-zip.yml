name: XWT Linux 0.15.0 - Build Xenon desktop core

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xwt-linux-core-${{ github.ref }}
  cancel-in-progress: false

env:
  XWT_VERSION: "0.15.0"
  XWT_REVISION: xwt-linux-0.15.0-desktop-gamepad-network-video
  BUILDROOT_COMMIT: 15b0457158bbe24264ab241cbe87c52b4d659f4e
  FREE60_COMMIT: 3c3e76fb1ffa3bcce3a50a6af6b847a2da25139f
  XELL_LAUNCH2_COMMIT: d838b33a763c9ecb022d1a031950879b602e9165
  XELL_LAUNCH2_TAG: v2.2.0
  BR2_DL_DIR: /home/runner/.cache/xwt-buildroot-dl
  CCACHE_DIR: /home/runner/.cache/xwt-buildroot-ccache
  CCACHE_MAXSIZE: 1G

jobs:
  build-core:
    name: Build Xenon kernel, SDL desktop, controls, Wi-Fi and USB package
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift \
            /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
            /usr/share/miniconda /usr/local/lib/node_modules
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          available="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if (( available < 6291456 )); then
            echo "ERROR: menos de 6 GiB livres para compilar." >&2
            df -h
            exit 1
          fi
          df -h

      - name: Install host dependencies (with retry)
        shell: bash
        run: |
          set -Eeuo pipefail
          retry() {
            local max=4 delay=5 n=1
            while true; do
              "$@" && return 0
              if (( n >= max )); then
                echo "Falha definitiva: $*" >&2
                return 1
              fi
              echo "Tentativa $n/$max falhou; nova tentativa em ${delay}s."
              sleep "$delay"
              delay=$((delay * 2))
              n=$((n + 1))
            done
          }
          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make bc bison flex gawk ccache cpio file \
            git curl wget patch rsync unzip zip python3 python3-dev cmake \
            pkg-config perl gettext ca-certificates busybox libncurses-dev \
            libssl-dev libelf-dev zlib1g-dev zstd xz-utils
          git --version
          make --version
          python3 --version
          ccache --version

      - name: Restore build caches (optional)
        id: build-cache
        uses: actions/cache/restore@v6
        continue-on-error: true
        with:
          path: |
            ~/.cache/xwt-buildroot-dl
            ~/.cache/xwt-buildroot-ccache
          key: ${{ runner.os }}-xwt-core-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-cache-v3
          restore-keys: |
            ${{ runner.os }}-xwt-core-${{ env.BUILDROOT_COMMIT }}-
            ${{ runner.os }}-xwt-

      - name: Prepare caches
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$BR2_DL_DIR" "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --show-stats || true

      - name: Extract and validate source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          source_zip="$RUNNER_TEMP/XWT-Linux-source.zip"
          project="$RUNNER_TEMP/xwt-project"

          if [[ -s "$GITHUB_WORKSPACE/XWT-Linux-source.zip" ]]; then
            cp "$GITHUB_WORKSPACE/XWT-Linux-source.zip" "$source_zip"
          else
            python3 - "$GITHUB_WORKSPACE" "$source_zip" <<'PY'
          import stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          root, output = Path(sys.argv[1]), Path(sys.argv[2])
          candidates = sorted(set(
              p for pattern in ("XWT-Linux-GitHub-Upload*.zip", "XWT-Linux-*-setup*.zip")
              for p in root.glob(pattern) if p.is_file()
          ))
          if len(candidates) != 1:
              raise SystemExit("Esperado exatamente um ZIP externo XWT; encontrados: " +
                               ", ".join(p.name for p in candidates))
          with zipfile.ZipFile(candidates[0]) as z:
              entries = [i for i in z.infolist()
                         if PurePosixPath(i.filename).name == "XWT-Linux-source.zip"
                         and not i.is_dir()]
              if len(entries) != 1:
                  raise SystemExit("O ZIP externo deve conter exatamente um XWT-Linux-source.zip")
              item = entries[0]
              path = PurePosixPath(item.filename)
              mode = item.external_attr >> 16
              if path.is_absolute() or ".." in path.parts or "\\" in item.filename or stat.S_ISLNK(mode):
                  raise SystemExit("Caminho inseguro no ZIP externo")
              if item.file_size > 128 * 1024 * 1024:
                  raise SystemExit("ZIP de origem excede 128 MiB")
              with z.open(item) as src, output.open("wb") as dst:
                  while chunk := src.read(1024 * 1024):
                      dst.write(chunk)
          if not output.is_file() or output.stat().st_size == 0:
              raise SystemExit("Falha ao extrair arquivo-fonte")
          PY
          fi

          python3 - "$source_zip" "$project" <<'PY'
          import hashlib, re, shutil, stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          archive, dest = Path(sys.argv[1]), Path(sys.argv[2])
          required = (
            "VERSION", "REVISION.txt", "linux/buildroot.config", "linux/busybox.fragment",
            "linux/xenon-7.2.defconfig", "linux/boot/kboot.conf", "linux/post-build.sh",
            "linux/overlay/etc/inittab", "linux/src/xwt-desktop.c",
            "linux/src/xwt-gamepad-keys.c", "linux/overlay/etc/init.d/S15gamepad",
            "linux/overlay/etc/init.d/S18video", "linux/overlay/etc/init.d/S30storage",
            "linux/overlay/etc/init.d/S40network", "linux/overlay/etc/init.d/S46time",
            "linux/overlay/etc/xwt/wpa_supplicant.conf.example",
            "linux/overlay/usr/sbin/xwt-system-menu",
            "linux/overlay/usr/sbin/xwt-system-menu-text",
            "linux/overlay/usr/sbin/xwt-network", "linux/overlay/usr/sbin/xwt-wifi",
            "linux/overlay/usr/sbin/xwt-video-check", "linux/overlay/usr/sbin/xwt-update",
            "scripts/package_linux_usb.py", "scripts/test_package_linux_usb.py",
            "scripts/package_xwpkg.py", "scripts/test_xwpkg.py", "scripts/test_nand_boundary.py",
            "scripts/test_linux_network.py", "scripts/test_minimal_core.py",
            "scripts/test_updater_runtime.py", "scripts/test_xwt_gamepad.py",
            "scripts/test_xwt_desktop.py", "scripts/test_xwt_wifi.py",
            "scripts/xenos_patchlib.py", "scripts/patch_xenos_driver.py",
            "scripts/test_xenos_patch.py", "scripts/test_xenos_tiling.py",
            "SOURCE-MANIFEST.sha256", "updates/system/opt/xwt/modules/system/bin/xwt-status",
            "README-INSTALL-PT-BR.txt",
          )
          shutil.rmtree(dest, ignore_errors=True); dest.mkdir(parents=True)
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              names = [i.filename for i in infos]
              if len(names) != len(set(names)): raise SystemExit("ZIP contém caminhos duplicados")
              total = 0
              for i in infos:
                  p = PurePosixPath(i.filename); mode = i.external_attr >> 16
                  if p.is_absolute() or ".." in p.parts or "\\" in i.filename or (p.parts and p.parts[0].endswith(":")) or stat.S_ISLNK(mode):
                      raise SystemExit("Caminho inseguro: " + i.filename)
                  total += i.file_size
                  if i.file_size > 128*1024*1024 or total > 512*1024*1024:
                      raise SystemExit("ZIP excede limites de extração")
                  if i.is_dir(): continue
                  target = dest.joinpath(*p.parts); target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(i) as src, target.open("wb") as out:
                      shutil.copyfileobj(src, out)
                  target.chmod(0o755 if mode & 0o111 else 0o644)
          missing = [x for x in required if not (dest/x).is_file()]
          if missing: raise SystemExit("Fonte incompleta: " + ", ".join(missing))
          if (dest/"VERSION").read_text().strip() != "0.15.0": raise SystemExit("VERSION incorreta")
          rev = "xwt-linux-0.15.0-desktop-gamepad-network-video"
          if (dest/"REVISION.txt").read_text().strip() != rev: raise SystemExit("REVISION incorreta")
          expected = {}
          for line in (dest/"SOURCE-MANIFEST.sha256").read_text(encoding="ascii").splitlines():
              m = re.fullmatch(r"([0-9a-f]{64})  (.+)", line)
              if not m: raise SystemExit("Linha inválida em SOURCE-MANIFEST.sha256")
              digest, name = m.groups()
              if name in expected: raise SystemExit("Caminho duplicado no manifesto: "+name)
              expected[name] = digest
          if not expected: raise SystemExit("Manifesto vazio")
          actual = {p.relative_to(dest).as_posix() for p in dest.rglob("*")
                    if p.is_file() and p.name != "SOURCE-MANIFEST.sha256"
                    and "__pycache__" not in p.parts and not p.name.endswith(".pyc")}
          expected = {n:d for n,d in expected.items()
                      if "__pycache__" not in n.split("/") and not n.endswith(".pyc")}
          if actual != set(expected):
              raise SystemExit(f"Manifesto divergente; sem hash: {sorted(actual-set(expected))}; ausentes: {sorted(set(expected)-actual)}")
          for name, digest in expected.items():
              if hashlib.sha256((dest/name).read_bytes()).hexdigest() != digest:
                  raise SystemExit("SHA-256 incorreto: "+name)
          print(f"Fonte validada: {len(expected)} arquivos.")
          PY
          mkdir -p "$project/.github/workflows"
          if [[ -s "$GITHUB_WORKSPACE/.github/workflows/build-xex-from-zip.yml" ]]; then
            cp "$GITHUB_WORKSPACE/.github/workflows/build-xex-from-zip.yml" "$project/.github/workflows/"
          else
            echo "Aviso: workflow build-xex-from-zip.yml não encontrado; não será incluído na fonte."
          fi
          echo "PROJECT_DIR=$project" >> "$GITHUB_ENV"

      - name: Run host tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/scripts"
          python3 -m unittest -v \
            test_package_linux_usb test_xwpkg test_nand_boundary \
            test_linux_network test_minimal_core test_updater_runtime \
            test_xwt_gamepad test_xwt_desktop test_xwt_wifi \
            test_xenos_patch test_xenos_tiling

      - name: Fetch pinned Free60 Xenon kernel (retry network only)
        shell: bash
        run: |
          set -Eeuo pipefail
          retry() {
            local max=4 delay=5 n=1
            while true; do "$@" && return 0
              (( n >= max )) && return 1
              sleep "$delay"; delay=$((delay*2)); n=$((n+1))
            done
          }
          dir="$RUNNER_TEMP/free60-xenon"
          git init "$dir"
          git -C "$dir" remote add origin https://github.com/Free60Project/linux-kernel-xbox360.git
          retry git -C "$dir" fetch --depth=1 origin "$FREE60_COMMIT"
          git -C "$dir" checkout --detach FETCH_HEAD
          [[ "$(git -C "$dir" rev-parse HEAD)" == "$FREE60_COMMIT" ]]
          test -s "$dir/xenon-7.2.defconfig"
          test -s "$dir/patch-7.2-xenon0.30.diff"
          python3 - "$dir/patch-7.2-xenon0.30.diff" <<'PY'
          import re, sys
          from pathlib import Path
          p = Path(sys.argv[1]).read_text(errors="replace")
          checks = {
            "PPC_XENON": r"(?m)^\+\s*config\s+PPC_XENON\s*$",
            "dependência PPC64": r"(?m)^\+\s*depends\s+on\s+PPC64\s*$",
            "default y": r"(?m)^\+\s*default\s+y\s*$",
            "imagem Xenon": r"(?m)^\+image-\$\(CONFIG_PPC_XENON\)\s*\+=\s*zImage\.xenon\s*$",
            "alvo zImage.xenon": r"(?m)^\+\$\(obj\)/zImage\.xenon:\s*\$\(obj\)/vmlinux\.strip\s*$",
            "ELF32 PPC": r"(?m)^\+\s*@?\$\(OBJCOPY\)\s+-O\s+elf32-powerpc\s+\$<\s+\$@\s*$",
          }
          missing=[k for k,v in checks.items() if not re.search(v,p)]
          if missing: raise SystemExit("Patch Free60 incompatível: "+", ".join(missing))
          PY
          cp "$dir/xenon-7.2.defconfig" "$PROJECT_DIR/linux/xenon-7.2.defconfig"
          printf '%s\n' "$FREE60_COMMIT" > "$PROJECT_DIR/linux/FREE60-KERNEL-COMMIT.txt"
          python3 - "$PROJECT_DIR/linux/xenon-7.2.defconfig" <<'PY'
          import re, sys
          from pathlib import Path
          path=Path(sys.argv[1])
          opts={
            "CONFIG_DRM_FBDEV_EMULATION":"y","CONFIG_FRAMEBUFFER_CONSOLE":"y",
            "CONFIG_BLK_DEV_INITRD":"y","CONFIG_RD_GZIP":"y","CONFIG_VT":"y",
            "CONFIG_VT_CONSOLE":"y","CONFIG_UNIX98_PTYS":"y","CONFIG_TMPFS":"y",
            "CONFIG_FB":"y","CONFIG_FAT_FS":"y","CONFIG_VFAT_FS":"y",
            "CONFIG_USB_STORAGE":"y","CONFIG_USB_EHCI_HCD":"y","CONFIG_USB_OHCI_HCD":"y",
            "CONFIG_SCSI":"y","CONFIG_BLK_DEV_SD":"y","CONFIG_INPUT":"y",
            "CONFIG_INPUT_KEYBOARD":"y","CONFIG_INPUT_EVDEV":"y","CONFIG_INPUT_JOYSTICK":"y",
            "CONFIG_DEVTMPFS":"y","CONFIG_DEVTMPFS_MOUNT":"y","CONFIG_PROC_FS":"y",
            "CONFIG_SYSFS":"y","CONFIG_UEVENT_HELPER":"y","CONFIG_INPUT_UINPUT":"m",
            "CONFIG_INPUT_JOYDEV":"m","CONFIG_JOYSTICK_XPAD":"m","CONFIG_USB_HID":"y",
            "CONFIG_HID_GENERIC":"y",
          }
          pat=re.compile(r"^(?:# )?(CONFIG_[A-Z0-9_]+)(?:=.*| is not set)$")
          lines=[line for line in path.read_text().splitlines()
                 if not ((m:=pat.match(line)) and m.group(1) in opts)]
          lines += [f"{k}={v}" for k,v in opts.items()]
          path.write_text("\n".join(lines)+"\n")
          PY
          for symbol in CONFIG_PPC64=y CONFIG_BLK_DEV_INITRD=y CONFIG_RD_GZIP=y \
            CONFIG_DRM_XENOS=y CONFIG_SIS190=y CONFIG_USB_STORAGE=y \
            CONFIG_JOYSTICK_XPAD=m CONFIG_INPUT_KEYBOARD=y \
            CONFIG_INPUT_JOYDEV=m CONFIG_INPUT_UINPUT=m; do
            grep -Fqx "$symbol" "$PROJECT_DIR/linux/xenon-7.2.defconfig" || {
              echo "Defconfig não contém $symbol" >&2; exit 1; }
          done

      - name: Fetch pinned Buildroot (retry network only)
        shell: bash
        run: |
          set -Eeuo pipefail
          retry() {
            local max=4 delay=5 n=1
            while true; do "$@" && return 0
              (( n >= max )) && return 1
              sleep "$delay"; delay=$((delay*2)); n=$((n+1))
            done
          }
          dir="$RUNNER_TEMP/buildroot"
          git init "$dir"
          git -C "$dir" remote add origin https://github.com/buildroot/buildroot.git
          retry git -C "$dir" fetch --depth=1 origin "$BUILDROOT_COMMIT"
          git -C "$dir" checkout --detach FETCH_HEAD
          [[ "$(git -C "$dir" rev-parse HEAD)" == "$BUILDROOT_COMMIT" ]]
          echo "BUILDROOT_DIR=$dir" >> "$GITHUB_ENV"
          git -C "$dir" rev-parse HEAD > "$RUNNER_TEMP/buildroot-commit.txt"

      - name: Configure Buildroot
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/buildroot-output"
          mkdir -p "$out"
          cp "$PROJECT_DIR/linux/buildroot.config" "$out/.config"
          sed -i \
            -e "s|@PROJECT_ROOT@|$PROJECT_DIR|g" \
            -e "s|@FREE60_ROOT@|$RUNNER_TEMP/free60-xenon|g" \
            -e "s|@BUILDROOT_OUTPUT@|$out|g" "$out/.config"
          python3 - "$out/.config" "$HOME" "$RUNNER_TEMP/free60-xenon" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); home=sys.argv[2]; free60=sys.argv[3]
          lines=p.read_text().splitlines()
          values={
            "BR2_KERNEL_HEADERS_7_2":"y","BR2_TOOLCHAIN_BUILDROOT":"y",
            "BR2_TOOLCHAIN_BUILDROOT_GLIBC":"y","BR2_PACKAGE_BUSYBOX_SHOW_OTHERS":"y",
            "BR2_CCACHE":"y","BR2_CCACHE_DIR":f'"{home}/.cache/xwt-buildroot-ccache"',
            "BR2_LINUX_KERNEL_INSTALL_TARGET":"y",
            "BR2_LINUX_KERNEL_PATCH":f'"{free60}/patch-7.2-xenon0.30.diff"',
          }
          for key,value in values.items():
            lines=[x for x in lines if not x.startswith(key+"=") and x != f"# {key} is not set"]
            lines.append(f"{key}={value}")
          p.write_text("\n".join(lines)+"\n")
          PY
          retry_make() {
            local log="$1"; shift
            if make -C "$BUILDROOT_DIR" O="$out" BR2_DL_DIR="$BR2_DL_DIR" "$@" 2>&1 | tee "$log"; then
              return 0
            fi
            echo "Primeira tentativa make falhou; repetindo uma vez sem paralelismo." >&2
            make -C "$BUILDROOT_DIR" O="$out" BR2_DL_DIR="$BR2_DL_DIR" "$@" 2>&1 | tee -a "$log"
          }
          retry_make "$RUNNER_TEMP/buildroot-configure.log" olddefconfig
          config="$out/.config"
          require() { grep -Fqx "$1" "$config" || { echo "Config ausente: $1" >&2; exit 1; }; }
          for item in \
            BR2_powerpc64=y BR2_powerpc_970=y BR2_INIT_BUSYBOX=y \
            BR2_KERNEL_HEADERS_7_2=y BR2_TOOLCHAIN_BUILDROOT=y \
            BR2_TOOLCHAIN_BUILDROOT_GLIBC=y BR2_TOOLCHAIN_USES_GLIBC=y \
            BR2_PACKAGE_BUSYBOX=y BR2_PACKAGE_KMOD=y BR2_PACKAGE_KMOD_TOOLS=y \
            BR2_PACKAGE_IPROUTE2=y BR2_PACKAGE_LIBCURL=y BR2_PACKAGE_LIBCURL_CURL=y \
            BR2_PACKAGE_OPENSSL=y BR2_PACKAGE_CA_CERTIFICATES=y BR2_LINUX_KERNEL=y \
            BR2_LINUX_KERNEL_INSTALL_TARGET=y 'BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="7.2"' \
            'BR2_LINUX_KERNEL_IMAGE_TARGET_NAME="zImage.xenon"' \
            BR2_TARGET_ROOTFS_CPIO=y BR2_TARGET_ROOTFS_CPIO_GZIP=y \
            BR2_PACKAGE_SDL=y BR2_PACKAGE_SDL_FBCON=y BR2_PACKAGE_SDL_TTF=y \
            BR2_PACKAGE_DEJAVU=y BR2_PACKAGE_DEJAVU_SANS=y BR2_PACKAGE_DIALOG=y \
            BR2_PACKAGE_IW=y BR2_PACKAGE_WPA_SUPPLICANT=y \
            BR2_PACKAGE_WPA_SUPPLICANT_NL80211=y BR2_PACKAGE_WPA_SUPPLICANT_CLI=y \
            BR2_PACKAGE_ALSA_UTILS=y BR2_PACKAGE_ALSA_UTILS_ALSAMIXER=y \
            BR2_PACKAGE_ALSA_UTILS_APLAY=y; do require "$item"; done
          if grep -Eq '^BR2_PACKAGE_(NETSURF|PYTHON3|LINUX_FIRMWARE)=y$' "$config"; then
            echo "Pacote pesado inesperado habilitado." >&2; exit 1
          fi
          echo "Buildroot config validada."

      - name: Keep Xenon kernel image out of PPC64 root filesystem
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$BUILDROOT_DIR/linux/linux.mk" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          old="\t$(LINUX_INSTALL_KERNEL_IMAGE_TO_TARGET)\n"
          if s.count(old)!=1:
            raise SystemExit("Regra linux.mk inesperada; alteração recusada.")
          p.write_text(s.replace(old,"\t# XWT: keep Xenon boot image in images/, outside PPC64 rootfs.\n",1))
          PY

      # CONFIG_PPC_XENON is intentionally NOT expected in the raw defconfig.
      - name: Preflight Linux Xenon Kconfig
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/buildroot-output"
          make -C "$BUILDROOT_DIR" O="$out" BR2_DL_DIR="$BR2_DL_DIR" linux-configure \
            2>&1 | tee "$RUNNER_TEMP/linux-configure.log"
          config="$(find "$out/build" -maxdepth 4 -type f -path '*/linux-*/.config' -print -quit)"
          test -s "$config" || { echo "Kconfig Linux não gerou .config" >&2; exit 1; }
          for item in CONFIG_PPC_XENON=y CONFIG_PPC64=y CONFIG_BLK_DEV_INITRD=y \
            CONFIG_RD_GZIP=y CONFIG_DRM_XENOS=y CONFIG_DRM_FBDEV_EMULATION=y \
            CONFIG_FRAMEBUFFER_CONSOLE=y CONFIG_SIS190=y CONFIG_USB_STORAGE=y \
            CONFIG_JOYSTICK_XPAD=m CONFIG_INPUT_KEYBOARD=y \
            CONFIG_INPUT_JOYDEV=m CONFIG_INPUT_UINPUT=m; do
            grep -Fqx "$item" "$config" || { echo "Kconfig sem $item" >&2; exit 1; }
          done

      - name: Ensure post-build script is executable
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s "$PROJECT_DIR/linux/post-build.sh"
          chmod 0755 "$PROJECT_DIR/linux/post-build.sh"
          test -x "$PROJECT_DIR/linux/post-build.sh"

      - name: Patch and strictly validate Xenos DRM source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$PROJECT_DIR/scripts/patch_xenos_driver.py" "$RUNNER_TEMP/buildroot-output"
          driver="$(find "$RUNNER_TEMP/buildroot-output/build" -maxdepth 6 -type f -path '*/drivers/gpu/drm/tiny/xenos.c' -print -quit)"
          test -s "$driver"
          grep -Fq 'XWT-0.15.0: guarded 32x32 tiled scanout' "$driver"
          python3 - "$driver" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text(encoding="utf-8")
          # Normalize escaped quote sequences in C string delimiters only for the
          # known diagnostic; do not globally rewrite unrelated driver strings.
          bad='dev_err(&pdev->dev, \\\\"Xenos requires 32-bit DMA addressing\\\\n\\\\");'
          good='dev_err(&pdev->dev, "Xenos requires 32-bit DMA addressing\\\\n");'
          s=s.replace(bad,good)
          if "Xenos requires 32-bit DMA addressing" not in s:
            raise SystemExit("Diagnóstico DMA do driver Xenos não encontrado.")
          if '\\x01' in s or chr(1) in s:
            raise SystemExit("Byte de controle inválido encontrado em xenos.c")
          if '\\\\"Xenos requires' in s:
            raise SystemExit("Aspas escapadas inválidas permanecem no diagnóstico DMA.")
          if "invalid Xenos scanout dimensions:" not in s:
            raise SystemExit("Diagnóstico de dimensões Xenos ausente.")
          p.write_text(s,encoding="utf-8")
          print("Driver Xenos verificado; nenhum byte de controle/aspas inválidas.")
          PY

      - name: Build kernel and root filesystem (parallel, then serial fallback)
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/buildroot-output"
          jobs="$(nproc)"; (( jobs > 4 )) && jobs=4
          ccache --zero-stats || true
          if ! make -C "$BUILDROOT_DIR" O="$out" BR2_DL_DIR="$BR2_DL_DIR" -j"$jobs" \
              2>&1 | tee "$RUNNER_TEMP/buildroot-build.log"; then
            echo "Build paralelo falhou; retomando com -j1 para reduzir pressão de memória/concorrência." >&2
            make -C "$BUILDROOT_DIR" O="$out" BR2_DL_DIR="$BR2_DL_DIR" -j1 \
              2>&1 | tee -a "$RUNNER_TEMP/buildroot-build.log"
          fi
          target="$out/target"
          test -s "$out/images/zImage.xenon"
          test -s "$out/images/rootfs.cpio.gz"
          gzip -t "$out/images/rootfs.cpio.gz"
          test ! -e "$target/boot/zImage.xenon"
          test -d "$target/lib/modules"
          for bin in xwt-system-menu xwt-system-menu-text xwt-update xwt-network xwt-wifi xwt-video-check xwt-desktop xwt-gamepad-keys; do
            test -x "$target/usr/sbin/$bin" || { echo "Executável obrigatório ausente: $bin" >&2; exit 1; }
          done
          test -s "$target/usr/share/fonts/dejavu/DejaVuSans.ttf"
          test -x "$target/usr/bin/curl"
          kconfig="$(find "$out/build" -maxdepth 4 -type f -path '*/linux-*/.config' -print -quit)"
          test -s "$kconfig"
          for item in CONFIG_PPC_XENON=y CONFIG_PPC64=y CONFIG_BLK_DEV_INITRD=y \
            CONFIG_RD_GZIP=y CONFIG_DRM_XENOS=y CONFIG_DRM_FBDEV_EMULATION=y \
            CONFIG_FRAMEBUFFER_CONSOLE=y CONFIG_SIS190=y CONFIG_USB_STORAGE=y \
            CONFIG_JOYSTICK_XPAD=m CONFIG_INPUT_KEYBOARD=y \
            CONFIG_INPUT_JOYDEV=m CONFIG_INPUT_UINPUT=m; do
            grep -Fqx "$item" "$kconfig" || { echo "Kernel config sem $item" >&2; exit 1; }
          done
          for module in xpad joydev uinput; do
            find "$target/lib/modules" -type f \( -name "$module.ko" -o -name "$module.ko.xz" -o -name "$module.ko.zst" \) -print -quit | grep -q . || {
              echo "Módulo obrigatório ausente: $module" >&2; exit 1; }
          done
          python3 - "$out/images/rootfs.cpio.gz" <<'PY'
          import gzip,sys
          from pathlib import PurePosixPath
          def align(n): return (n+3)&~3
          names=set(); executable=set()
          with gzip.open(sys.argv[1],"rb") as f:
            while True:
              h=f.read(110)
              if not h: break
              if len(h)!=110 or h[:6] not in (b"070701",b"070702"): raise SystemExit("Cabeçalho CPIO inválido")
              v=[int(h[i:i+8],16) for i in range(6,110,8)]
              mode,size,namesize=v[1],v[6],v[11]
              raw=f.read(namesize)
              if len(raw)!=namesize or not raw.endswith(b"\0"): raise SystemExit("Nome CPIO inválido")
              name=raw[:-1].decode("utf-8")
              while name.startswith("./"): name=name[2:]
              if name=="TRAILER!!!": break
              p=PurePosixPath(name)
              if p.is_absolute() or ".." in p.parts or "\\" in name: raise SystemExit("Caminho CPIO inseguro: "+name)
              f.seek(align(110+namesize)-(110+namesize),1)
              names.add(name)
              if mode&0o111: executable.add(name)
              f.seek(size,1); f.seek(align(size)-size,1)
          required={
            "etc/inittab","sbin/mdev","etc/init.d/S15gamepad","etc/init.d/S18video",
            "etc/init.d/S30storage","etc/init.d/S40network","etc/init.d/S46time",
            "usr/sbin/xwt-system-menu","usr/sbin/xwt-system-menu-text","usr/sbin/xwt-update",
            "usr/sbin/xwt-network","usr/sbin/xwt-wifi","usr/sbin/xwt-video-check",
            "usr/sbin/xwt-desktop","usr/sbin/xwt-gamepad-keys",
            "usr/share/fonts/dejavu/DejaVuSans.ttf","usr/bin/curl"}
          missing=required-names
          if missing: raise SystemExit("Arquivos ausentes no initramfs: "+", ".join(sorted(missing)))
          missing_exec={x for x in required if x.startswith(("etc/init.d/","usr/sbin/"))}-executable
          if missing_exec: raise SystemExit("Permissão executável ausente: "+", ".join(sorted(missing_exec)))
          print(f"Initramfs validado: {len(names)} entradas.")
          PY
          ccache --show-stats || true

      - name: Validate XeLL-compatible Xenon boot wrapper
        shell: bash
        run: |
          set -Eeuo pipefail
          kernel="$RUNNER_TEMP/buildroot-output/images/zImage.xenon"
          test -s "$kernel"
          file "$kernel"
          PYTHONPATH="$PROJECT_DIR/scripts" python3 - "$kernel" <<'PY'
          import sys
          from pathlib import Path
          import package_linux_usb
          p=Path(sys.argv[1]); package_linux_usb.validate_kernel(p)
          print(f"Wrapper ELF32/PPC validado: {p.stat().st_size} bytes")
          PY

      - name: Save cross-toolchain cache
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          root="$HOME/.cache/xwt-cross-toolchain"
          test -d "$RUNNER_TEMP/buildroot-output/host"
          test -d "$RUNNER_TEMP/buildroot-output/staging"
          rm -rf "$root"; mkdir -p "$root/staging"
          cp -a "$RUNNER_TEMP/buildroot-output/host" "$root/host"
          cp -a "$RUNNER_TEMP/buildroot-output/staging/." "$root/staging/"

      - name: Persist cross-toolchain cache
        if: success()
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: ~/.cache/xwt-cross-toolchain
          key: ${{ runner.os }}-xwt-cross-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-desktop-core-v3

      - name: Save Buildroot caches
        if: ${{ always() && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        continue-on-error: true
        with:
          path: |
            ~/.cache/xwt-buildroot-dl
            ~/.cache/xwt-buildroot-ccache
          key: ${{ runner.os }}-xwt-core-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-cache-v3

      - name: Download and validate XellLaunch2
        shell: bash
        run: |
          set -Eeuo pipefail
          retry_curl() {
            local url="$1" output="$2" max=4 delay=5 n=1
            while true; do
              if curl --fail --location --silent --show-error --retry 2 --retry-all-errors "$url" -o "$output"; then return 0; fi
              (( n >= max )) && return 1
              sleep "$delay"; delay=$((delay*2)); n=$((n+1))
            done
          }
          local_launcher=""
          for candidate in "$GITHUB_WORKSPACE/XellLaunch2.xex" \
            "$GITHUB_WORKSPACE/default.xex" "$GITHUB_WORKSPACE/XellLaunch2-retail.xex"; do
            if [[ -s "$candidate" ]]; then local_launcher="$candidate"; break; fi
          done
          if [[ -n "$local_launcher" ]]; then
            cp "$local_launcher" "$RUNNER_TEMP/default.xex"
          else
            api="https://api.github.com/repos/mitchellwaite/XellLaunch2/releases/tags/${XELL_LAUNCH2_TAG}"
            retry_curl "$api" "$RUNNER_TEMP/xell-release.json"
            python3 - "$RUNNER_TEMP/xell-release.json" "$RUNNER_TEMP/xell-url.txt" <<'PY'
          import json,sys
          from pathlib import Path
          d=json.loads(Path(sys.argv[1]).read_text())
          if d.get("tag_name")!="v2.2.0": raise SystemExit("Tag XellLaunch2 inesperada")
          assets=[a for a in d.get("assets",[]) if a.get("name","").lower().endswith(".xex") and "retail" in a.get("name","").lower()]
          if len(assets)!=1: raise SystemExit("Não foi possível identificar exatamente um XEX retail")
          Path(sys.argv[2]).write_text(assets[0]["browser_download_url"]+"\n")
          PY
            retry_curl "$(cat "$RUNNER_TEMP/xell-url.txt")" "$RUNNER_TEMP/default.xex"
          fi
          test "$(head -c 4 "$RUNNER_TEMP/default.xex")" = "XEX2" || {
            echo "Launcher não é um arquivo XEX2 válido." >&2; exit 1; }
          license_url="https://raw.githubusercontent.com/mitchellwaite/XellLaunch2/${XELL_LAUNCH2_COMMIT}/LICENSE"
          if ! retry_curl "$license_url" "$RUNNER_TEMP/XellLaunch2-LICENSE.txt"; then
            echo "Não foi possível obter a licença oficial do XellLaunch2." >&2
            exit 1
          fi
          grep -q '^MIT License' "$RUNNER_TEMP/XellLaunch2-LICENSE.txt"

      - name: Package USB bundle, source, module and update manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$PROJECT_DIR/scripts/package_linux_usb.py" \
            --launcher "$RUNNER_TEMP/default.xex" \
            --launcher-license "$RUNNER_TEMP/XellLaunch2-LICENSE.txt" \
            --kernel "$RUNNER_TEMP/buildroot-output/images/zImage.xenon" \
            --initrd "$RUNNER_TEMP/buildroot-output/images/rootfs.cpio.gz" \
            --project "$PROJECT_DIR" \
            --output "$RUNNER_TEMP/XWT-Linux-${XWT_VERSION}-USB.zip"
          sha256sum "$RUNNER_TEMP/XWT-Linux-${XWT_VERSION}-USB.zip" > "$RUNNER_TEMP/USB-SHA256.txt"

          python3 - "$PROJECT_DIR" "$RUNNER_TEMP/XWT-Linux-${XWT_VERSION}-source.zip" <<'PY'
          import hashlib,sys,zipfile
          from pathlib import Path
          root,out=Path(sys.argv[1]),Path(sys.argv[2])
          files=[p for p in sorted(root.rglob("*")) if p.is_file()
                 and ".git" not in p.parts and "__pycache__" not in p.parts
                 and p.suffix not in {".pyc",".pyo"} and p.name!="SOURCE-MANIFEST.sha256"]
          manifest="".join(f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(root).as_posix()}\n" for p in files)
          (root/"SOURCE-MANIFEST.sha256").write_text(manifest,encoding="ascii")
          with zipfile.ZipFile(out,"w",zipfile.ZIP_DEFLATED,compresslevel=6) as z:
            for p in files+[root/"SOURCE-MANIFEST.sha256"]:
              z.write(p,p.relative_to(root).as_posix())
          print(f"Pacote-fonte gerado: {len(files)} arquivos.")
          PY

          system_version="${XWT_VERSION}+${GITHUB_SHA:0:12}"
          python3 "$PROJECT_DIR/scripts/package_xwpkg.py" \
            --payload "$PROJECT_DIR/updates/system" --component system \
            --version "$system_version" --output "$RUNNER_TEMP/system.xwpkg"
          sha256sum "$RUNNER_TEMP/system.xwpkg" | awk '{print $1 "  system.xwpkg"}' > "$RUNNER_TEMP/system-SHA256.txt"

          python3 - "$RUNNER_TEMP/latest.tsv" "$RUNNER_TEMP/latest.json" \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$XWT_VERSION" "$XWT_REVISION" \
            "$system_version" "$RUNNER_TEMP/system.xwpkg" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          manifest,metadata,repo,commit,version,revision,sv,package=sys.argv[1:]
          tag=f"xwt-v{version}-core-{commit[:12]}"
          usb=f"https://github.com/{repo}/releases/download/{tag}/XWT-Linux-{version}-USB.zip"
          digest=hashlib.sha256(Path(package).read_bytes()).hexdigest()
          module=f"https://github.com/{repo}/releases/download/xwt-linux-dev/system.xwpkg"
          Path(manifest).write_text(f"XWT-UPDATES-V1\nsystem|{sv}|{digest}|{module}\n")
          data={"schema":1,"product":"XWT Linux","version":version,"revision":revision,
                "release_tag":"xwt-linux-dev","base":{"usb_package":usb},
                "components":{"system":{"version":sv,"sha256":digest,"package":module}},
                "boot":{"chain":"default.xex -> XellLaunch2 -> XeLL Reloaded -> ELF32 zImage.xenon wrapper + initramfs",
                        "physical_console_tested":False,"nand_write":False}}
          Path(metadata).write_text(json.dumps(data,indent=2)+"\n")
          PY
          printf 'XWT Linux %s\nDesktop + controller + connectivity build\nCommit: %s\nBuildroot: %s\nFree60: %s\n' \
            "$XWT_VERSION" "$GITHUB_SHA" "$BUILDROOT_COMMIT" "$FREE60_COMMIT" \
            > "$RUNNER_TEMP/BUILD-REPORT.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: xwt-linux-core-${{ github.sha }}
          path: |
            ${{ runner.temp }}/XWT-Linux-*-USB.zip
            ${{ runner.temp }}/XWT-Linux-*-source.zip
            ${{ runner.temp }}/latest.json
            ${{ runner.temp }}/latest.tsv
            ${{ runner.temp }}/system.xwpkg
            ${{ runner.temp }}/system-SHA256.txt
            ${{ runner.temp }}/USB-SHA256.txt
            ${{ runner.temp }}/BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xwt-linux-core-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/buildroot-output/.config
            ${{ runner.temp }}/buildroot-configure.log
            ${{ runner.temp }}/linux-configure.log
            ${{ runner.temp }}/buildroot-build.log
            ${{ runner.temp }}/free60-commit.txt
            ${{ runner.temp }}/buildroot-commit.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## XWT Linux 0.15.0 — Desktop + Controller + Connectivity'
            echo 'Kernel Xenon, desktop SDL, controller bridge, networking and USB package.'
            echo 'Hardware compatibility still requires physical Xbox 360 testing.'
            echo 'NAND writes: none. Physical test: pending.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-core:
    name: Publish tested core package
    needs: build-core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v8
        with:
          name: xwt-linux-core-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets

      - name: Publish core and safely merge update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/release-assets"
          USB_FILE="$(find . -maxdepth 1 -name '*-USB.zip' -print -quit)"
          SRC_FILE="$(find . -maxdepth 1 -name '*-source.zip' -print -quit)"
          SYSTEM_FILE="$(find . -maxdepth 1 -name 'system.xwpkg' -print -quit)"
          for f in "$USB_FILE" "$SRC_FILE" "$SYSTEM_FILE" latest.json latest.tsv system-SHA256.txt USB-SHA256.txt BUILD-REPORT.txt; do
            [[ -n "$f" && -s "$f" ]] || { echo "Artefato ausente/vazio: $f" >&2; exit 1; }
          done

          tag="xwt-v${XWT_VERSION}-core-${GITHUB_SHA:0:12}"
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          # XWT Linux ${XWT_VERSION} — Desktop Core

          Desktop SDL/fbcon, ponte de controle uinput, ferramentas Wi-Fi/áudio,
          diagnóstico e correção do framebuffer Xenos.

          Requer teste físico no Xbox 360. O pacote não grava NAND, KV, SMC ou firmware.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$USB_FILE" "$SRC_FILE" "$SYSTEM_FILE" \
              latest.json latest.tsv system-SHA256.txt USB-SHA256.txt BUILD-REPORT.txt --clobber
          else
            gh release create "$tag" "$USB_FILE" "$SRC_FILE" "$SYSTEM_FILE" \
              latest.json latest.tsv system-SHA256.txt USB-SHA256.txt BUILD-REPORT.txt \
              --target "$GITHUB_SHA" --title "XWT Linux ${XWT_VERSION} — Desktop Core" \
              --notes-file "$notes" --prerelease
          fi

          stable="xwt-linux-dev"
          stable_dir="$RUNNER_TEMP/stable"
          mkdir -p "$stable_dir"
          old_manifest="$stable_dir/latest.tsv"
          stable_exists=false
          if gh release view "$stable" >/dev/null 2>&1; then
            stable_exists=true
            # Do not ignore a failed download: that could erase existing modules.
            gh release download "$stable" --pattern latest.tsv --dir "$stable_dir"
            [[ -s "$old_manifest" ]] || { echo "Release estável existe, mas latest.tsv não foi obtido; publicação abortada." >&2; exit 1; }
          fi

          python3 - latest.tsv "$old_manifest" "$RUNNER_TEMP/merged-latest.tsv" <<'PY'
          import re,sys
          from pathlib import Path
          incoming_path,old_path,out_path=map(Path,sys.argv[1:])
          incoming=incoming_path.read_text(encoding="utf-8").splitlines()
          if not incoming or incoming[0]!="XWT-UPDATES-V1":
              raise SystemExit("Manifesto novo inválido: cabeçalho ausente.")
          def validate(rows,label):
              seen=set()
              for line in rows:
                  if not line: continue
                  parts=line.split("|")
                  if len(parts)!=4: raise SystemExit(f"Linha inválida em {label}: {line}")
                  component,version,digest,url=parts
                  if not re.fullmatch(r"[A-Za-z0-9._-]+",component):
                      raise SystemExit(f"Componente inválido em {label}: {component}")
                  if not version or not re.fullmatch(r"[0-9a-f]{64}",digest):
                      raise SystemExit(f"Versão/hash inválido em {label}: {line}")
                  if not url.startswith("https://"):
                      raise SystemExit(f"URL não HTTPS em {label}: {url}")
                  if component in seen: raise SystemExit(f"Componente duplicado em {label}: {component}")
                  seen.add(component)
              return seen
          new_rows=[x for x in incoming[1:] if x]
          if not new_rows: raise SystemExit("Manifesto recebido não contém módulos.")
          new_components=validate(new_rows,"manifesto novo")
          old_rows=[]
          if old_path.is_file():
              old=old_path.read_text(encoding="utf-8").splitlines()
              if not old or old[0]!="XWT-UPDATES-V1":
                  raise SystemExit("Manifesto estável anterior inválido; publicação bloqueada.")
              old_rows=[x for x in old[1:] if x]
              validate(old_rows,"manifesto anterior")
          merged=[x for x in old_rows if x.split("|",1)[0] not in new_components]+new_rows
          validate(merged,"manifesto combinado")
          out_path.write_text("XWT-UPDATES-V1\n"+"\n".join(merged)+"\n",encoding="utf-8")
          print(f"Manifesto combinado validado: {len(merged)} componente(s).")
          PY

          if [[ "$stable_exists" == true ]]; then
            gh release upload "$stable" "$RUNNER_TEMP/merged-latest.tsv" \
              system.xwpkg system-SHA256.txt latest.json --clobber
          else
            gh release create "$stable" "$RUNNER_TEMP/merged-latest.tsv" \
              system.xwpkg system-SHA256.txt latest.json --target "$GITHUB_SHA" \
              --title 'XWT Linux — Incremental updates' \
              --notes 'Canal de atualizações .xwpkg; o core é publicado separadamente.' \
              --prerelease
          fi
          echo "Core release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
          echo "Update channel: https://github.com/$GITHUB_REPOSITORY/releases/tag/$stable" >> "$GITHUB_STEP_SUMMARY"
