name: Build X360 Web Total

on:
  workflow_dispatch:
  push:
    paths:
      - 'browser/**'
      - 'usb/**'
      - 'scripts/**'
      - '.github/workflows/build-x360-web-total.yml'
      - 'VERSION'

permissions:
  contents: read

jobs:
  host-tests:
    name: Host parser and protocol tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure and build
        run: cmake -S browser -B build-host -DCMAKE_BUILD_TYPE=Release
      - name: Compile
        run: cmake --build build-host --parallel 2
      - name: Run tests
        run: ctest --test-dir build-host --output-on-failure

  build-xenon:
    name: Build LibXenon ELF and USB package
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build in the official LibXenon image
        run: |
          docker pull free60/libxenon:latest
          docker run --rm \
            --volume "$GITHUB_WORKSPACE/browser:/app" \
            --workdir /app \
            --entrypoint /bin/sh \
            free60/libxenon:latest \
            -lc 'export DEVKITXENON=/usr/local/xenon; export PATH="$DEVKITXENON/bin:$DEVKITXENON/usr/bin:$PATH"; make clean all'
      - name: Verify ELF output
        run: |
          test -s browser/xenon.elf
          python3 - <<'PY'
          from pathlib import Path
          p = Path('browser/xenon.elf')
          b = p.read_bytes()
          assert b[:4] == b'\x7fELF', 'ELF magic is missing'
          assert b[4] == 1, 'Expected ELF32'
          assert b[5] == 2, 'Expected big-endian PowerPC ELF'
          assert int.from_bytes(b[18:20], 'big') == 20, 'Expected EM_PPC'
          print(f'ELF validated: {len(b)} bytes, ELF32 big-endian PowerPC')
          PY
      - name: Download and verify XellLaunch2 2.2.0
        run: |
          curl --fail --location --retry 3 \
            'https://github.com/mitchellwaite/XellLaunch2/releases/download/v2.2.0/XellLaunch2.xex' \
            --output XellLaunch2.xex
          echo '49dd8666b83a7c7b37597affc46513fe2cb9ab5cb2fe1fb71da1b13175276bb0  XellLaunch2.xex' | sha256sum --check
      - name: Assemble and verify USB root
        run: |
          python3 scripts/package_usb.py \
            --elf browser/xenon.elf \
            --xell XellLaunch2.xex \
            --project "$GITHUB_WORKSPACE" \
            --output X360-Web-Total-USB.zip
      - name: Upload flash-drive package
        uses: actions/upload-artifact@v4
        with:
          name: X360-Web-Total-USB
          path: X360-Web-Total-USB.zip
          if-no-files-found: error
          retention-days: 30
