name: XWT Linux - Build minimal Xenon core

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: xwt-linux-core-${{ github.ref }}
  cancel-in-progress: false

env:
  XWT_VERSION: 0.14.0-alpha.2
  XWT_REVISION: xwt-linux-minimal-core-incremental
  BUILDROOT_COMMIT: 15b0457158bbe24264ab241cbe87c52b4d659f4e
  FREE60_COMMIT: 3c3e76fb1ffa3bcce3a50a6af6b847a2da25139f
  XELL_LAUNCH2_COMMIT: d838b33a763c9ecb022d1a031950879b602e9165
  XELL_LAUNCH2_TAG: v2.2.0
  BR2_DL_DIR: /home/runner/.cache/xwt-buildroot-dl
  CCACHE_DIR: /home/runner/.cache/xwt-buildroot-ccache
  CCACHE_MAXSIZE: 1G

jobs:
  build-core:
    name: Build kernel + minimal rootfs + XEX/ELF USB package
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          set -Eeuo pipefail
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/powershell /usr/share/swift /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup /usr/share/miniconda /usr/local/lib/node_modules
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          AVAILABLE="$(df -Pk /home/runner | awk 'NR==2 {print $4}')"
          if [ "$AVAILABLE" -lt 6291456 ]; then
            echo "Menos de 6 GiB livres para compilar o core." >&2
            df -h
            exit 1
          fi
          df -h

      - name: Install host build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make bc bison flex gawk \
            ccache cpio file git curl wget patch rsync unzip zip \
            python3 python3-dev cmake pkg-config perl gettext ca-certificates busybox \
            libncurses-dev libssl-dev libelf-dev zlib1g-dev zstd xz-utils
          git --version
          make --version
          python3 --version
          ccache --version

      - name: Restore Buildroot downloads and compiler cache
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/xwt-buildroot-dl
            ~/.cache/xwt-buildroot-ccache
          key: ${{ runner.os }}-xwt-core-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-cache-v1
          restore-keys: |
            ${{ runner.os }}-xwt-core-${{ env.BUILDROOT_COMMIT }}-
            ${{ runner.os }}-xwt-

      - name: Prepare caches
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$BR2_DL_DIR" "$CCACHE_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --show-stats

      - name: Extract and validate source archive
        shell: bash
        run: |
          set -Eeuo pipefail
          test -s XWT-Linux-source.zip || {
            echo "Envie XWT-Linux-source.zip para a raiz do repositorio." >&2
            exit 1
          }
          python3 - XWT-Linux-source.zip "$RUNNER_TEMP/xwt-project" <<'PY'
          import shutil, stat, sys, zipfile
          from pathlib import Path, PurePosixPath
          archive, destination = Path(sys.argv[1]), Path(sys.argv[2])
          required = (
              "VERSION", "REVISION.txt", "linux/buildroot.config",
              "linux/busybox.fragment", "linux/xenon-7.2.defconfig",
              "linux/boot/kboot.conf", "linux/post-build.sh",
              "linux/overlay/etc/inittab",
              "linux/overlay/etc/init.d/S15gamepad",
              "linux/overlay/etc/init.d/S30storage",
              "linux/overlay/etc/init.d/S40network",
              "linux/overlay/etc/init.d/S46time",
              "linux/overlay/usr/sbin/xwt-system-menu",
              "linux/overlay/usr/sbin/xwt-system-menu-text",
              "linux/overlay/usr/sbin/xwt-network",
              "linux/overlay/usr/sbin/xwt-update",
              "scripts/package_linux_usb.py", "scripts/test_package_linux_usb.py",
              "scripts/package_xwpkg.py", "scripts/test_xwpkg.py",
              "scripts/test_nand_boundary.py", "scripts/test_linux_network.py",
              "scripts/test_minimal_core.py", "scripts/test_updater_runtime.py",
              "updates/system/opt/xwt/modules/system/bin/xwt-status",
              "README-INSTALL-PT-BR.txt",
          )
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)
          with zipfile.ZipFile(archive) as z:
              infos = z.infolist()
              names = [i.filename for i in infos]
              if len(names) != len(set(names)):
                  raise SystemExit("ZIP tem caminhos duplicados")
              total = 0
              for info in infos:
                  name = info.filename
                  path = PurePosixPath(name)
                  mode = info.external_attr >> 16
                  if path.is_absolute() or ".." in path.parts or "\\" in name or (path.parts and path.parts[0].endswith(":")) or stat.S_ISLNK(mode):
                      raise SystemExit("Caminho inseguro no ZIP: " + name)
                  total += info.file_size
                  if info.file_size > 128 * 1024 * 1024 or total > 512 * 1024 * 1024:
                      raise SystemExit("ZIP excede limites de extração")
                  if info.is_dir():
                      continue
                  target = destination.joinpath(*path.parts)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  with z.open(info) as src, target.open("wb") as dst:
                      shutil.copyfileobj(src, dst)
                  target.chmod(0o755 if mode & 0o111 else 0o644)
          if not all((destination / f).is_file() for f in required):
              missing = [f for f in required if not (destination / f).is_file()]
              raise SystemExit("Fonte incompleta: " + ", ".join(missing))
          if (destination / "VERSION").read_text().strip() != "0.14.0-alpha.2":
              raise SystemExit("Versao da fonte incorreta")
          if (destination / "REVISION.txt").read_text().strip() != "xwt-linux-minimal-core-incremental":
              raise SystemExit("Revisao da fonte incorreta")
          print("Fonte minimal-core validada:", destination)
          PY
          echo "PROJECT_DIR=$RUNNER_TEMP/xwt-project" >> "$GITHUB_ENV"

      - name: Run host package and safety tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR/scripts"
          python3 -m unittest -v test_package_linux_usb test_xwpkg test_nand_boundary test_linux_network test_minimal_core test_updater_runtime

      - name: Fetch pinned Free60 Xenon kernel port
        shell: bash
        run: |
          set -Eeuo pipefail
          FREE60_DIR="$RUNNER_TEMP/free60-xenon"
          git init "$FREE60_DIR"
          git -C "$FREE60_DIR" remote add origin https://github.com/Free60Project/linux-kernel-xbox360.git
          git -C "$FREE60_DIR" fetch --depth=1 origin "$FREE60_COMMIT"
          git -C "$FREE60_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$FREE60_DIR" rev-parse HEAD)" = "$FREE60_COMMIT"
          test -s "$FREE60_DIR/xenon-7.2.defconfig"
          test -s "$FREE60_DIR/patch-7.2-xenon0.30.diff"
          cp "$FREE60_DIR/xenon-7.2.defconfig" "$PROJECT_DIR/linux/xenon-7.2.defconfig"
          python3 - "$PROJECT_DIR/linux/xenon-7.2.defconfig" <<'PY'
          import re, sys
          from pathlib import Path
          path=Path(sys.argv[1]); options={
            "CONFIG_DRM_FBDEV_EMULATION":"y", "CONFIG_FRAMEBUFFER_CONSOLE":"y",
            "CONFIG_BLK_DEV_INITRD":"y", "CONFIG_RD_GZIP":"y",
            "CONFIG_VT":"y", "CONFIG_VT_CONSOLE":"y", "CONFIG_UNIX98_PTYS":"y",
            "CONFIG_TMPFS":"y", "CONFIG_FB":"y", "CONFIG_FAT_FS":"y",
            "CONFIG_VFAT_FS":"y", "CONFIG_USB_STORAGE":"y",
            "CONFIG_USB_EHCI_HCD":"y", "CONFIG_USB_OHCI_HCD":"y",
            "CONFIG_SCSI":"y", "CONFIG_BLK_DEV_SD":"y", "CONFIG_INPUT":"y",
            "CONFIG_INPUT_EVDEV":"y", "CONFIG_INPUT_JOYSTICK":"y",
            "CONFIG_DEVTMPFS":"y", "CONFIG_DEVTMPFS_MOUNT":"y",
            "CONFIG_PROC_FS":"y", "CONFIG_SYSFS":"y", "CONFIG_UEVENT_HELPER":"y",
            "CONFIG_INPUT_UINPUT":"m", "CONFIG_INPUT_JOYDEV":"m",
            "CONFIG_JOYSTICK_XPAD":"m", "CONFIG_USB_HID":"y", "CONFIG_HID_GENERIC":"y",
          }
          pattern=re.compile(r"^(?:# )?(CONFIG_[A-Z0-9_]+)(?:=.*| is not set)$")
          lines=[line for line in path.read_text().splitlines() if not (pattern.match(line) and pattern.match(line).group(1) in options)]
          lines.extend(f"{key}={value}" for key,value in options.items())
          path.write_text("\n".join(lines)+"\n")
          PY
          for required in '^CONFIG_PPC_XENON=y$' '^CONFIG_PPC64=y$' '^CONFIG_BLK_DEV_INITRD=y$' '^CONFIG_RD_GZIP=y$' '^CONFIG_DRM_XENOS=y$' '^CONFIG_SIS190=y$' '^CONFIG_USB_STORAGE=y$' '^CONFIG_JOYSTICK_XPAD=m$' '^CONFIG_INPUT_JOYDEV=m$' '^CONFIG_INPUT_UINPUT=m$'; do
            grep -q "$required" "$PROJECT_DIR/linux/xenon-7.2.defconfig" || { echo "Kernel option missing: $required" >&2; exit 1; }
          done
          git -C "$FREE60_DIR" rev-parse HEAD > "$RUNNER_TEMP/free60-commit.txt"

      - name: Fetch pinned Buildroot
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILDROOT_DIR="$RUNNER_TEMP/buildroot"
          git init "$BUILDROOT_DIR"
          git -C "$BUILDROOT_DIR" remote add origin https://github.com/buildroot/buildroot.git
          git -C "$BUILDROOT_DIR" fetch --depth=1 origin "$BUILDROOT_COMMIT"
          git -C "$BUILDROOT_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$BUILDROOT_DIR" rev-parse HEAD)" = "$BUILDROOT_COMMIT"
          echo "BUILDROOT_DIR=$BUILDROOT_DIR" >> "$GITHUB_ENV"
          git -C "$BUILDROOT_DIR" rev-parse HEAD > "$RUNNER_TEMP/buildroot-commit.txt"

      - name: Configure Buildroot for the small core
        shell: bash
        run: |
          set -Eeuo pipefail
          OUTPUT="$RUNNER_TEMP/buildroot-output"
          mkdir -p "$OUTPUT"
          cp "$PROJECT_DIR/linux/buildroot.config" "$OUTPUT/.config"
          sed -i \
            -e "s|@PROJECT_ROOT@|$PROJECT_DIR|g" \
            -e "s|@FREE60_ROOT@|$RUNNER_TEMP/free60-xenon|g" \
            -e "s|@BUILDROOT_OUTPUT@|$OUTPUT|g" "$OUTPUT/.config"
          python3 - "$OUTPUT/.config" "$HOME" <<'PY'
          import sys
          from pathlib import Path
          path=Path(sys.argv[1]); home=sys.argv[2]
          lines=path.read_text().splitlines()
          values={"BR2_KERNEL_HEADERS_7_2":"y", "BR2_TOOLCHAIN_BUILDROOT":"y",
                  "BR2_TOOLCHAIN_BUILDROOT_GLIBC":"y", "BR2_PACKAGE_BUSYBOX_SHOW_OTHERS":"y",
                  "BR2_CCACHE":"y", "BR2_CCACHE_DIR":f'"{home}/.cache/xwt-buildroot-ccache"',
                  "BR2_LINUX_KERNEL_INSTALL_TARGET":"y"}
          for symbol,value in values.items():
              lines=[line for line in lines if not line.startswith(symbol+"=") and line != f"# {symbol} is not set"]
              if value == "n": lines.append(f"# {symbol} is not set")
              else: lines.append(f"{symbol}={value}")
          path.write_text("\n".join(lines)+"\n")
          PY
          make -C "$BUILDROOT_DIR" O="$OUTPUT" olddefconfig 2>&1 | tee "$RUNNER_TEMP/buildroot-configure.log"
          CONFIG="$OUTPUT/.config"
          require() { grep -Fqx "$1" "$CONFIG" || { echo "Buildroot config missing: $1" >&2; exit 1; }; }
          require 'BR2_powerpc64=y'
          require 'BR2_powerpc_970=y'
          require 'BR2_INIT_BUSYBOX=y'
          require 'BR2_KERNEL_HEADERS_7_2=y'
          require 'BR2_TOOLCHAIN_BUILDROOT=y'
          require 'BR2_TOOLCHAIN_BUILDROOT_GLIBC=y'
          require 'BR2_TOOLCHAIN_USES_GLIBC=y'
          require 'BR2_PACKAGE_BUSYBOX=y'
          require 'BR2_PACKAGE_KMOD=y'
          require 'BR2_PACKAGE_KMOD_TOOLS=y'
          require 'BR2_PACKAGE_IPROUTE2=y'
          require 'BR2_PACKAGE_LIBCURL=y'
          require 'BR2_PACKAGE_LIBCURL_CURL=y'
          require 'BR2_PACKAGE_OPENSSL=y'
          require 'BR2_PACKAGE_CA_CERTIFICATES=y'
          require 'BR2_LINUX_KERNEL=y'
          require 'BR2_LINUX_KERNEL_INSTALL_TARGET=y'
          require 'BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="7.2"'
          require 'BR2_LINUX_KERNEL_IMAGE_TARGET_NAME="zImage.xenon"'
          require 'BR2_TARGET_ROOTFS_CPIO=y'
          require 'BR2_TARGET_ROOTFS_CPIO_GZIP=y'
          if grep -Eq '^BR2_PACKAGE_(NETSURF|SDL|PYTHON3|ALSA|WPA_SUPPLICANT|IW|LINUX_FIRMWARE)=' "$CONFIG"; then
            echo 'A compilacao-base incluiu um modulo opcional que deve ser adiado.' >&2
            grep -E '^BR2_PACKAGE_(NETSURF|SDL|PYTHON3|ALSA|WPA_SUPPLICANT|IW|LINUX_FIRMWARE)=' "$CONFIG" >&2
            exit 1
          fi
          echo "Buildroot configurado: core minimo, sem desktop/browser/audio/Wi-Fi."

      - name: Prevent the Xenon kernel image from entering the PPC64 rootfs
        shell: bash
        run: |
          set -Eeuo pipefail
          MAKEFILE="$BUILDROOT_DIR/linux/linux.mk"
          python3 - "$MAKEFILE" <<'PY'
          import sys
          from pathlib import Path
          p=Path(sys.argv[1]); s=p.read_text()
          old="\t$(LINUX_INSTALL_KERNEL_IMAGE_TO_TARGET)\n"
          if s.count(old)!=1: raise SystemExit("Unexpected Buildroot kernel-install rule; stopping safely")
          p.write_text(s.replace(old,"\t# XWT: keep Xenon boot image in images/, outside the PPC64 rootfs.\n",1))
          PY

      - name: Build kernel and minimal root filesystem
        shell: bash
        run: |
          set -Eeuo pipefail
          JOBS="$(nproc)"; [ "$JOBS" -le 4 ] || JOBS=4
          echo "Building minimal core with $JOBS workers"
          ccache --zero-stats || true
          make -C "$BUILDROOT_DIR" O="$RUNNER_TEMP/buildroot-output" -j"$JOBS" 2>&1 | tee "$RUNNER_TEMP/buildroot-build.log"
          OUTPUT="$RUNNER_TEMP/buildroot-output"; TARGET="$OUTPUT/target"
          test -s "$OUTPUT/images/zImage.xenon"
          test -s "$OUTPUT/images/rootfs.cpio.gz"
          gzip -t "$OUTPUT/images/rootfs.cpio.gz"
          test -x "$TARGET/usr/sbin/xwt-system-menu"
          test -x "$TARGET/usr/sbin/xwt-system-menu-text"
          test -x "$TARGET/usr/sbin/xwt-update"
          test -x "$TARGET/usr/sbin/xwt-network"
          test -x "$TARGET/usr/bin/curl"
          test ! -e "$TARGET/boot/zImage.xenon"
          KERNEL_CONFIG="$(find "$OUTPUT/build" -maxdepth 4 -type f -path '*/linux-*/.config' -print -quit)"
          test -s "$KERNEL_CONFIG"
          for required in '^CONFIG_PPC_XENON=y$' '^CONFIG_PPC64=y$' '^CONFIG_BLK_DEV_INITRD=y$' '^CONFIG_RD_GZIP=y$' '^CONFIG_DRM_XENOS=y$' '^CONFIG_DRM_FBDEV_EMULATION=y$' '^CONFIG_FRAMEBUFFER_CONSOLE=y$' '^CONFIG_SIS190=y$' '^CONFIG_USB_STORAGE=y$' '^CONFIG_JOYSTICK_XPAD=m$' '^CONFIG_INPUT_JOYDEV=m$' '^CONFIG_INPUT_UINPUT=m$'; do
            grep -q "$required" "$KERNEL_CONFIG" || { echo "Kernel config missing: $required" >&2; exit 1; }
          done
          for module in xpad joydev uinput; do
            find "$TARGET/lib/modules" -type f \( -name "$module.ko" -o -name "$module.ko.xz" -o -name "$module.ko.zst" \) -print -quit | grep -q . || { echo "Missing module: $module" >&2; exit 1; }
          done
          python3 - "$OUTPUT/images/rootfs.cpio.gz" <<'PY'
          import gzip,sys
          from pathlib import PurePosixPath
          def align(n): return (n+3)&~3
          names=set(); executable=set()
          with gzip.open(sys.argv[1],'rb') as f:
            while True:
              h=f.read(110)
              if not h: break
              if len(h)!=110 or h[:6] not in (b'070701',b'070702'): raise SystemExit('Invalid CPIO newc header')
              v=[int(h[i:i+8],16) for i in range(6,110,8)]
              mode,size,nsize=v[1],v[6],v[11]
              raw=f.read(nsize)
              if len(raw)!=nsize or not raw.endswith(b'\0'): raise SystemExit('Invalid CPIO name')
              name=raw[:-1].decode('utf-8','replace').lstrip('./')
              if name=='TRAILER!!!': break
              path=PurePosixPath(name)
              if path.is_absolute() or '..' in path.parts: raise SystemExit('Unsafe CPIO path: '+name)
              f.seek(align(110+nsize)-(110+nsize),1)
              names.add(name)
              if mode & 0o111: executable.add(name)
              f.seek(size,1); f.seek(align(size)-size,1)
          required={'etc/inittab','sbin/mdev','etc/init.d/S15gamepad','etc/init.d/S30storage','etc/init.d/S40network','etc/init.d/S46time','usr/sbin/xwt-system-menu','usr/sbin/xwt-system-menu-text','usr/sbin/xwt-update','usr/sbin/xwt-network','usr/bin/curl'}
          missing=required-names
          if missing: raise SystemExit('Missing core files in initramfs: '+', '.join(sorted(missing)))
          required_exec={'etc/init.d/S15gamepad','etc/init.d/S30storage','etc/init.d/S40network','etc/init.d/S46time','usr/sbin/xwt-system-menu','usr/sbin/xwt-system-menu-text','usr/sbin/xwt-update','usr/sbin/xwt-network'}
          if not required_exec <= executable: raise SystemExit('Missing executable permissions: '+', '.join(sorted(required_exec-executable)))
          print(f'Core initramfs checked: {len(names)} entries')
          PY
          ccache --show-stats || true

      - name: Save cross-toolchain cache for future native modules
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          CACHE_ROOT="$HOME/.cache/xwt-cross-toolchain"
          rm -rf "$CACHE_ROOT"; mkdir -p "$CACHE_ROOT"
          cp -a "$RUNNER_TEMP/buildroot-output/host" "$CACHE_ROOT/host"
          mkdir -p "$CACHE_ROOT/staging"
          cp -a "$RUNNER_TEMP/buildroot-output/staging/." "$CACHE_ROOT/staging/"
          du -sh "$CACHE_ROOT"

      - name: Persist cross-toolchain cache
        if: success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/xwt-cross-toolchain
          key: ${{ runner.os }}-xwt-cross-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-minimal-core-v1

      - name: Save Buildroot caches
        if: ${{ always() && steps.build-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/xwt-buildroot-dl
            ~/.cache/xwt-buildroot-ccache
          key: ${{ runner.os }}-xwt-core-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-cache-v1

      - name: Download pinned XellLaunch2 retail launcher
        shell: bash
        run: |
          set -Eeuo pipefail
          API="https://api.github.com/repos/mitchellwaite/XellLaunch2/releases/tags/${XELL_LAUNCH2_TAG}"
          curl --fail --location --silent --show-error -H 'Accept: application/vnd.github+json' "$API" -o "$RUNNER_TEMP/xell-release.json"
          python3 - "$RUNNER_TEMP/xell-release.json" "$RUNNER_TEMP/xell-url.txt" <<'PY'
          import json,sys
          from pathlib import Path
          release=json.loads(Path(sys.argv[1]).read_text())
          if release.get('tag_name')!='v2.2.0': raise SystemExit('Unexpected XellLaunch2 release tag')
          candidates=[a for a in release.get('assets',[]) if a.get('name','').lower().endswith('.xex') and 'retail' in a.get('name','').lower()]
          if len(candidates)!=1: raise SystemExit('Could not identify exactly one retail XEX')
          Path(sys.argv[2]).write_text(candidates[0]['browser_download_url']+'\n')
          print('Selected launcher:',candidates[0]['name'])
          PY
          curl --fail --location --silent --show-error "$(cat "$RUNNER_TEMP/xell-url.txt")" -o "$RUNNER_TEMP/default.xex"
          curl --fail --location --silent --show-error "https://raw.githubusercontent.com/mitchellwaite/XellLaunch2/${XELL_LAUNCH2_COMMIT}/LICENSE" -o "$RUNNER_TEMP/XellLaunch2-LICENSE.txt"
          test "$(head -c 4 "$RUNNER_TEMP/default.xex")" = XEX2
          grep -q '^MIT License' "$RUNNER_TEMP/XellLaunch2-LICENSE.txt"

      - name: Package and verify USB boot bundle
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$PROJECT_DIR/scripts/package_linux_usb.py" \
            --launcher "$RUNNER_TEMP/default.xex" \
            --launcher-license "$RUNNER_TEMP/XellLaunch2-LICENSE.txt" \
            --kernel "$RUNNER_TEMP/buildroot-output/images/zImage.xenon" \
            --initrd "$RUNNER_TEMP/buildroot-output/images/rootfs.cpio.gz" \
            --project "$PROJECT_DIR" \
            --output "$RUNNER_TEMP/XWT-Linux-${XWT_VERSION}-USB.zip"
          sha256sum "$RUNNER_TEMP/XWT-Linux-${XWT_VERSION}-USB.zip" > "$RUNNER_TEMP/USB-SHA256.txt"
          cp XWT-Linux-source.zip "$RUNNER_TEMP/XWT-Linux-${XWT_VERSION}-source.zip"
          SYSTEM_VERSION="${XWT_VERSION}+${GITHUB_SHA:0:12}"
          python3 "$PROJECT_DIR/scripts/package_xwpkg.py" \
            --payload "$PROJECT_DIR/updates/system" --component system \
            --version "$SYSTEM_VERSION" --output "$RUNNER_TEMP/system.xwpkg"
          sha256sum "$RUNNER_TEMP/system.xwpkg" | awk '{print $1 "  system.xwpkg"}' > "$RUNNER_TEMP/system-SHA256.txt"
          python3 - "$RUNNER_TEMP/latest.tsv" "$RUNNER_TEMP/latest.json" "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$XWT_VERSION" "$XWT_REVISION" "$SYSTEM_VERSION" "$RUNNER_TEMP/system.xwpkg" <<'PY'
          import hashlib,json,sys
          from pathlib import Path
          manifest,metadata,repo,commit,version,revision,system_version,package=sys.argv[1:]
          core_tag=f"xwt-v{version}-core-{commit[:12]}"
          core_url=f"https://github.com/{repo}/releases/download/{core_tag}/XWT-Linux-{version}-USB.zip"
          digest=hashlib.sha256(Path(package).read_bytes()).hexdigest()
          module_url=f"https://github.com/{repo}/releases/download/xwt-linux-dev/system.xwpkg"
          Path(manifest).write_text(f"XWT-UPDATES-V1\nsystem|{system_version}|{digest}|{module_url}\n")
          data={"schema":1,"product":"XWT Linux","version":version,"revision":revision,
                "release_tag":"xwt-linux-dev","base":{"usb_package":core_url},
                "components":{"system":{"version":system_version,"sha256":digest,"package":module_url}},
                "boot":{"chain":"default.xex -> XellLaunch2 -> XeLL Reloaded -> Xenon ELF + initramfs",
                "physical_console_tested":False,"nand_write":False}}
          Path(metadata).write_text(json.dumps(data,indent=2)+'\n')
          PY
          printf 'XWT Linux %s\nMinimal core build\nCommit: %s\nBuildroot: %s\nFree60: %s\n' "$XWT_VERSION" "$GITHUB_SHA" "$BUILDROOT_COMMIT" "$FREE60_COMMIT" > "$RUNNER_TEMP/BUILD-REPORT.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xwt-linux-core-${{ github.sha }}
          path: |
            ${{ runner.temp }}/XWT-Linux-*-USB.zip
            ${{ runner.temp }}/XWT-Linux-*-source.zip
            ${{ runner.temp }}/latest.json
            ${{ runner.temp }}/latest.tsv
            ${{ runner.temp }}/system.xwpkg
            ${{ runner.temp }}/system-SHA256.txt
            ${{ runner.temp }}/USB-SHA256.txt
            ${{ runner.temp }}/BUILD-REPORT.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xwt-linux-core-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/buildroot-output/.config
            ${{ runner.temp }}/buildroot-configure.log
            ${{ runner.temp }}/buildroot-build.log
            ${{ runner.temp }}/free60-commit.txt
            ${{ runner.temp }}/buildroot-commit.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Build summary
        if: always()
        run: |
          {
            echo '## XWT Linux 0.14.0-alpha.2 — Minimal Core'
            echo 'First build compiles the Xenon kernel and minimum userspace once.'
            echo 'Desktop, browser, audio, Wi-Fi and graphics enhancements are deferred to small .xwpkg modules.'
            echo 'Boot: default.xex -> XellLaunch2 -> XeLL Reloaded -> Xenon ELF + initramfs.'
            echo 'NAND writes: none. Physical Xbox 360 test: not yet performed.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-core:
    name: Publish tested core package
    needs: build-core
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download build assets
        uses: actions/download-artifact@v4
        with:
          name: xwt-linux-core-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets

      - name: Create core release and update channel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/release-assets"
          USB_FILE="$(find . -maxdepth 1 -name '*-USB.zip' -print -quit)"
          SRC_FILE="$(find . -maxdepth 1 -name '*-source.zip' -print -quit)"
          SYSTEM_FILE="$(find . -maxdepth 1 -name 'system.xwpkg' -print -quit)"
          test -n "$USB_FILE" && test -n "$SRC_FILE" && test -n "$SYSTEM_FILE"
          TAG="xwt-v${XWT_VERSION}-core-${GITHUB_SHA:0:12}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<EOF_NOTES
          # XWT Linux ${XWT_VERSION} — Minimal Core

          Esta é a primeira base mínima: kernel Xenon, console, USB/FAT32, Ethernet/DHCP, TLS/curl e atualizador.

          Desktop gráfico, navegador, áudio, Wi-Fi e melhorias adicionais serão distribuídos depois como módulos incrementais `.xwpkg`, sem recompilar o kernel.

          Boot: `default.xex` -> XellLaunch2 -> XeLL Reloaded -> kernel ELF + initramfs.

          Ainda requer teste físico no Xbox 360. O pacote não grava NAND, KV, SMC ou firmware.
          EOF_NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$USB_FILE" "$SRC_FILE" "$SYSTEM_FILE" latest.json latest.tsv system-SHA256.txt USB-SHA256.txt BUILD-REPORT.txt --clobber
          else
            gh release create "$TAG" "$USB_FILE" "$SRC_FILE" "$SYSTEM_FILE" latest.json latest.tsv system-SHA256.txt USB-SHA256.txt BUILD-REPORT.txt \
              --target "$GITHUB_SHA" --title "XWT Linux ${XWT_VERSION} — Minimal Core" \
              --notes-file "$NOTES" --prerelease
          fi
          STABLE_TAG=xwt-linux-dev
          mkdir -p "$RUNNER_TEMP/stable"
          STABLE_EXISTS=false
          if gh release view "$STABLE_TAG" >/dev/null 2>&1; then
            STABLE_EXISTS=true
            gh release download "$STABLE_TAG" --pattern latest.tsv --dir "$RUNNER_TEMP/stable" || true
          fi
          python3 - latest.tsv "$RUNNER_TEMP/stable/latest.tsv" <<'PY'
          import sys
          from pathlib import Path
          incoming=Path(sys.argv[1]).read_text().splitlines()
          old_path=Path(sys.argv[2])
          old=old_path.read_text().splitlines() if old_path.is_file() else ['XWT-UPDATES-V1']
          if not incoming or incoming[0]!='XWT-UPDATES-V1': raise SystemExit('Manifesto de modulo invalido')
          new_rows=[line for line in incoming[1:] if line]
          if not new_rows: raise SystemExit('Manifesto nao tem modulo inicial')
          components={line.split('|',1)[0] for line in new_rows}
          rows=[line for line in old[1:] if line and line.split('|',1)[0] not in components]
          Path(sys.argv[2]).write_text('XWT-UPDATES-V1\n'+'\n'.join(rows+new_rows)+'\n')
          PY
          if [ "$STABLE_EXISTS" = true ]; then
            gh release upload "$STABLE_TAG" "$RUNNER_TEMP/stable/latest.tsv" system.xwpkg system-SHA256.txt latest.json --clobber
          else
            gh release create "$STABLE_TAG" "$RUNNER_TEMP/stable/latest.tsv" system.xwpkg system-SHA256.txt latest.json \
              --target "$GITHUB_SHA" --title 'XWT Linux — Incremental updates' \
              --notes 'Canal de atualizações pequenas .xwpkg. O core é publicado separadamente.' --prerelease
          fi
          echo "Core release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Update channel: https://github.com/$GITHUB_REPOSITORY/releases/tag/$STABLE_TAG" >> "$GITHUB_STEP_SUMMARY"
