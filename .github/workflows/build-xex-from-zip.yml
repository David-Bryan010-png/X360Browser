name: X360Browser 3.5.0 Native Web Media — validation (XEX opt-in)

on:
  workflow_dispatch:
    inputs:
      source_archive:
        description: "ZIP do código-fonte no repositório (raiz ou subpasta)"
        required: false
        default: "X360Browser-3.5.0-native-web-media-source.zip"
        type: string
      build_xex:
        description: "Compilar o XEX PowerPC/xSDK (desativado por padrão)"
        required: true
        default: false
        type: boolean
  push:
    branches: [main, principal]
    paths:
      - "CMakeLists.txt"
      - "include/**"
      - "src/**"
      - "app/**"
      - "engine/**"
      - "platform/xbox360/**"
      - "tools/**"
      - "tests/**"
      - "examples/**"
      - "docs/**"
      - "README.md"
      - "VERSION"
      - "CHANGELOG.md"
      - "TEST-RESULTS.txt"
      - "THIRD_PARTY_NOTICES.md"
      - "X360Browser-video-config.example.txt"
      - ".github/workflows/build-xex-from-zip.yml"
      - "*.zip"
      - "**/*.zip"

permissions:
  contents: read

concurrency:
  group: x360browser-350-native-web-media-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Host tests, safety checks, and package validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install host validation dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libcurl4-openssl-dev \
            python3 unzip zip git curl make

      - name: Resolve project source tree or extract the committed ZIP
        id: resolve-source
        shell: bash
        env:
          SOURCE_ARCHIVE_INPUT: ${{ github.event.inputs.source_archive || 'X360Browser-3.5.0-native-web-media-source.zip' }}
        run: |
          set -Eeuo pipefail
          LOG="$RUNNER_TEMP/x360browser-validation.log"
          touch "$LOG"
          log() { printf '%s\n' "$*" | tee -a "$LOG"; }

          locate_root() {
            local marker candidate version

            while IFS= read -r marker; do
              candidate="${marker%/platform/xbox360/xsdk/main.c}"

              [[ -s "$candidate/CMakeLists.txt" &&
                 -s "$candidate/VERSION" &&
                 -s "$candidate/tools/build_xbox_shell.sh" ]] || continue

              version="$(tr -d '\r\n' < "$candidate/VERSION")"
              [[ "$version" == "3.5.0-native-web-media" ]] || continue

              printf '%s\n' "$candidate"
              return 0
            done < <(
              find "$1" -type f \
                -path '*/platform/xbox360/xsdk/main.c' \
                -not -path '*/.git/*' \
                -not -path '*/build/*' \
                -not -path '*/build-xbox360/*' \
                -print 2>/dev/null | sort
            )

            return 1
          }

          PROJECT_DIR="$(locate_root "$GITHUB_WORKSPACE" || true)"

          if [[ -z "$PROJECT_DIR" ]]; then
            ARCHIVE=""

            if [[ -n "${SOURCE_ARCHIVE_INPUT:-}" &&
                  -f "$GITHUB_WORKSPACE/$SOURCE_ARCHIVE_INPUT" ]]; then
              ARCHIVE="$GITHUB_WORKSPACE/$SOURCE_ARCHIVE_INPUT"
            else
              ARCHIVE="$(
                find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
                  \( -iname '*3.5.0*native*web*media*.zip' \
                     -o -iname '*x360browser*source*.zip' \) \
                  -not -path '*/.git/*' \
                  -print -quit || true
              )"
            fi

            if [[ -n "$ARCHIVE" ]]; then
              log "Source root not in checkout; validating and extracting: $ARCHIVE"

              unzip -t "$ARCHIVE" >> "$LOG" 2>&1

              EXTRACT_DIR="$RUNNER_TEMP/x360browser-source"
              rm -rf "$EXTRACT_DIR"
              mkdir -p "$EXTRACT_DIR"

              unzip -q "$ARCHIVE" -d "$EXTRACT_DIR"

              PROJECT_DIR="$(locate_root "$EXTRACT_DIR" || true)"
            fi
          fi

          if [[ -z "$PROJECT_DIR" ]]; then
            log "::error::Não encontrei a fonte completa do X360Browser 3.5.0. O repositório pode conter apenas o YAML ou um ZIP de outra versão."
            log "Envie X360Browser-3.5.0-native-web-media-source.zip ao repositório ou faça commit do conteúdo extraído. A compilação XEX não é executada por padrão."

            find "$GITHUB_WORKSPACE" -maxdepth 5 -type f \
              -not -path '*/.git/*' \
              -print | sort | head -200 | tee -a "$LOG" || true

            exit 2
          fi

          for required in \
            VERSION \
            CMakeLists.txt \
            README.md \
            CHANGELOG.md \
            tests/run_host_tests.py \
            tests/validate_project_integrity.py \
            tests/web_engine_fixture_server.py \
            tests/test_xenonweb.c \
            tests/test_xenonweb_layout.c \
            tests/test_xenonscript.c \
            docs/MEDIA-PLAYBACK.md \
            docs/COMPATIBILITY-3.5.0-native-web-media.md \
            docs/ENGINE-GAP-AUDIT-3.5.0.md \
            docs/XENONMEDIA-ENGINE.md \
            docs/50-LACUNAS-PRIORITARIAS-pt-BR.md \
            tests/jpeg_baseline_fixture.h \
            engine/xenonmedia/xm_media.c \
            engine/xenonmedia/xm_media.h \
            engine/xenonmedia/xm_playback.c \
            engine/xenonmedia/xm_playback.h \
            X360Browser-video-config.example.txt \
            examples/media-playback.html \
            engine/xenonweb/xw_dom.c \
            engine/xenonweb/xw_css.c \
            engine/xenonweb/xw_script.c \
            engine/xenonweb/xw_layout.c \
            platform/xbox360/xsdk/main.c \
            platform/xbox360/xsdk/web_engine.c \
            platform/xbox360/xsdk/web_engine_dispatch.c \
            tools/build_xbox_shell.sh; do

            if [[ ! -s "$PROJECT_DIR/$required" ]]; then
              log "::error::Fonte incompleto: arquivo obrigatório ausente: $required"
              exit 2
            fi
          done

          [[ "$(tr -d '\r\n' < "$PROJECT_DIR/VERSION")" == "3.5.0-native-web-media" ]] || {
            log "::error::A versão da fonte não corresponde a 3.5.0-native-web-media."
            exit 2
          }

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          log "Resolved source root: $PROJECT_DIR"
          log "Source version: $(cat "$PROJECT_DIR/VERSION")"

      - name: Validate package integrity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          python3 tests/validate_project_integrity.py \
            2>&1 | tee -a "$RUNNER_TEMP/x360browser-validation.log"

      - name: Run XenonWeb, XenonScript, network, and visual host tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          python3 tests/run_host_tests.py \
            2>&1 | tee -a "$RUNNER_TEMP/x360browser-validation.log"

      - name: Build and test portable C/C++ cores and media decoders (host only)
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          cmake -S . -B "$RUNNER_TEMP/x360browser-cmake" \
            -DX360BROWSER_BUILD_TESTS=ON \
            -DX360BROWSER_BUILD_DEMO=ON \
            -DCMAKE_BUILD_TYPE=Release \
            2>&1 | tee -a "$RUNNER_TEMP/x360browser-validation.log"

          cmake --build "$RUNNER_TEMP/x360browser-cmake" \
            --parallel 2 \
            2>&1 | tee -a "$RUNNER_TEMP/x360browser-validation.log"

          ctest --test-dir "$RUNNER_TEMP/x360browser-cmake" \
            --output-on-failure \
            2>&1 | tee -a "$RUNNER_TEMP/x360browser-validation.log"

      - name: Syntax-check Xbox UI, XenonWeb and layout adapter (no XEX build)
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          cc -std=c17 \
            -Wall -Wextra -Wshadow -Wconversion -Werror \
            -fsyntax-only \
            -I tests/mock_xsdk \
            -I platform/xbox360/xsdk \
            -I engine/xenonweb \
            platform/xbox360/xsdk/main.c \
            platform/xbox360/xsdk/visual_renderer.c \
            platform/xbox360/xsdk/visual_layout.c \
            engine/xenonweb/xw_dom.c \
            engine/xenonweb/xw_css.c \
            engine/xenonweb/xw_script.c \
            engine/xenonweb/xw_layout.c \
            engine/xenonmedia/xm_media.c \
            engine/xenonmedia/xm_playback.c \
            2>&1 | tee -a "$RUNNER_TEMP/x360browser-validation.log"

      - name: Strict syntax-check first-party media decoders (no external image library)
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          cc -std=c17 \
            -Wall -Wextra -Wshadow -Wconversion -Werror \
            -fsyntax-only \
            -I engine/xenonmedia \
            engine/xenonmedia/xm_media.c \
            engine/xenonmedia/xm_playback.c \
            tests/test_xenonmedia.c \
            2>&1 | tee -a "$RUNNER_TEMP/x360browser-validation.log"

          echo "PASS: first-party XenonMedia syntax; third-party image decoder is absent" \
            | tee -a "$RUNNER_TEMP/x360browser-validation.log"

      - name: Package validated source archive
        shell: bash
        run: |
          set -Eeuo pipefail

          DIST="$RUNNER_TEMP/x360browser-dist"
          mkdir -p "$DIST"

          (
            cd "$PROJECT_DIR"
            zip -qr "$DIST/X360Browser-3.5.0-native-web-media-source.zip" . \
              -x '.git/*' \
                 'build/*' \
                 'build-xbox360/*' \
                 '*.zip' \
                 'tests/__pycache__/*'
          )

          unzip -t "$DIST/X360Browser-3.5.0-native-web-media-source.zip" \
            2>&1 | tee -a "$RUNNER_TEMP/x360browser-validation.log"

          sha256sum "$DIST/X360Browser-3.5.0-native-web-media-source.zip" \
            | tee -a "$RUNNER_TEMP/x360browser-validation.log"

      - name: Optional Xbox 360 PowerPC/xSDK XEX cross-build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_xex }}
        shell: bash
        env:
          JOBS: "2"
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          bash tools/build_xbox_shell.sh \
            2>&1 | tee -a "$RUNNER_TEMP/x360browser-validation.log"

          test -s "$PROJECT_DIR/build-xbox360/X360Browser.xex"
          test -s "$PROJECT_DIR/build-xbox360/cacert.pem"

      - name: Package XEX (only when the optional build is enabled)
        if: ${{ success() && github.event_name == 'workflow_dispatch' && inputs.build_xex }}
        shell: bash
        run: |
          set -Eeuo pipefail

          DIST="$RUNNER_TEMP/x360browser-dist"
          STAGE="$RUNNER_TEMP/x360browser-xex-stage"

          mkdir -p "$STAGE"

          cp "$PROJECT_DIR/build-xbox360/X360Browser.xex" "$STAGE/"
          cp "$PROJECT_DIR/build-xbox360/cacert.pem" "$STAGE/"

          cp "$PROJECT_DIR/build-xbox360/README.txt" "$STAGE/" 2>/dev/null || true

          for license in "$PROJECT_DIR"/build-xbox360/LICENSE-*.txt; do
            [[ -s "$license" ]] && cp "$license" "$STAGE/"
          done

          (
            cd "$STAGE"
            zip -9 -X -q "$DIST/X360Browser-3.5.0-native-web-media-xbox.zip" ./*
          )

          sha256sum \
            "$STAGE/X360Browser.xex" \
            "$DIST/X360Browser-3.5.0-native-web-media-xbox.zip" \
            | tee -a "$RUNNER_TEMP/x360browser-validation.log"

      - name: Upload validated source and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: X360Browser-3.5.0-native-web-media-validation
          path: |
            ${{ runner.temp }}/x360browser-dist/*.zip
            ${{ runner.temp }}/x360browser-validation.log
            ${{ runner.temp }}/x360browser-source/**
          if-no-files-found: warn
          retention-days: 14
