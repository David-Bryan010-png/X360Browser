      - name: Configure Buildroot for Xenon Linux desktop and browser
        shell: bash
        run: |
          set -Eeuo pipefail

          BUILDROOT="$RUNNER_TEMP/buildroot"
          OUTPUT="$RUNNER_TEMP/buildroot-output"
          CONFIG="$OUTPUT/.config"

          echo "Preparando configuração do Xbox 360..."

          mkdir -p "$OUTPUT"

          cp "$PROJECT_DIR/linux/buildroot.config" "$CONFIG"

          sed -i \
            -e "s|@PROJECT_ROOT@|$PROJECT_DIR|g" \
            -e "s|@FREE60_ROOT@|$RUNNER_TEMP/free60-xenon|g" \
            -e "s|@BUILDROOT_OUTPUT@|$OUTPUT|g" \
            "$CONFIG"

          echo "Executando olddefconfig..."

          make -C "$BUILDROOT" O="$OUTPUT" olddefconfig

          echo "Verificando arquitetura PowerPC..."

          require_config() {
            local expected="$1"

            if ! grep -Fqx -- "$expected" "$CONFIG"; then
              echo "::error::Configuração ausente: $expected"
              return 1
            fi
          }

          require_config 'BR2_powerpc64=y'
          require_config 'BR2_powerpc_970=y'

          echo "Verificando navegador NetSurf..."

          require_config 'BR2_PACKAGE_NETSURF=y'
          require_config 'BR2_PACKAGE_NETSURF_SDL=y'

          echo "Verificando rede e segurança..."

          require_config 'BR2_PACKAGE_LIBCURL=y'
          require_config 'BR2_PACKAGE_LIBCURL_OPENSSL=y'
          require_config 'BR2_PACKAGE_OPENSSL=y'
          require_config 'BR2_PACKAGE_CA_CERTIFICATES=y'

          echo "Verificando Wi-Fi..."

          require_config 'BR2_PACKAGE_WPA_SUPPLICANT=y'
          require_config 'BR2_PACKAGE_WIRELESS_REGDB=y'

          echo "Verificando interface gráfica..."

          require_config 'BR2_PACKAGE_SDL_TTF=y'
          require_config 'BR2_PACKAGE_DEJAVU=y'
          require_config 'BR2_PACKAGE_DEJAVU_SANS=y'

          echo "Verificando áudio..."

          require_config 'BR2_PACKAGE_ALSA_UTILS=y'

          echo "Verificando kernel e imagem..."

          require_config 'BR2_LINUX_KERNEL_IMAGE_TARGET_NAME="zImage.xenon"'
          require_config 'BR2_TARGET_ROOTFS_CPIO_GZIP=y'

          if ! grep -q '^BR2_ROOTFS_POST_BUILD_SCRIPT_ARGS=' "$CONFIG"; then
            echo "::error::Argumentos do script post-build não encontrados."
            exit 1
          fi

          echo "Verificando configuração final..."

          make -C "$BUILDROOT" O="$OUTPUT" olddefconfig

          echo "========================================"
          echo "CONFIGURAÇÃO DO X360 WEB TOTAL APROVADA"
          echo "Arquitetura: PowerPC 970 64-bit"
          echo "Sistema: Linux Xenon"
          echo "Navegador: NetSurf SDL"
          echo "Rede: libcurl + OpenSSL"
          echo "Interface: SDL + SDL_ttf"
          echo "========================================"