name: X360 Web Total - Xenon Linux Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# The build job is read-only. Only the separate release job receives write access.
permissions:
  contents: read

concurrency:
  group: xwt-linux-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILDROOT_COMMIT: 15b0457158bbe24264ab241cbe87c52b4d659f4e
  FREE60_COMMIT: 3c3e76fb1ffa3bcce3a50a6af6b847a2da25139f
  XWT_VERSION: 0.13.0
  XWT_REVISION: linux-xenon-desktop-shell
  CCACHE_DIR: /home/runner/.cache/xwt-buildroot-ccache
  CCACHE_MAXSIZE: 1G
  BR2_DL_DIR: /home/runner/.cache/xwt-buildroot-dl

jobs:
  build-linux:
    name: Validate + build Xenon kernel + rootfs + USB package
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Free runner disk space
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "=== DISK BEFORE CLEANUP ==="
          df -h
          df -i
          sudo rm -rf \
            /usr/share/dotnet \
            /usr/local/lib/android \
            /opt/ghc \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/share/miniconda \
            /usr/local/lib/node_modules
          if command -v docker >/dev/null 2>&1; then
            docker system prune -af --volumes || true
          fi
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*
          AVAILABLE="$(df -Pk /home/runner | awk 'NR==2 {print $4}')"
          if [ "$AVAILABLE" -lt 8388608 ]; then
            echo "ERROR: menos de 8 GiB disponíveis após a limpeza." >&2
            df -h
            exit 1
          fi
          echo "=== DISK AFTER CLEANUP ==="
          df -h

      - name: Install host dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential gcc g++ make bc bison flex gawk \
            ccache cpio file git curl wget patch rsync unzip zip \
            python3 python3-pip python3-setuptools python3-dev \
            cmake pkg-config perl gettext ca-certificates \
            libncurses-dev libssl-dev libelf-dev libffi-dev \
            zlib1g-dev zstd xz-utils
          git --version
          gcc --version
          make --version
          python3 --version
          cmake --version
          ccache --version

      - name: Restore Buildroot download and compiler caches
        id: buildroot-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/xwt-buildroot-dl
            ~/.cache/xwt-buildroot-ccache
          key: ${{ runner.os }}-xwt-${{ env.XWT_VERSION }}-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-cache-v3
          restore-keys: |
            ${{ runner.os }}-xwt-${{ env.XWT_VERSION }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$CCACHE_DIR" "$BR2_DL_DIR"
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --zero-stats || true
          ccache --show-stats
          du -sh "$BR2_DL_DIR" || true

      - name: Locate or safely extract and verify the 0.13.0 source
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os
          import shutil
          import stat
          import subprocess
          import zipfile
          from pathlib import Path, PurePosixPath

          workspace = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          extraction = Path(os.environ["RUNNER_TEMP"]) / "xwt-project"
          required = (
              "VERSION",
              "REVISION.txt",
              "linux/buildroot.config",
              "linux/boot/kboot.conf",
              "linux/post-build.sh",
              "linux/src/xwt-gamepad-keys.c",
              "linux/src/xwt-desktop.c",
              "linux/overlay/etc/dialogrc",
              "linux/overlay/etc/init.d/S15gamepad",
              "linux/overlay/etc/init.d/S30storage",
              "linux/overlay/etc/init.d/S40network",
              "linux/overlay/etc/init.d/S45wifi",
              "linux/overlay/etc/init.d/S46time",
              "linux/overlay/usr/sbin/xwt-wifi",
              "linux/overlay/usr/sbin/xwt-network",
              "linux/overlay/usr/sbin/xwt-system-menu",
              "linux/overlay/usr/sbin/xwt-system-menu-text",
              "linux/overlay/usr/sbin/xwt-audio",
              "linux/overlay/usr/sbin/xwt-wifi-config.py",
              "linux/overlay/usr/sbin/xwt-time-sync.py",
              "scripts/package_linux_usb.py",
              "scripts/test_package_linux_usb.py",
              "scripts/test_linux_network.py",
              "scripts/test_desktop.py",
              "scripts/test_nand_boundary.py",
              "README-INSTALL-PT-BR.txt",
          )

          def valid(root: Path) -> bool:
              try:
                  return (
                      root.is_dir()
                      and all((root / name).is_file() for name in required)
                      and (root / "VERSION").read_text().strip() == "0.13.0"
                      and (root / "REVISION.txt").read_text().strip()
                      == "linux-xenon-desktop-shell"
                  )
              except (OSError, UnicodeError):
                  return False

          directories = [workspace] + [
              path for path in workspace.iterdir()
              if path.is_dir() and path.name not in {".git", ".github"}
          ]
          found = [path for path in directories if valid(path)]

          if len(found) == 1:
              project = found[0]
          elif len(found) > 1:
              raise SystemExit("Mais de uma árvore de fonte 0.13.0 foi encontrada.")
          else:
              candidates = []
              for archive in workspace.glob("*.zip"):
                  try:
                      with zipfile.ZipFile(archive) as zf:
                          infos = zf.infolist()
                          names = [info.filename for info in infos]
                          if len(names) != len(set(names)):
                              raise SystemExit(f"ZIP contém caminhos duplicados: {archive.name}")
                          name_set = set(names)
                          for name in names:
                              item = PurePosixPath(name)
                              if (
                                  item.name != "VERSION"
                                  or item.is_absolute()
                                  or ".." in item.parts
                                  or "\\" in name
                                  or "\x00" in name
                                  or (item.parts and item.parts[0].endswith(":"))
                              ):
                                  continue
                              prefix = "" if str(item.parent) == "." else str(item.parent) + "/"
                              if not all(prefix + entry in name_set for entry in required):
                                  continue
                              version = zf.read(prefix + "VERSION").decode().strip()
                              revision = zf.read(prefix + "REVISION.txt").decode().strip()
                              if version == "0.13.0" and revision == "linux-xenon-desktop-shell":
                                  candidates.append((archive, prefix, infos))
                  except (OSError, zipfile.BadZipFile, KeyError, UnicodeError):
                      continue

              if len(candidates) != 1:
                  raise SystemExit(
                      "Não encontrei uma única fonte válida 0.13.0. "
                      "Mantenha a pasta do projeto ou um único ZIP-fonte 0.13.0 na raiz."
                  )

              archive, prefix, infos = candidates[0]
              shutil.rmtree(extraction, ignore_errors=True)
              extraction.mkdir(parents=True, exist_ok=True)
              total_size = 0

              with zipfile.ZipFile(archive) as zf:
                  for info in infos:
                      name = info.filename
                      item = PurePosixPath(name)
                      mode = info.external_attr >> 16
                      if (
                          item.is_absolute()
                          or ".." in item.parts
                          or "\\" in name
                          or "\x00" in name
                          or (item.parts and item.parts[0].endswith(":"))
                          or stat.S_ISLNK(mode)
                      ):
                          raise SystemExit(f"Caminho inseguro no ZIP: {name!r}")

                      total_size += info.file_size
                      if info.file_size > 128 * 1024 * 1024 or total_size > 768 * 1024 * 1024:
                          raise SystemExit("ZIP fonte ultrapassa o limite seguro de 768 MiB.")
                      if info.is_dir():
                          continue

                      destination = extraction.joinpath(*item.parts)
                      destination.parent.mkdir(parents=True, exist_ok=True)
                      with zf.open(info) as source, destination.open("wb") as target:
                          shutil.copyfileobj(source, target)
                      destination.chmod(0o755 if mode & 0o111 else 0o644)

              project = extraction / prefix if prefix else extraction
              if not valid(project):
                  raise SystemExit("A estrutura extraída não corresponde à fonte 0.13.0.")

          manifest = project / "SOURCE-MANIFEST.sha256"
          if manifest.is_file():
              subprocess.run(
                  ["sha256sum", "--check", "SOURCE-MANIFEST.sha256"],
                  cwd=project,
                  check=True,
              )

          # Keep the 32-bit Xenon boot image in images/, outside the PPC64 rootfs.
          buildroot_config = project / "linux" / "buildroot.config"
          config_lines = buildroot_config.read_text(encoding="utf-8").splitlines()
          install_target = "BR2_LINUX_KERNEL_INSTALL_TARGET"
          config_lines = [
              line for line in config_lines
              if not line.startswith(install_target + "=")
              and line != f"# {install_target} is not set"
          ]
          config_lines.append(f"# {install_target} is not set")
          buildroot_config.write_text("\n".join(config_lines) + "\n", encoding="utf-8")

          github_env = Path(os.environ["GITHUB_ENV"])
          with github_env.open("a", encoding="utf-8") as env_file:
              env_file.write(f"PROJECT_DIR={project}\n")
              env_file.write(
                  "XWT_ASSET_PREFIX="
                  f"X360-Web-Total-{os.environ['XWT_VERSION']}-Xenon-Linux-"
                  f"{os.environ['GITHUB_SHA'][:12]}\n"
              )
          print(f"Fonte validada: {project}")
          PY

      - name: Run source, shell, Python, C and NAND-safety tests
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$PROJECT_DIR"

          for script in \
            linux/post-build.sh \
            linux/overlay/etc/init.d/S15gamepad \
            linux/overlay/etc/init.d/S30storage \
            linux/overlay/etc/init.d/S40network \
            linux/overlay/etc/init.d/S45wifi \
            linux/overlay/etc/init.d/S46time \
            linux/overlay/usr/sbin/xwt-network \
            linux/overlay/usr/sbin/xwt-wifi \
            linux/overlay/usr/sbin/xwt-system-menu \
            linux/overlay/usr/sbin/xwt-system-menu-text \
            linux/overlay/usr/sbin/xwt-audio
          do
            sh -n "$script"
          done

          python3 -m py_compile \
            scripts/package_linux_usb.py \
            scripts/test_package_linux_usb.py \
            scripts/test_linux_network.py \
            scripts/test_desktop.py \
            linux/overlay/usr/sbin/xwt-wifi-config.py \
            linux/overlay/usr/sbin/xwt-time-sync.py

          (cd scripts && python3 -m unittest -v \
            test_package_linux_usb test_linux_network test_desktop)

          python3 scripts/test_nand_boundary.py

          cmake -S browser -B "$RUNNER_TEMP/xwt-host-regression" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS='-Wall -Wextra -Wpedantic -Werror'
          cmake --build "$RUNNER_TEMP/xwt-host-regression" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/xwt-host-regression" \
            --output-on-failure --no-tests=error

      - name: Fetch exact Free60 Xenon kernel support
        shell: bash
        run: |
          set -Eeuo pipefail
          FREE60_DIR="$RUNNER_TEMP/free60-xenon"
          git init "$FREE60_DIR"
          git -C "$FREE60_DIR" remote add origin \
            https://github.com/Free60Project/linux-kernel-xbox360.git
          git -C "$FREE60_DIR" fetch --depth=1 origin "$FREE60_COMMIT"
          git -C "$FREE60_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$FREE60_DIR" rev-parse HEAD)" = "$FREE60_COMMIT"
          test -s "$FREE60_DIR/xenon-7.2.defconfig"
          test -s "$FREE60_DIR/patch-7.2-xenon0.30.diff"

          cp "$FREE60_DIR/xenon-7.2.defconfig" \
            "$PROJECT_DIR/linux/xenon-7.2.defconfig"

          python3 - "$PROJECT_DIR/linux/xenon-7.2.defconfig" <<'PY'
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          options = {
              "CONFIG_DRM_FBDEV_EMULATION": "y",
              "CONFIG_FRAMEBUFFER_CONSOLE": "y",
              "CONFIG_VT": "y",
              "CONFIG_VT_CONSOLE": "y",
              "CONFIG_UNIX98_PTYS": "y",
              "CONFIG_TMPFS": "y",
              "CONFIG_FB": "y",
              "CONFIG_FAT_FS": "y",
              "CONFIG_VFAT_FS": "y",
              "CONFIG_USB_STORAGE": "y",
              "CONFIG_USB_EHCI_HCD": "y",
              "CONFIG_USB_OHCI_HCD": "y",
              "CONFIG_SCSI": "y",
              "CONFIG_BLK_DEV_SD": "y",
              "CONFIG_INPUT_EVDEV": "y",
              "CONFIG_DEVTMPFS": "y",
              "CONFIG_DEVTMPFS_MOUNT": "y",
              "CONFIG_PROC_FS": "y",
              "CONFIG_SYSFS": "y",
              "CONFIG_UEVENT_HELPER": "y",
              "CONFIG_INPUT_UINPUT": "m",
              "CONFIG_INPUT_JOYDEV": "m",
              "CONFIG_JOYSTICK_XPAD": "m",
              "CONFIG_USB_HID": "y",
              "CONFIG_HID_GENERIC": "y",
              "CONFIG_SND_USB_AUDIO": "m",
          }
          pattern = re.compile(r"^(?:# )?(CONFIG_[A-Z0-9_]+)(?:=.*| is not set)$")
          lines = []
          for line in path.read_text().splitlines():
              match = pattern.match(line)
              if not match or match.group(1) not in options:
                  lines.append(line)
          lines.extend(f"{name}={value}" for name, value in options.items())
          path.write_text("\n".join(lines) + "\n")
          PY

          for required in \
            '^CONFIG_PPC64=y$' \
            '^CONFIG_DRM_XENOS=y$' \
            '^CONFIG_SIS190=y$' \
            '^CONFIG_CFG80211=m$' \
            '^CONFIG_MAC80211=m$' \
            '^CONFIG_JOYSTICK_XPAD=m$' \
            '^CONFIG_INPUT_JOYDEV=m$' \
            '^CONFIG_INPUT_UINPUT=m$'
          do
            grep -q "$required" "$PROJECT_DIR/linux/xenon-7.2.defconfig" || {
              echo "Free60 defconfig não contém opção obrigatória: $required" >&2
              exit 1
            }
          done

          git -C "$FREE60_DIR" rev-parse HEAD \
            | tee "$RUNNER_TEMP/free60-commit.txt"

      - name: Fetch exact Buildroot source
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILDROOT_DIR="$RUNNER_TEMP/buildroot"
          git init "$BUILDROOT_DIR"
          git -C "$BUILDROOT_DIR" remote add origin \
            https://github.com/buildroot/buildroot.git
          git -C "$BUILDROOT_DIR" fetch --depth=1 origin "$BUILDROOT_COMMIT"
          git -C "$BUILDROOT_DIR" checkout --detach FETCH_HEAD
          test "$(git -C "$BUILDROOT_DIR" rev-parse HEAD)" = "$BUILDROOT_COMMIT"
          git -C "$BUILDROOT_DIR" rev-parse HEAD \
            | tee "$RUNNER_TEMP/buildroot-commit.txt"

      - name: Keep Xenon kernel image out of the PPC64 target rootfs
        shell: bash
        run: |
          set -Eeuo pipefail
          MAKEFILE="$RUNNER_TEMP/buildroot/linux/linux.mk"
          test -s "$MAKEFILE"
          python3 - "$MAKEFILE" <<'PY'
          import sys
          from pathlib import Path
          path = Path(sys.argv[1])
          text = path.read_text(encoding="utf-8")
          old = "\t$(LINUX_INSTALL_KERNEL_IMAGE_TO_TARGET)\n"
          new = "\t# XWT: keep zImage.xenon in images/; it is not a PPC64 userspace binary.\n"
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"Esperava uma chamada de instalação do kernel, encontrei {count}; build interrompido.")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          if "$(LINUX_INSTALL_KERNEL_IMAGE_TO_TARGET)" in path.read_text(encoding="utf-8"):
              raise SystemExit("A chamada de instalação do kernel ainda existe.")
          print("OK: zImage.xenon continuará apenas em images/.")
          PY

      - name: Configure and validate Buildroot toolchain and packages
        shell: bash
        run: |
          set -Eeuo pipefail
          export BR2_DL_DIR="$HOME/.cache/xwt-buildroot-dl"
          mkdir -p "$BR2_DL_DIR" "$HOME/.cache/xwt-buildroot-ccache"

          OUTPUT="$RUNNER_TEMP/buildroot-output"
          mkdir -p "$OUTPUT"
          cp "$PROJECT_DIR/linux/buildroot.config" "$OUTPUT/.config"
          sed -i \
            -e "s|@PROJECT_ROOT@|$PROJECT_DIR|g" \
            -e "s|@FREE60_ROOT@|$RUNNER_TEMP/free60-xenon|g" \
            -e "s|@BUILDROOT_OUTPUT@|$OUTPUT|g" \
            "$OUTPUT/.config"

          # Select Linux 7.2 headers explicitly. Buildroot's default "headers as kernel"
          # path resolves to the generic 2.6 minimum here, which disables glibc and
          # iproute2. Both packages need newer headers (glibc >= 3.2, iproute2 >= 3.4).
          python3 - "$OUTPUT/.config" "$HOME" <<'PY'
          import re
          import sys
          from pathlib import Path

          config = Path(sys.argv[1])
          home = sys.argv[2]
          lines = config.read_text().splitlines()
          values = {
              "BR2_KERNEL_HEADERS_7_2": "y",
              "BR2_TOOLCHAIN_BUILDROOT": "y",
              "BR2_TOOLCHAIN_BUILDROOT_GLIBC": "y",
              "BR2_PACKAGE_BUSYBOX_SHOW_OTHERS": "y",
              "BR2_CCACHE": "y",
              "BR2_CCACHE_DIR": f'"{home}/.cache/xwt-buildroot-ccache"',
          }
          for symbol, value in values.items():
              lines = [
                  line for line in lines
                  if not line.startswith(symbol + "=")
                  and line != f"# {symbol} is not set"
              ]
              lines.append(f"{symbol}={value}")
          install_target = "BR2_LINUX_KERNEL_INSTALL_TARGET"
          lines = [
              line for line in lines
              if not line.startswith(install_target + "=")
              and line != f"# {install_target} is not set"
          ]
          lines.append(f"# {install_target} is not set")
          config.write_text("\n".join(lines) + "\n")
          PY

          make -C "$RUNNER_TEMP/buildroot" O="$OUTPUT" olddefconfig \
            2>&1 | tee "$RUNNER_TEMP/buildroot-configure.log"

          CONFIG_FILE="$OUTPUT/.config"
          require_config() {
            expected="$1"
            symbol="${expected%%=*}"
            if ! grep -Fqx -- "$expected" "$CONFIG_FILE"; then
              echo "Buildroot não preservou a configuração exigida:" >&2
              echo "  esperado: $expected" >&2
              grep -E "^${symbol}=|^# ${symbol} is not set$" \
                "$CONFIG_FILE" >&2 || true
              echo "Toolchain resolvida:" >&2
              grep -E '^(BR2_KERNEL_HEADERS_|BR2_TOOLCHAIN_BUILDROOT|BR2_TOOLCHAIN_USES_|BR2_TOOLCHAIN_HAS_THREADS|BR2_USE_WCHAR)=' \
                "$CONFIG_FILE" >&2 || true
              exit 1
            fi
          }

          # Platform and ABI.
          require_config 'BR2_powerpc64=y'
          require_config 'BR2_powerpc_970=y'
          require_config 'BR2_KERNEL_HEADERS_7_2=y'
          require_config 'BR2_TOOLCHAIN_BUILDROOT=y'
          require_config 'BR2_TOOLCHAIN_BUILDROOT_GLIBC=y'
          require_config 'BR2_TOOLCHAIN_USES_GLIBC=y'
          require_config 'BR2_TOOLCHAIN_HAS_THREADS=y'
          require_config 'BR2_USE_WCHAR=y'
          require_config '# BR2_LINUX_KERNEL_INSTALL_TARGET is not set'

          # NetSurf must use the framebuffer SDL frontend, not X11/Wayland.
          require_config 'BR2_PACKAGE_NETSURF=y'
          require_config 'BR2_PACKAGE_NETSURF_SDL=y'
          require_config 'BR2_PACKAGE_SDL=y'
          require_config 'BR2_PACKAGE_SDL_FBCON=y'
          require_config 'BR2_PACKAGE_SDL_TTF=y'

          # Ethernet/Wi-Fi tools and firmware database.
          require_config 'BR2_PACKAGE_WPA_SUPPLICANT=y'
          require_config 'BR2_PACKAGE_WPA_SUPPLICANT_NL80211=y'
          require_config 'BR2_PACKAGE_WIRELESS_REGDB=y'
          require_config 'BR2_PACKAGE_IW=y'
          require_config 'BR2_PACKAGE_IPROUTE2=y'

          # Real HTTPS backend and trust store; do not test the hidden FORCE_TLS symbol.
          require_config 'BR2_PACKAGE_LIBCURL=y'
          require_config 'BR2_PACKAGE_LIBCURL_CURL=y'
          require_config 'BR2_PACKAGE_LIBCURL_OPENSSL=y'
          require_config 'BR2_PACKAGE_OPENSSL=y'
          require_config 'BR2_PACKAGE_CA_CERTIFICATES=y'

          # Native desktop dependencies and system tools.
          require_config 'BR2_PACKAGE_PYTHON3=y'
          require_config 'BR2_PACKAGE_DIALOG=y'
          require_config 'BR2_PACKAGE_KMOD=y'
          require_config 'BR2_PACKAGE_KMOD_TOOLS=y'
          require_config 'BR2_PACKAGE_DEJAVU=y'
          require_config 'BR2_PACKAGE_DEJAVU_SANS=y'
          require_config 'BR2_PACKAGE_ALSA_LIB=y'
          require_config 'BR2_PACKAGE_ALSA_UTILS=y'

          # Kernel image and compressed CPIO initramfs.
          require_config 'BR2_LINUX_KERNEL=y'
          require_config 'BR2_LINUX_KERNEL_CUSTOM_VERSION=y'
          require_config 'BR2_LINUX_KERNEL_CUSTOM_VERSION_VALUE="7.2"'
          require_config 'BR2_LINUX_KERNEL_IMAGE_TARGET_NAME="zImage.xenon"'
          require_config 'BR2_TARGET_ROOTFS_CPIO=y'
          require_config 'BR2_TARGET_ROOTFS_CPIO_GZIP=y'

          grep -Fq "$PROJECT_DIR/linux/post-build.sh" "$CONFIG_FILE"
          grep -Fq "$RUNNER_TEMP/buildroot-output" "$CONFIG_FILE"
          echo "Buildroot validado: PowerPC64/glibc + NetSurf SDL/framebuffer + HTTPS/OpenSSL."

      - name: Prepare SDL staging and correct the post-build SDL check
        shell: bash
        run: |
          set -Eeuo pipefail
          BUILDROOT_DIR="$RUNNER_TEMP/buildroot"
          OUTPUT="$RUNNER_TEMP/buildroot-output"
          CONFIG="$OUTPUT/.config"
          ORIGINAL="$PROJECT_DIR/linux/post-build.sh"
          PATCHED="$PROJECT_DIR/linux/xwt-post-build-effective.sh"
          WRAPPER="$RUNNER_TEMP/xwt-post-build-wrapper.sh"

          grep -Fqx 'BR2_PACKAGE_SDL=y' "$CONFIG"
          grep -Fqx 'BR2_PACKAGE_SDL_TTF=y' "$CONFIG"
          test -s "$ORIGINAL"

          STAGING_DIR="$(
            make -s -C "$BUILDROOT_DIR" O="$OUTPUT" printvars VARS=STAGING_DIR \
              | sed -n 's/^STAGING_DIR[[:space:]]*=[[:space:]]*//p' \
              | tail -n 1
          )"
          if [ -z "$STAGING_DIR" ]; then
            echo "ERROR: Buildroot não retornou STAGING_DIR." >&2
            make -C "$BUILDROOT_DIR" O="$OUTPUT" printvars VARS=STAGING_DIR || true
            exit 1
          fi
          case "$STAGING_DIR" in
            /*) ;;
            *) STAGING_DIR="$OUTPUT/$STAGING_DIR" ;;
          esac
          STAGING_DIR="$(realpath -m "$STAGING_DIR")"
          HOST_DIR="$OUTPUT/host"
          TARGET_DIR="$OUTPUT/target"
          mkdir -p "$STAGING_DIR/usr/include/SDL" "$STAGING_DIR/usr/include"

          JOBS="$(nproc)"
          if [ "$JOBS" -gt 4 ]; then JOBS=4; fi
          make -C "$BUILDROOT_DIR" O="$OUTPUT" -j"$JOBS" sdl_ttf \
            2>&1 | tee "$RUNNER_TEMP/buildroot-sdl-headers.log"

          for header in SDL.h SDL_ttf.h; do
            source="$(find "$OUTPUT/build" "$OUTPUT/per-package" "$HOST_DIR" "$STAGING_DIR" \
              -type f -name "$header" -print -quit 2>/dev/null || true)"
            if [ -z "$source" ]; then
              echo "ERROR: $header não foi produzido pelo pacote SDL/SDL_ttf." >&2
              find "$OUTPUT" -type f \
                \( -name SDL.h -o -name SDL_ttf.h \) -print 2>/dev/null || true
              exit 1
            fi
            install -D -m 0644 "$source" "$STAGING_DIR/usr/include/SDL/$header"
            install -D -m 0644 "$source" "$STAGING_DIR/usr/include/$header"
            echo "SDL header confirmado: $header ($source)"
          done

          # The earlier guard used a different staging path. Patch only that guard,
          # retaining its failure body and making the check use Buildroot's actual sysroot.
          python3 - "$ORIGINAL" "$PATCHED" <<'PY'
          import re
          import sys
          from pathlib import Path

          original, patched = map(Path, sys.argv[1:])
          lines = original.read_text(encoding="utf-8").splitlines()
          marker = "SDL/SDL_ttf headers are missing from Buildroot staging"
          matches = [i for i, line in enumerate(lines) if marker in line]
          if len(matches) != 1:
              raise SystemExit(
                  f"Esperava uma mensagem de validação SDL no post-build.sh; encontrei {len(matches)}."
              )
          message_index = matches[0]
          start = None
          for i in range(message_index, -1, -1):
              if re.match(r"^\s*if\b", lines[i]):
                  start = i
                  break
          if start is None:
              raise SystemExit("Não encontrei o if que protege a validação SDL.")
          then_index = None
          for i in range(start, message_index + 1):
              if re.search(r"\bthen\b", lines[i]):
                  then_index = i
                  break
          if then_index is None:
              raise SystemExit("Não encontrei o then do teste SDL.")
          condition = "\n".join(lines[start:then_index + 1])
          if "SDL" not in condition or "STAGING" not in condition:
              raise SystemExit("O if localizado não parece ser o teste de cabeçalhos SDL.")
          replacement = [
              'if [ ! -s "${XWT_BUILDROOT_STAGING_DIR}/usr/include/SDL/SDL.h" ] || [ ! -s "${XWT_BUILDROOT_STAGING_DIR}/usr/include/SDL/SDL_ttf.h" ]; then',
          ]
          lines[start:then_index + 1] = replacement
          for i, line in enumerate(lines):
              if re.match(r"^\s*(?:export\s+)?STAGING_DIR\s*=", line):
                  lines[i] = 'STAGING_DIR="${XWT_BUILDROOT_STAGING_DIR:?}"; export STAGING_DIR'
          patched.write_text("\n".join(lines) + "\n", encoding="utf-8")
          patched.chmod(0o755)
          print(f"Post-build SDL guard corrigido em {patched}.")
          PY
          sh -n "$PATCHED"

          cat > "$WRAPPER" <<'SH'
          #!/bin/sh
          set -eu
          : "${XWT_BUILDROOT_STAGING_DIR:?missing Buildroot staging directory}"
          : "${XWT_BUILDROOT_HOST_DIR:?missing Buildroot host directory}"
          : "${XWT_BUILDROOT_OUTPUT:?missing Buildroot output directory}"
          : "${XWT_PATCHED_POST_BUILD_SCRIPT:?missing patched post-build script}"
          export STAGING_DIR="$XWT_BUILDROOT_STAGING_DIR"
          export HOST_DIR="$XWT_BUILDROOT_HOST_DIR"
          export BUILDROOT_OUTPUT="$XWT_BUILDROOT_OUTPUT"
          export TARGET_DIR="${1:-$XWT_BUILDROOT_OUTPUT/target}"
          SDL_DIR="$STAGING_DIR/usr/include/SDL"
          mkdir -p "$SDL_DIR" "$STAGING_DIR/usr/include"
          for header in SDL.h SDL_ttf.h; do
            if [ ! -s "$SDL_DIR/$header" ]; then
              source="$(find "$XWT_BUILDROOT_OUTPUT/build" \
                "$XWT_BUILDROOT_OUTPUT/per-package" "$XWT_BUILDROOT_HOST_DIR" \
                "$STAGING_DIR" -type f -name "$header" -print -quit 2>/dev/null || true)"
              if [ -z "$source" ]; then
                echo "ERROR: $header ausente no staging e nos pacotes Buildroot." >&2
                find "$XWT_BUILDROOT_OUTPUT" -type f \
                  \( -name SDL.h -o -name SDL_ttf.h \) -print 2>/dev/null || true
                exit 1
              fi
              install -D -m 0644 "$source" "$SDL_DIR/$header"
            fi
            install -D -m 0644 "$SDL_DIR/$header" "$STAGING_DIR/usr/include/$header"
          done
          test -s "$SDL_DIR/SDL.h"
          test -s "$SDL_DIR/SDL_ttf.h"
          exec "$XWT_PATCHED_POST_BUILD_SCRIPT" "$@"
          SH
          chmod 0755 "$WRAPPER"

          python3 - "$CONFIG" "$ORIGINAL" "$WRAPPER" <<'PY'
          import sys
          from pathlib import Path
          config, original, wrapper = map(Path, sys.argv[1:])
          content = config.read_text(encoding="utf-8")
          old, new = str(original), str(wrapper)
          if content.count(old) != 1:
              raise SystemExit("Esperava exatamente um caminho post-build no .config.")
          config.write_text(content.replace(old, new, 1), encoding="utf-8")
          PY
          make -C "$BUILDROOT_DIR" O="$OUTPUT" olddefconfig \
            2>&1 | tee "$RUNNER_TEMP/buildroot-postbuild-config.log"
          grep -Fq "$WRAPPER" "$CONFIG"

          {
            echo "XWT_BUILDROOT_STAGING_DIR=$STAGING_DIR"
            echo "XWT_BUILDROOT_HOST_DIR=$HOST_DIR"
            echo "XWT_BUILDROOT_OUTPUT=$OUTPUT"
            echo "XWT_PROJECT_DIR=$PROJECT_DIR"
            echo "XWT_PATCHED_POST_BUILD_SCRIPT=$PATCHED"
          } >> "$GITHUB_ENV"

          echo "Buildroot staging real: $STAGING_DIR"
          echo "Post-build wrapper: $WRAPPER"
          echo "Post-build corrigido: $PATCHED"
          test -s "$STAGING_DIR/usr/include/SDL/SDL.h"
          test -s "$STAGING_DIR/usr/include/SDL/SDL_ttf.h"

      - name: Build Linux kernel, modules, desktop, browser and root filesystem
        shell: bash
        run: |
          set -Eeuo pipefail
          export BR2_DL_DIR="$HOME/.cache/xwt-buildroot-dl"
          JOBS="$(nproc)"
          if [ "$JOBS" -gt 4 ]; then JOBS=4; fi
          echo "Compilação Buildroot com $JOBS workers."
          ccache --zero-stats || true

          make -C "$RUNNER_TEMP/buildroot" \
            O="$RUNNER_TEMP/buildroot-output" \
            -j"$JOBS" \
            2>&1 | tee "$RUNNER_TEMP/buildroot-build.log"

          OUTPUT="$RUNNER_TEMP/buildroot-output"
          TARGET="$OUTPUT/target"
          KERNEL_IMAGE="$OUTPUT/images/zImage.xenon"
          ROOTFS_IMAGE="$OUTPUT/images/rootfs.cpio.gz"

          test -s "$KERNEL_IMAGE"
          test -s "$ROOTFS_IMAGE"
          if [ -e "$TARGET/boot/zImage.xenon" ]; then
            echo "ERRO: zImage.xenon foi instalado no rootfs PPC64; deve ficar somente em images/." >&2
            exit 1
          fi
          gzip -t "$ROOTFS_IMAGE"
          file "$KERNEL_IMAGE" "$ROOTFS_IMAGE"

          test -x "$TARGET/usr/sbin/xwt-desktop"
          test -x "$TARGET/usr/sbin/xwt-gamepad-keys"
          test -s "$TARGET/usr/share/fonts/dejavu/DejaVuSans.ttf"

          KERNEL_CONFIG="$(find "$OUTPUT/build" -maxdepth 4 -type f \
            -path '*/linux-*/.config' -print -quit)"
          test -s "$KERNEL_CONFIG"
          for required in \
            '^CONFIG_PPC_XENON=y$' \
            '^CONFIG_PPC64=y$' \
            '^CONFIG_DRM_XENOS=y$' \
            '^CONFIG_DRM_FBDEV_EMULATION=y$' \
            '^CONFIG_FRAMEBUFFER_CONSOLE=y$' \
            '^CONFIG_SIS190=y$' \
            '^CONFIG_USB_STORAGE=y$' \
            '^CONFIG_CFG80211=m$' \
            '^CONFIG_MAC80211=m$' \
            '^CONFIG_JOYSTICK_XPAD=m$' \
            '^CONFIG_INPUT_JOYDEV=m$' \
            '^CONFIG_INPUT_UINPUT=m$' \
            '^CONFIG_USB_HID=y$' \
            '^CONFIG_HID_GENERIC=y$' \
            '^CONFIG_SND_USB_AUDIO=m$'
          do
            grep -q "$required" "$KERNEL_CONFIG" || {
              echo "Configuração do kernel ausente: $required" >&2
              exit 1
            }
          done

          for module in xpad joydev uinput; do
            find "$TARGET/lib/modules" -type f \
              \( -name "$module.ko" -o -name "$module.ko.xz" -o -name "$module.ko.zst" \) \
              -print -quit | grep -q . || {
                echo "Módulo do kernel não foi instalado: $module" >&2
                exit 1
              }
          done

          python3 - "$ROOTFS_IMAGE" <<'PY'
          import gzip
          import sys
          from pathlib import PurePosixPath

          def align4(number):
              return (number + 3) & ~3

          names = set()
          executable = set()
          module_names = set()
          with gzip.open(sys.argv[1], "rb") as archive:
              while True:
                  header = archive.read(110)
                  if not header:
                      break
                  if len(header) != 110 or header[:6] not in (b"070701", b"070702"):
                      raise SystemExit("Cabeçalho CPIO newc inválido.")
                  fields = [int(header[pos:pos + 8], 16) for pos in range(6, 110, 8)]
                  mode, size, name_size = fields[1], fields[6], fields[11]
                  name_raw = archive.read(name_size)
                  if len(name_raw) != name_size or not name_raw.endswith(b"\0"):
                      raise SystemExit("Nome de arquivo CPIO inválido.")
                  name = name_raw[:-1].decode("utf-8", "replace").lstrip("./")
                  member = PurePosixPath(name)
                  if member.is_absolute() or ".." in member.parts:
                      raise SystemExit(f"Caminho inseguro dentro do CPIO: {name}")
                  archive.seek(align4(110 + name_size) - (110 + name_size), 1)
                  if name == "TRAILER!!!":
                      break
                  names.add(name)
                  if mode & 0o111:
                      executable.add(name)
                  if "/lib/modules/" in "/" + name:
                      module_names.add(name)
                  archive.seek(size, 1)
                  archive.seek(align4(size) - size, 1)

          required_files = {
              "etc/dialogrc", "etc/inittab", "etc/mdev.conf",
              "etc/wpa_supplicant/wpa_supplicant.conf", "sbin/mdev",
              "etc/init.d/S15gamepad", "etc/init.d/S30storage",
              "etc/init.d/S40network", "etc/init.d/S45wifi", "etc/init.d/S46time",
              "usr/sbin/xwt-system-menu", "usr/sbin/xwt-system-menu-text",
              "usr/sbin/xwt-desktop", "usr/sbin/xwt-audio", "usr/sbin/xwt-network",
              "usr/sbin/xwt-wifi", "usr/sbin/xwt-wifi-config.py",
              "usr/sbin/xwt-time-sync.py", "usr/sbin/xwt-gamepad-keys",
              "usr/share/fonts/dejavu/DejaVuSans.ttf",
          }
          missing = sorted(required_files - names)
          if missing:
              raise SystemExit("Arquivos ausentes no rootfs: " + ", ".join(missing))

          required_exec = {
              "etc/init.d/S15gamepad", "etc/init.d/S30storage", "etc/init.d/S40network",
              "etc/init.d/S45wifi", "etc/init.d/S46time",
              "usr/sbin/xwt-system-menu", "usr/sbin/xwt-system-menu-text",
              "usr/sbin/xwt-desktop", "usr/sbin/xwt-audio", "usr/sbin/xwt-network",
              "usr/sbin/xwt-wifi", "usr/sbin/xwt-wifi-config.py",
              "usr/sbin/xwt-time-sync.py", "usr/sbin/xwt-gamepad-keys",
          }
          missing_exec = sorted(required_exec - executable)
          if missing_exec:
              raise SystemExit("Arquivos sem permissão de execução: " + ", ".join(missing_exec))

          for module in ("xpad.ko", "joydev.ko", "uinput.ko"):
              if not any(name.endswith(module) or name.endswith(module + ".xz") or name.endswith(module + ".zst") for name in module_names):
                  raise SystemExit(f"Módulo ausente dentro do initramfs: {module}")
          print(f"Initramfs validado: {len(names)} entradas; módulos, serviços e ferramentas conferidos.")
          PY

          ccache --show-stats || true

      - name: Save Buildroot caches even after failed builds
        if: ${{ always() && steps.buildroot-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/xwt-buildroot-dl
            ~/.cache/xwt-buildroot-ccache
          key: ${{ runner.os }}-xwt-${{ env.XWT_VERSION }}-${{ env.BUILDROOT_COMMIT }}-${{ env.FREE60_COMMIT }}-cache-v3

      - name: Run final tests and create verified USB boot package
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 "$PROJECT_DIR/scripts/package_linux_usb.py" \
            --kernel "$RUNNER_TEMP/buildroot-output/images/zImage.xenon" \
            --initrd "$RUNNER_TEMP/buildroot-output/images/rootfs.cpio.gz" \
            --project "$PROJECT_DIR" \
            --output "$RUNNER_TEMP/$XWT_ASSET_PREFIX-USB.zip"
          sha256sum "$RUNNER_TEMP/$XWT_ASSET_PREFIX-USB.zip" \
            | tee "$RUNNER_TEMP/USB-SHA256.txt"

      - name: Create deterministic source archive and release manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - "$PROJECT_DIR" "$RUNNER_TEMP/$XWT_ASSET_PREFIX-source.zip" <<'PY'
          import stat
          import sys
          import zipfile
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          output = Path(sys.argv[2])
          ignored_dirs = {".git", "__pycache__", ".pytest_cache", "build", "output", "CMakeFiles"}
          ignored_suffixes = {".o", ".a", ".so", ".elf", ".pyc", ".zip"}
          files = []
          for path in sorted(root.rglob("*")):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root)
              if any(part in ignored_dirs for part in relative.parts):
                  continue
              if path.suffix.lower() in ignored_suffixes:
                  continue
              if relative.as_posix() in {
                  "SOURCE-MANIFEST.sha256",
                  "linux/xwt-post-build-effective.sh",
              }:
                  continue
              files.append((relative.as_posix(), path))

          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for relative, path in files:
                  info = zipfile.ZipInfo(relative, (2026, 1, 1, 0, 0, 0))
                  mode = 0o755 if path.stat().st_mode & 0o111 else 0o644
                  info.external_attr = (stat.S_IFREG | mode) << 16
                  archive.writestr(info, path.read_bytes())

          with zipfile.ZipFile(output) as archive:
              if archive.testzip():
                  raise SystemExit("Falha de CRC no ZIP-fonte.")
              for name in (
                  "linux/post-build.sh",
                  "linux/overlay/etc/init.d/S40network",
                  "linux/overlay/etc/init.d/S45wifi",
              ):
                  info = archive.getinfo(name)
                  if not ((info.external_attr >> 16) & 0o111):
                      raise SystemExit(f"Permissão executável perdida: {name}")
          print(f"ZIP-fonte validado: {output.stat().st_size} bytes.")
          PY

          USB_NAME="$XWT_ASSET_PREFIX-USB.zip"
          SOURCE_NAME="$XWT_ASSET_PREFIX-source.zip"
          USB_SHA="$(sha256sum "$RUNNER_TEMP/$USB_NAME" | cut -d ' ' -f1)"
          SOURCE_SHA="$(sha256sum "$RUNNER_TEMP/$SOURCE_NAME" | cut -d ' ' -f1)"

          python3 - "$RUNNER_TEMP/latest.json" "$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" "$USB_NAME" "$SOURCE_NAME" "$USB_SHA" "$SOURCE_SHA" <<'PY'
          import json
          import sys
          from pathlib import Path

          output, repository, commit, usb, source, usb_sha, source_sha = sys.argv[1:]
          tag = f"xwt-v0.13.0-linux-{commit[:12]}"
          base = f"https://github.com/{repository}/releases/download/{tag}"
          manifest = {
              "product": "X360 Web Total",
              "version": "0.13.0",
              "revision": "linux-xenon-desktop-shell",
              "channel": "prerelease",
              "commit": commit,
              "release_tag": tag,
              "assets": {
                  "usb_package": f"{base}/{usb}",
                  "source": f"{base}/{source}",
              },
              "sha256": {"usb_package": usb_sha, "source": source_sha},
              "kernel": "Linux 7.2 Xenon port / Xenos DRM / SIS190",
              "desktop": "Native SDL 1.2 + SDL_ttf framebuffer shell, file explorer, system panel, terminal and audio tools",
              "browser": "NetSurf SDL framebuffer / libcurl / OpenSSL / CA certificates",
              "network": "DHCP, default route, DNS and validated HTTPS probe",
              "wifi": "USB WLAN only; compatibility depends on the exact adapter chipset and firmware",
              "youtube": "Not certified; modern YouTube playback is not claimed",
              "nand_write": False,
              "physical_console_tested": False,
          }
          Path(output).write_text(json.dumps(manifest, indent=2) + "\n", encoding="utf-8")
          PY

          cat > "$RUNNER_TEMP/BUILD-REPORT.txt" <<EOF
          X360 Web Total ${XWT_VERSION}
          Revision: ${XWT_REVISION}
          Commit: ${GITHUB_SHA}
          Buildroot: ${BUILDROOT_COMMIT}
          Free60: ${FREE60_COMMIT}
          Target: Xbox 360 Xenon / PowerPC64 big-endian kernel and 32-bit Xenon boot image
          Browser: NetSurf SDL/framebuffer; not Chromium
          TLS: libcurl + OpenSSL + CA certificates
          Boot: XeLL Reloaded kboot.conf from USB; no NAND writes
          Physical console test: not performed by GitHub Actions
          EOF

          (cd "$RUNNER_TEMP" && \
            sha256sum latest.json BUILD-REPORT.txt \
              "$USB_NAME" "$SOURCE_NAME" > SHA256SUMS.txt)

      - name: Upload verified build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: x360-web-total-linux-${{ github.sha }}
          path: |
            ${{ runner.temp }}/*-USB.zip
            ${{ runner.temp }}/*-source.zip
            ${{ runner.temp }}/latest.json
            ${{ runner.temp }}/BUILD-REPORT.txt
            ${{ runner.temp }}/SHA256SUMS.txt
            ${{ runner.temp }}/USB-SHA256.txt
            ${{ runner.temp }}/buildroot-commit.txt
            ${{ runner.temp }}/free60-commit.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload complete Buildroot diagnostics on failure
        if: failure()
        shell: bash
        run: |
          set -Eeuo pipefail
          DIAG="$RUNNER_TEMP/xwt-diagnostics"
          mkdir -p "$DIAG"
          for source in \
            "$RUNNER_TEMP/buildroot-output/.config" \
            "$RUNNER_TEMP/buildroot-configure.log" \
            "$RUNNER_TEMP/buildroot-build.log" \
            "$RUNNER_TEMP/free60-commit.txt" \
            "$RUNNER_TEMP/buildroot-commit.txt"; do
            if [ -f "$source" ]; then
              cp "$source" "$DIAG/$(basename "$source" | sed 's/^\.config$/buildroot-dot-config.txt/')"
            fi
          done
          if [ -f "$RUNNER_TEMP/buildroot-output/.config" ]; then
            grep -E '^(BR2_(powerpc|TOOLCHAIN|PACKAGE_NETSURF|PACKAGE_LIBCURL|PACKAGE_OPENSSL|PACKAGE_CA_CERTIFICATES|LINUX_KERNEL|TARGET_ROOTFS_CPIO))=|^# BR2_TOOLCHAIN' \
              "$RUNNER_TEMP/buildroot-output/.config" > "$DIAG/buildroot-key-options.txt" || true
          fi
          if [ -d "$RUNNER_TEMP/buildroot-output/build/buildroot-config" ]; then
            cp -a "$RUNNER_TEMP/buildroot-output/build/buildroot-config" "$DIAG/kconfig-host" || true
          fi
          printf 'Run: %s\nCommit: %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > "$DIAG/run-info.txt"

      - name: Upload diagnostic artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: xwt-0.13.0-build-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/xwt-diagnostics/
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6

      - name: Build summary
        if: always()
        shell: bash
        run: |
          {
            echo '## X360 Web Total 0.13.0 — Xenon Linux build'
            echo "Commit: $GITHUB_SHA"
            echo "Buildroot: $BUILDROOT_COMMIT"
            echo "Free60: $FREE60_COMMIT"
            echo 'Target: Xbox 360 Xenon / PowerPC64 big-endian.'
            echo 'Desktop: native SDL 1.2 + SDL_ttf framebuffer interface.'
            echo 'Browser: NetSurf SDL/framebuffer; not Chromium.'
            echo 'HTTPS: libcurl + OpenSSL + CA certificates.'
            echo 'Network: SIS190 Ethernet; Wi-Fi only through a compatible USB adapter.'
            echo 'Boot: XeLL Reloaded kboot.conf from USB. No NAND write operations.'
            echo 'Physical Xbox 360 testing is still required.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-release:
    name: Publish prerelease (trusted branch only)
    needs: build-linux
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v7
        with:
          name: x360-web-total-linux-${{ github.sha }}
          path: ${{ runner.temp }}/release-assets

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          cd "$RUNNER_TEMP/release-assets"
          TAG="xwt-v${XWT_VERSION}-linux-${GITHUB_SHA:0:12}"
          TITLE="X360 Web Total ${XWT_VERSION} — Xenon Linux (${GITHUB_SHA:0:12})"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<EOF
          # X360 Web Total ${XWT_VERSION} — Xenon Linux

          - Linux 7.2 com suporte Xenon/Xenos do projeto Free60.
          - Desktop SDL 1.2/SDL_ttf em framebuffer, com explorador, painel de sistema e terminal.
          - NetSurf SDL, libcurl/OpenSSL e certificados CA.
          - Ethernet SIS190; Wi-Fi somente com adaptador USB compatível.
          - Inicialização por XeLL Reloaded e kboot.conf no USB.
          - Nenhuma gravação na NAND é executada pelo pacote.

          **Limitações:** NetSurf não é Chromium. YouTube moderno e reprodução atual de vídeo web não foram certificados. Compatibilidade de Wi-Fi varia por chipset. O artefato ainda precisa ser testado em um Xbox 360 físico.
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              ./*-USB.zip ./*-source.zip latest.json BUILD-REPORT.txt SHA256SUMS.txt \
              --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES" --prerelease
          else
            gh release create "$TAG" \
              ./*-USB.zip ./*-source.zip latest.json BUILD-REPORT.txt SHA256SUMS.txt \
              --target "$GITHUB_SHA" \
              --title "$TITLE" \
              --notes-file "$NOTES" \
              --prerelease
          fi
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" \
            >> "$GITHUB_STEP_SUMMARY"